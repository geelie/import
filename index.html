            return `<tr><td><input value="${(d.nume || "").replace(/"/g, "&quot;")}" oninput="odocF(${i},'nume',this.value)"></td><td style="text-align:center"><input type="checkbox" ${d.primit ? "checked" : ""} onchange="odocF(${i},'primit',this.checked)" style="width:16px;height:16px;accent-color:var(--primary)"></td><td style="padding:0"><input type="date" value="${d.data || ""}" onchange="odocF(${i},'data',this.value)" style="width:100%;border:none;background:transparent;padding:8px 10px"></td><td style="padding:5px 8px">${f ? `<div style="display:flex;gap:5px;align-items:center"><button class="df-btn" style="padding:5px 9px" onclick="openFile('${f.id}','${f.type}')" title="${(f.name || "").replace(/"/g, "&quot;")}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button><button class="df-btn del" style="padding:5px 9px" onclick="odocFileRemove(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>` : `<button class="df-btn up" style="padding:5px 10px" onclick="document.getElementById('odocInput_${i}').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0-12l-4 4m4-4l4 4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Încarcă</button>`}<input type="file" id="odocInput_${i}" style="display:none" onchange="odocUpload(${i},this.files);this.value=''"></td><td class="rm"><button class="grid-rm" onclick="rmOdoc(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></td></tr>`;
          })
          .join("");
      }
      function odocF(i, k, v) {
        curOffer().docs[i][k] = v;
        save();
      }
      function addOdoc() {
        curOffer().docs.push({ nume: "", primit: false, data: "", file: null });
        save();
        refreshOdocs();
      }
      function rmOdoc(i) {
        const o = curOffer();
        if (o.docs[i].file) fileDel(o.docs[i].file);
        o.docs.splice(i, 1);
        save();
        refreshOdocs();
      }
      function odocUpload(i, files) {
        if (!files.length) return;
        compressFile(files[0], async (data, name, type) => {
          const rec = await fileAdd(data, name, type);
          if (rec) {
            const o = curOffer();
            if (o.docs[i].file) await fileDel(o.docs[i].file);
            o.docs[i].file = rec;
            o.docs[i].primit = true;
            if (!o.docs[i].data) o.docs[i].data = today();
            save();
            refreshOdocs();
            toast("Fișier încărcat");
          }
        });
      }
      function odocFileRemove(i) {
        const o = curOffer();
        fileDel(o.docs[i].file);
        o.docs[i].file = null;
        save();
        refreshOdocs();
      }

      /* CTC */
      function refreshCtc() {
        const o = curOffer();
        document.getElementById("ctcRows").innerHTML = o.ctc
          .map((c, i) => {
            const cls =
              c.rezultat === "OK" ? "ok" : c.rezultat === "NOK" ? "nok" : "";
            return `<tr><td><input value="${(c.criteriu || "").replace(/"/g, "&quot;")}" oninput="ctcF(${i},'criteriu',this.value)"></td><td style="padding:0"><select class="ctc-res ${cls}" onchange="ctcF(${i},'rezultat',this.value)">${["—", "OK", "NOK", "N/A"].map((r) => `<option ${c.rezultat === r ? "selected" : ""}>${r}</option>`).join("")}</select></td><td><input value="${(c.obs || "").replace(/"/g, "&quot;")}" oninput="ctcF(${i},'obs',this.value)" placeholder="—"></td></tr>`;
          })
          .join("");
        const pass = o.ctc.filter((c) => c.rezultat === "OK").length;
        const sc = document.getElementById("s_ctc");
        if (sc) sc.textContent = pass + "/" + o.ctc.length;
      }
      function ctcF(i, k, v) {
        curOffer().ctc[i][k] = v;
        save();
        if (k === "rezultat") refreshCtc();
      }
      function addCtc() {
        curOffer().ctc.push({ criteriu: "", rezultat: "—", obs: "" });
        save();
        refreshCtc();
      }

      /* scorecard ponderat */
      function refreshEval() {
        const o = curOffer();
        const body = document.getElementById("evalRows");
        if (!body) return;
        body.innerHTML = o.evaluare
          .map(
            (c, i) =>
              `<tr><td><input value="${(c.criteriu || "").replace(/"/g, "&quot;")}" oninput="evalF(${i},'criteriu',this.value)"></td><td style="padding:0"><input type="number" value="${c.pondere || ""}" oninput="evalF(${i},'pondere',+this.value)" style="width:100%;border:none;background:transparent;padding:8px 10px;text-align:right;font-family:var(--mono)"></td><td style="padding:0"><select onchange="evalF(${i},'nota',+this.value)" style="width:100%;border:none;background:transparent;padding:8px;text-align:right;font-weight:600">${[0, 1, 2, 3, 4, 5].map((n) => `<option value="${n}" ${(+c.nota || 0) === n ? "selected" : ""}>${n || "—"}</option>`).join("")}</select></td><td class="calc" style="padding:8px 10px;text-align:right;font-family:var(--mono);font-weight:600;color:var(--muted)">${((+c.nota || 0) * (+c.pondere || 0)).toFixed(0)}</td><td class="rm"><button class="grid-rm" onclick="rmEval(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></td></tr>`,
          )
          .join("");
        const wsum = o.evaluare.reduce((s, c) => s + (+c.pondere || 0), 0);
        const we = document.getElementById("wsum");
        if (we)
          we.innerHTML = `Total pondere: <span class="${wsum !== 100 ? "wsum-warn" : ""}" style="font-family:var(--mono)">${wsum}%</span>${wsum !== 100 ? " (recomandat 100%)" : ""}`;
        const sc = computeScore(o);
        const sb = document.getElementById("scoreBig");
        if (sb)
          sb.innerHTML = `<div><span class="sb-num">${sc.toFixed(1)}</span><span class="sb-of"> / 5</span></div>${starsHTML(Math.round(sc), false)}<div style="margin-left:auto;text-align:right"><div style="font-weight:800;font-size:14px;color:var(--primary-d)">${sc >= 4 ? "Recomandat" : sc >= 3 ? "Acceptabil" : sc > 0 ? "Sub prag" : "Neevaluat"}</div><div class="sub">${Math.round((sc / 5) * 100)}% din maxim</div></div>`;
      }
      function evalF(i, k, v) {
        curOffer().evaluare[i][k] = v;
        save();
        refreshEval();
      }
      function addEval() {
        curOffer().evaluare.push({ criteriu: "", pondere: 0, nota: 0 });
        save();
        refreshEval();
      }
      function rmEval(i) {
        curOffer().evaluare.splice(i, 1);
        save();
        refreshEval();
      }

      /* AQL */
      function aqlSet(k, v) {
        curOffer()[k] = (v === "" || Number.isNaN(v)) && k === "aqlLot" ? 0 : v;
        save();
        refreshAql();
      }
      function refreshAql() {
        const o = curOffer();
        const el = document.getElementById("aqlPlan");
        if (!el) return;
        const lot = +o.aqlLot || 0;
        if (lot < 2) {
          el.innerHTML =
            '<span style="font-size:12px;color:var(--muted-2);font-style:italic">Introdu dimensiunea lotului pentru planul de eșantionare.</span>';
          return;
        }
        const card = (t, p, aql) =>
          `<div class="aql-card"><div class="ac-t">${t} · AQL ${aql}%</div><div class="ac-row"><span>Cod literă (Level II)</span><b>${p.letter}</b></div><div class="ac-row"><span>Eșantion de verificat</span><b>${p.n} buc</b></div><div class="ac-row"><span>Acceptă lotul dacă</span><b class="ac-acc">defecte ≤ ${p.ac}</b></div><div class="ac-row"><span>Respinge lotul dacă</span><b class="ac-rej">defecte ≥ ${p.re}</b></div></div>`;
        el.innerHTML =
          card("Defecte majore", aqlPlan(lot, o.aqlMajor), o.aqlMajor) +
          card("Defecte minore", aqlPlan(lot, o.aqlMinor), o.aqlMinor);
      }

      /* conformitate EEC */
      function refreshEEC() {
        const o = curOffer();
        const body = document.getElementById("eecRows");
        if (!body) return;
        let html = "",
          lastG = "";
        o.conformEEC.forEach((c, i) => {
          if (c.grup !== lastG) {
            lastG = c.grup;
            html += `<tr class="eec-grp"><td colspan="4">${c.grup}</td></tr>`;
          }
          const cls =
            c.rezultat === "Conform"
              ? "ok"
              : c.rezultat === "Neconform"
                ? "nok"
                : "";
          const np = (c.poze || []).length;
          html += `<tr><td><b style="font-weight:700">${c.parte}</b><div class="sub">${c.criteriu}</div><button class="eec-photobtn ${np ? "has" : ""}" onclick="openEecPhotos(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>${np ? np + " poze" : "Adaugă poze"}</button></td><td style="padding:0"><input value="${(c.eec || "").replace(/"/g, "&quot;")}" oninput="eecF(${i},'eec',this.value)" placeholder="—" style="width:100%;border:none;background:transparent;padding:8px 10px"></td><td style="padding:0"><input value="${(c.produs || "").replace(/"/g, "&quot;")}" oninput="eecF(${i},'produs',this.value)" placeholder="—" style="width:100%;border:none;background:transparent;padding:8px 10px"></td><td style="padding:0"><select class="ctc-res ${cls}" onchange="eecF(${i},'rezultat',this.value)">${["—", "Conform", "Neconform", "N/A"].map((r) => `<option ${c.rezultat === r ? "selected" : ""}>${r}</option>`).join("")}</select></td></tr>`;
        });
        body.innerHTML = html;
        const dc = document.getElementById("eecDocChips");
        if (dc)
          dc.innerHTML = EEC_DOCS.map(([k, l]) => {
            const f = o.eecDocsFiles[k];
            return `<div class="docfile ${f ? "has" : ""}"><div class="df-info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6"/></svg><div><div class="df-name">${l}</div><div class="df-sub">${f ? f.name : "niciun fișier"}</div></div></div><div class="df-act">${f ? `<button class="df-btn" onclick="openFile('${f.id}','${f.type}')" title="Vizualizează"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button><button class="df-btn del" onclick="eecDocRemove('${k}')" title="Șterge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>` : `<button class="df-btn up" onclick="document.getElementById('eecDocInput_${k}').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0-12l-4 4m4-4l4 4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Încarcă</button>`}<input type="file" id="eecDocInput_${k}" style="display:none" onchange="eecDocUpload('${k}',this.files);this.value=''"></div></div>`;
          }).join("");
        const st = eecStats(o);
        const hd = document.getElementById("eecHead");
        if (hd) {
          hd.className =
            "sec-docbadge " + (st.neconf ? "" : st.conf === st.tot ? "ok" : "");
          hd.innerHTML = `${st.conf} conforme${st.neconf ? ` · <span style="color:var(--red)">${st.neconf} neconforme</span>` : ""} / ${st.tot}`;
        }
        const se = document.getElementById("s_eec");
        if (se)
          se.innerHTML = st.neconf
            ? `<span style="color:var(--red)">${st.neconf} neconf.</span>`
            : `${st.conf}/${st.tot}`;
      }
      function eecF(i, k, v) {
        curOffer().conformEEC[i][k] = v;
        save();
        if (k === "rezultat") refreshEEC();
      }
      function eecDocToggle(k) {
        const o = curOffer();
        o.eecDocs[k] = !o.eecDocs[k];
        save();
        refreshEEC();
      }
      function eecDocUpload(k, files) {
        if (!files.length) return;
        compressFile(files[0], async (data, name, type) => {
          const rec = await fileAdd(data, name, type);
          if (rec) {
            const o = curOffer();
            if (o.eecDocsFiles[k]) await fileDel(o.eecDocsFiles[k]);
            o.eecDocsFiles[k] = rec;
            save();
            refreshEEC();
            toast("Fișier încărcat");
          }
        });
      }
      function eecDocRemove(k) {
        const o = curOffer();
        fileDel(o.eecDocsFiles[k]);
        o.eecDocsFiles[k] = null;
        save();
        refreshEEC();
      }
      /* poze per criteriu */
      function openEecPhotos(i) {
        window._eecIdx = i;
        const c = curOffer().conformEEC[i];
        openModal(
          "Poze dovadă · " + c.parte,
          `<p class="sub" style="margin-bottom:12px">${c.criteriu}</p><input type="file" id="eecPhotoInput" accept="image/*" multiple style="display:none" onchange="addEecPhotos(this.files);this.value=''"><div class="gallery" id="eecGallery"></div>`,
          `<button class="btn btn-primary" onclick="closeModal();refreshEEC()">Gata</button>`,
        );
        refreshEecGallery();
      }
      function refreshEecGallery() {
        const g = document.getElementById("eecGallery");
        if (!g) return;
        const c = curOffer().conformEEC[window._eecIdx];
        g.innerHTML =
          (c.poze || [])
            .map(
              (p, i) =>
                `<div class="gphoto" onclick="eecLightbox(${i})"><img ${imgSrc(p)} alt=""><button class="gdel" onclick="event.stopPropagation();rmEecPhoto(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>`,
            )
            .join("") +
          `<div class="gadd" onclick="document.getElementById('eecPhotoInput').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Adaugă poze</div>`;
        loadImages();
      }
      function addEecPhotos(files) {
        if (!files.length) return;
        const c = curOffer().conformEEC[window._eecIdx];
        let pending = files.length;
        Array.from(files).forEach((f) =>
          compressImg(f, async (data) => {
            const rec = await fileAdd(data, f.name, "image/jpeg");
            if (rec) c.poze.push(rec);
            if (--pending === 0) {
              save();
              refreshEecGallery();
            }
          }),
        );
      }
      function rmEecPhoto(i) {
        const c = curOffer().conformEEC[window._eecIdx];
        fileDel(c.poze[i]);
        c.poze.splice(i, 1);
        save();
        refreshEecGallery();
      }
      function eecLightbox(i) {
        const p = curOffer().conformEEC[window._eecIdx].poze[i];
        if (p.id) openFile(p.id, "image");
        else if (p.data) {
          document.getElementById("lightboxImg").src = p.data;
          document.getElementById("lightbox").classList.add("open");
        }
      }

      /* ===== COMPARAȚIE MULTI-FURNIZOR ===== */
      function vCompare() {
        crumb([
          { t: "Oferte producător", go: "go('offers')" },
          { t: "Comparație" },
        ]);
        const cats = [
          ...new Set(DB.offers.map((o) => o.categorie).filter(Boolean)),
        ];
        let list = DB.offers.filter(
          (o) => !state.compareCat || o.categorie === state.compareCat,
        );
        let h = `<div class="page-h"><h1>Comparație oferte</h1><div class="sp"><select class="lfilter" onchange="state.compareCat=this.value;vCompare()"><option value="">Toate categoriile</option>${cats.map((c) => `<option ${state.compareCat === c ? "selected" : ""}>${c}</option>`).join("")}</select><button class="btn btn-default" onclick="go('offers')">Înapoi</button></div></div>`;
        if (list.length < 1) {
          h += `<div class="empty" style="padding:60px"><p>Nicio ofertă de comparat</p></div>`;
          document.getElementById("wrap").innerHTML = h;
          return;
        }
        // rânduri de comparație; best evidențiat
        const rows = [];
        const bp = (o) => {
          const b = bestPrice(o);
          return b ? b.pret : null;
        };
        rows.push({
          lbl: "Preț de la",
          get: (o) => {
            const b = bestPrice(o);
            return b ? val(b.pret, b.valuta) : "—";
          },
          best: "min",
          raw: (o) => bp(o),
        });
        rows.push({
          lbl: "MOQ",
          get: (o) => o.moq || "—",
          best: "min",
          raw: (o) => +o.moq || null,
        });
        rows.push({
          lbl: "Timp producție",
          get: (o) => (o.timpProductieZile || "—") + " zile",
          best: "min",
          raw: (o) => +o.timpProductieZile || null,
        });
        rows.push({
          lbl: "Timp livrare",
          get: (o) => (o.timpLivrareZile || "—") + " zile",
          best: "min",
          raw: (o) => +o.timpLivrareZile || null,
        });
        rows.push({
          lbl: "Timp total",
          get: (o) =>
            (+o.timpProductieZile || 0) + (+o.timpLivrareZile || 0) + " zile",
          best: "min",
          raw: (o) =>
            (+o.timpProductieZile || 0) + (+o.timpLivrareZile || 0) || null,
        });
        rows.push({
          lbl: "Conformități",
          get: (o) =>
            o.conformitati.filter((c) => c.status !== "lipsa").length +
            "/" +
            o.conformitati.length,
          best: "max",
          raw: (o) => o.conformitati.filter((c) => c.status !== "lipsa").length,
        });
        rows.push({
          lbl: "CTC trecute",
          get: (o) =>
            o.ctc.filter((c) => c.rezultat === "OK").length +
            "/" +
            o.ctc.length,
          best: "max",
          raw: (o) => o.ctc.filter((c) => c.rezultat === "OK").length,
        });
        rows.push({
          lbl: "Conformitate EEC",
          get: (o) => {
            const s = eecStats(o);
            return (
              s.conf + "/" + s.tot + (s.neconf ? ` (${s.neconf} nec.)` : "")
            );
          },
          best: "max",
          raw: (o) => eecStats(o).conf,
        });
        rows.push({
          lbl: "Poze",
          get: (o) => o.poze.length,
          best: "max",
          raw: (o) => o.poze.length,
        });
        rows.push({
          lbl: "Mostră",
          get: (o) => MOSTRA_LBL[o.mostraStatus] || "—",
          best: null,
        });
        EVAL_CRITERIA.forEach((c, ci) =>
          rows.push({
            lbl: c.criteriu,
            get: (o) => {
              const e = o.evaluare?.[ci];
              return e && e.nota ? e.nota + "/5" : "—";
            },
            best: "max",
            raw: (o) => o.evaluare?.[ci]?.nota || null,
            eval: true,
          }),
        );
        rows.push({
          lbl: "SCOR COMPOZIT",
          get: (o) => computeScore(o).toFixed(1) + "/5",
          best: "max",
          raw: (o) => computeScore(o),
          strong: true,
        });

        h += `<div class="doc"><div class="lv-wrap"><table class="lv"><thead><tr><th style="min-width:150px">Criteriu</th>${list.map((o) => `<th style="min-width:150px"><span class="id-link" onclick="openOffer('${o.id}')">${o.id}</span><div class="sub" style="font-weight:600;color:var(--text)">${o.producator}</div><div class="sub">${o.produs}</div></th>`).join("")}</tr></thead><tbody>`;
        rows.forEach((r) => {
          let best = null;
          if (r.best && r.raw) {
            const vals = list.map(r.raw).filter((v) => v != null);
            if (vals.length)
              best = r.best === "min" ? Math.min(...vals) : Math.max(...vals);
          }
          h += `<tr${r.eval ? ' style="background:var(--bg)"' : ""}><td class="${r.strong ? "cell-strong" : ""}" style="font-weight:${r.strong ? 800 : 600};${r.strong ? "font-size:13px" : ""}">${r.lbl}</td>${list
            .map((o) => {
              const isBest = best != null && r.raw && r.raw(o) === best;
              return `<td class="${r.strong ? "" : "n"}" style="${isBest ? "background:var(--primary-soft);color:var(--primary-d);font-weight:800" : ""};${r.strong ? "font-family:var(--mono);font-weight:800;font-size:14px" : ""}">${r.get(o)}${isBest && !r.strong ? " ★" : ""}</td>`;
            })
            .join("")}</tr>`;
        });
        h += `<tr><td></td>${list.map((o) => `<td>${o.orderId ? `<span class="pill blue">Comandat</span>` : `<button class="btn btn-primary btn-sm" onclick="offerToOrder('${o.id}')">Alege →</button>`}</td>`).join("")}</tr>`;
        h += `</tbody></table></div></div><div class="res-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>Celulele verzi cu ★ marchează cea mai bună ofertă pe fiecare criteriu. Scorul compozit ține cont de ponderi.</span></div>`;
        document.getElementById("wrap").innerHTML = h;
      }

      /* acțiuni ofertă */
      async function newOffer() {
        const id = await nextId("OF", true);
        DB.offers.push(blankOffer(id));
        save();
        openOffer(id);
        toast("Ofertă creată");
      }
      function delOffer(id) {
        openModal(
          "Șterge oferta",
          `<p style="font-weight:500">Sigur ștergi <b>${id}</b>?</p>`,
          `<button class="btn btn-default" onclick="closeModal()">Renunță</button><button class="btn btn-primary" style="background:var(--red)" onclick="confirmDelOffer('${id}')">Șterge</button>`,
        );
      }
      function confirmDelOffer(id) {
        DB.offers = DB.offers.filter((x) => x.id !== id);
        save();
        closeModal();
        go("offers");
        toast("Ștearsă");
      }
      async function offerToOrder(id) {
        const of = DB.offers.find((x) => x.id === id);
        const b = bestPrice(of);
        if (
          !DB.suppliers.some((s) => s.nume === of.producator) &&
          of.producator
        )
          DB.suppliers.push({
            id: await nextId("FURN", false),
            nume: of.producator,
            tara: "China",
            oras: "",
            contact: "",
            email: "",
            incoterms: "FOB",
          });
        const oid = await nextId("IMP", true);
        const ord = Object.assign(blankOrder(oid), {
          supplier: of.producator,
          produs: of.produs,
          tipAsamblare: of.tipAsamblare,
          pretBuc: b ? +b.pret : 0,
          valutaFOB: b ? b.valuta : "USD",
          nrBuc: b ? +b.cantMin : 0,
        });
        DB.orders.push(ord);
        of.orderId = oid;
        of.status = "Comandat";
        save();
        toast("Comandă " + oid + " creată din ofertă");
        openDoc(oid);
      }

      /* ===== MODAL / EXPORT / TOAST ===== */
      function openModal(t, b, f) {
        document.getElementById("modal").innerHTML =
          `<div class="modal-h"><h3>${t}</h3><button class="icon-btn" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="modal-b">${b}</div><div class="modal-f">${f || ""}</div>`;
        document.getElementById("overlay").classList.add("open");
      }
      function closeModal() {
        document.getElementById("overlay").classList.remove("open");
      }
      document.getElementById("overlay").addEventListener("click", (e) => {
        if (e.target.id === "overlay") closeModal();
      });
      function exportBackup() {
        toast("Se pregătește backup-ul…");
        const a = document.createElement("a");
        a.download = "geeli_import_" + today() + ".json";
        a.href =
          "data:application/json;charset=utf-8," +
          encodeURIComponent(JSON.stringify(DB, null, 2));
        a.click();
        toast("Backup salvat (fișierele rămân în Supabase Storage)");
      }
      function importBackup() {
        const inp = document.createElement("input");
        inp.type = "file";
        inp.accept = ".json";
        inp.onchange = (e) => {
          const fr = new FileReader();
          fr.onload = async () => {
            try {
              const obj = JSON.parse(fr.result);
              delete obj._files;
              DB = obj;
              migrate();
              migrateV19();
              migrateV20();
              ensureUniqueIds();
              save();
              go("dashboard");
              toast("Backup încărcat");
            } catch (err) {
              toast("Fișier invalid");
            }
          };
          fr.readAsText(e.target.files[0]);
        };
        inp.click();
      }
      let tT;
      function toast(m, isErr) {
        const t = document.getElementById("toast");
        t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>${m}`;
        t.style.background = isErr ? "var(--red)" : "var(--text)";
        t.querySelector("svg").style.color = isErr ? "#fff" : "var(--primary)";
        t.classList.add("show");
        clearTimeout(tT);
        tT = setTimeout(() => t.classList.remove("show"), 2600);
      }

      /* ===== ADMINISTRARE UTILIZATORI (rol admin) ===== */
      function renderShellUserInfo() {
        const el = document.getElementById("sbUserInfo");
        if (!el || !currentProfile) return;
        const roleLbl =
          currentProfile.role === "admin"
            ? "Admin"
            : currentProfile.role === "user"
              ? "User"
              : "Fără rol";
        el.innerHTML = `<b>${esc(currentProfile.nume || currentUser.email)}</b><br>${esc(currentUser.email)}<br><span class="role-tag">${roleLbl}</span><br><button onclick="doLogout()" style="margin-top:8px;width:100%;padding:7px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--gray-soft);display:flex;align-items:center;justify-content:center;gap:5px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>Deconectare</button>`;
        const g = document.getElementById("sbAdminGroup");
        if (g) g.style.display = currentProfile.role === "admin" ? "" : "none";
      }
      async function vUsers() {
        const wrap = document.getElementById("wrap");
        if (!currentProfile || currentProfile.role !== "admin") {
          wrap.innerHTML = `<div class="empty" style="padding:60px"><p>Nu ai acces la această secțiune</p></div>`;
          return;
        }
        wrap.innerHTML = `<div class="page-h"><h1>Administrare utilizatori</h1></div><div class="doc"><div class="lv-wrap"><table class="lv"><thead><tr><th>Nr</th><th>Email</th><th>Rol</th><th>Nume</th><th></th></tr></thead><tbody id="userRows"><tr><td colspan="5" style="text-align:center;padding:30px;color:var(--muted)">Se încarcă…</td></tr></tbody></table></div></div>`;
        const { data: profiles, error } = await sb
          .from("profiles")
          .select("*")
          .order("created_at", { ascending: false });
        if (error) {
          document.getElementById("userRows").innerHTML =
            `<tr><td colspan="5" style="color:var(--red);padding:16px">Eroare: ${esc(error.message)}</td></tr>`;
          return;
        }
        const tbody = document.getElementById("userRows");
        tbody.innerHTML = profiles.map((p, i) => userRow(p, i + 1)).join("");
        profiles.forEach((p) => bindUserRow(p));
      }
      function userRow(p, nr) {
        return `<tr data-urow="${p.id}">
    <td class="n">${nr}</td>
    <td><div style="font-weight:600">${esc(p.email)}</div><div class="sub">${new Date(p.created_at).toLocaleDateString("ro-RO")}</div></td>
    <td><select class="urole" style="padding:6px 8px;border:1px solid var(--border-2);border-radius:6px;background:var(--card)">
      <option value="" ${!p.role ? "selected" : ""}>Fără rol</option>
      <option value="user" ${p.role === "user" ? "selected" : ""}>User</option>
      <option value="admin" ${p.role === "admin" ? "selected" : ""}>Admin</option>
    </select></td>
    <td><input class="unume" value="${esc(p.nume || "")}" placeholder="Nume" style="padding:6px 8px;border:1px solid var(--border-2);border-radius:6px;width:150px"></td>
    <td style="white-space:nowrap">
      <button class="btn btn-primary btn-sm usave">Salvează</button>
      <button class="btn btn-default btn-sm udel" ${p.id === currentUser.id ? 'disabled title="Nu îți poți șterge propriul cont"' : ""}>Șterge</button>
    </td>
  </tr>`;
      }
      function bindUserRow(p) {
        const row = document.querySelector(`tr[data-urow="${p.id}"]`);
        if (!row) return;
        row.querySelector(".usave").addEventListener("click", async (e) => {
          const btn = e.currentTarget;
          const role = row.querySelector(".urole").value || null;
          const nume = row.querySelector(".unume").value.trim() || null;
          if (p.id === currentUser.id && role !== "admin") {
            toast(
              "Nu îți poți retrage propriul rol de admin din acest panou",
              true,
            );
            return;
          }
          btn.disabled = true;
          btn.textContent = "Se salvează…";
          const { error } = await sb
            .from("profiles")
            .update({ role, nume, updated_at: new Date().toISOString() })
            .eq("id", p.id);
          btn.disabled = false;
          btn.textContent = "Salvează";
          if (error) {
            toast("Eroare: " + error.message, true);
            return;
          }
          toast("Salvat");
          if (p.id === currentUser.id) {
            currentProfile.role = role;
            currentProfile.nume = nume;
            renderShellUserInfo();
          }
        });
        const delBtn = row.querySelector(".udel");
        if (!delBtn.disabled) {
          delBtn.addEventListener("click", async () => {
            if (
              !confirm(
                `Ștergi definitiv contul ${p.email}? Acțiunea nu poate fi anulată.`,
              )
            )
              return;
            delBtn.disabled = true;
            delBtn.textContent = "Se șterge…";
            const { data, error } = await sb.functions.invoke("delete-user", {
              body: { target_id: p.id },
            });
            const errMsg = error?.message || data?.error;
            if (errMsg) {
              toast("Eroare la ștergere: " + errMsg, true);
              delBtn.disabled = false;
              delBtn.textContent = "Șterge";
              return;
            }
            toast("Cont șters");
            row.remove();
          });
        }
      }
      async function doLogout() {
        await sb.auth.signOut();
      }

      /* ===== AUTENTIFICARE ===== */
      function fieldLabel(t) {
        return `<label>${t}</label>`;
      }
      function renderAuthScreen(mode) {
        mode = mode || "login";
        document.getElementById("appRoot").style.display = "none";
        const el = document.getElementById("authScreen");
        el.innerHTML = `
  <div class="authwrap"><div style="width:100%;max-width:400px">
    <div class="authbrand"><b>Geeli Import · ERP</b><span>Cost real intrare</span></div>
    <div class="authcard">
      <div class="authtabs">
        <button class="authtab ${mode === "login" ? "active" : ""}" data-tab="login">Autentificare</button>
        <button class="authtab ${mode === "signup" ? "active" : ""}" data-tab="signup">Cont nou</button>
        <button class="authtab ${mode === "forgot" ? "active" : ""}" data-tab="forgot">Am uitat parola</button>
      </div>
      <div id="authPanel"></div>
    </div>
  </div></div>`;
        el.querySelectorAll(".authtab").forEach((b) =>
          b.addEventListener("click", () => renderAuthScreen(b.dataset.tab)),
        );
        const panel = document.getElementById("authPanel");
        if (mode === "login") {
          panel.innerHTML = loginForm();
          bindLoginForm();
        }
        if (mode === "signup") {
          panel.innerHTML = signupForm();
          bindSignupForm();
        }
        if (mode === "forgot") {
          panel.innerHTML = forgotForm();
          bindForgotForm();
        }
      }
      function loginForm() {
        return `<form id="formLogin" class="authform">
  <div class="f">${fieldLabel("Email")}<input type="email" id="loginEmail" required placeholder="nume@exemplu.ro"></div>
  <div class="f">${fieldLabel("Parolă")}<input type="password" id="loginPass" required placeholder="••••••••"></div>
  <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Autentificare</button>
  <p id="loginMsg" class="authmsg"></p>
</form>`;
      }
      function bindLoginForm() {
        document
          .getElementById("formLogin")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector("button");
            btn.disabled = true;
            const email = document.getElementById("loginEmail").value.trim();
            const pass = document.getElementById("loginPass").value;
            const { error } = await sb.auth.signInWithPassword({
              email,
              password: pass,
            });
            btn.disabled = false;
            const msg = document.getElementById("loginMsg");
            if (error) {
              msg.className = "authmsg err";
              msg.textContent = error.message.includes("Invalid login")
                ? "Email sau parolă incorectă."
                : error.message;
            }
          });
      }
      function signupForm() {
        return `<form id="formSignup" class="authform">
  <div class="f">${fieldLabel("Email")}<input type="email" id="signupEmail" required placeholder="nume@exemplu.ro"></div>
  <div class="f">${fieldLabel("Parolă")}<input type="password" id="signupPass" required minlength="6" placeholder="Minim 6 caractere"></div>
  <div class="f">${fieldLabel("Confirmă parola")}<input type="password" id="signupPass2" required minlength="6"></div>
  <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Creează cont</button>
  <p id="signupMsg" class="authmsg"></p>
  <p class="authnote">Contul nou nu are niciun rol alocat. Un administrator va activa contul și îi va atribui rolul.</p>
</form>`;
      }
      function bindSignupForm() {
        document
          .getElementById("formSignup")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("signupMsg");
            const email = document.getElementById("signupEmail").value.trim();
            const p1 = document.getElementById("signupPass").value;
            const p2 = document.getElementById("signupPass2").value;
            if (p1 !== p2) {
              msg.className = "authmsg err";
              msg.textContent = "Parolele nu coincid.";
              return;
            }
            const btn = e.target.querySelector("button");
            btn.disabled = true;
            const { error } = await sb.auth.signUp({
              email,
              password: p1,
              options: {
                emailRedirectTo:
                  window.location.origin + window.location.pathname,
              },
            });
            btn.disabled = false;
            if (error) {
              msg.className = "authmsg err";
              msg.textContent = error.message;
            } else {
              msg.className = "authmsg ok";
              msg.textContent =
                "Cont creat. Verifică emailul pentru confirmare (dacă este activată), apoi autentifică-te.";
              e.target.reset();
            }
          });
      }
      function forgotForm() {
        return `<form id="formForgot" class="authform">
  <p class="authnote">Introdu adresa de email folosită la înregistrare. Vei primi un link de resetare a parolei.</p>
  <div class="f">${fieldLabel("Email")}<input type="email" id="forgotEmail" required placeholder="nume@exemplu.ro"></div>
  <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Trimite link de resetare</button>
  <p id="forgotMsg" class="authmsg"></p>
</form>`;
      }
      function bindForgotForm() {
        document
          .getElementById("formForgot")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("forgotMsg");
            const email = document.getElementById("forgotEmail").value.trim();
            const btn = e.target.querySelector("button");
            btn.disabled = true;
            const { error } = await sb.auth.resetPasswordForEmail(email, {
              redirectTo: window.location.origin + window.location.pathname,
            });
            btn.disabled = false;
            if (error) {
              msg.className = "authmsg err";
              msg.textContent = error.message;
            } else {
              msg.className = "authmsg ok";
              msg.textContent =
                "Dacă adresa există, un email cu linkul de resetare a fost trimis.";
            }
          });
      }
      function renderResetPassword() {
        document.getElementById("appRoot").style.display = "none";
        const el = document.getElementById("authScreen");
        el.innerHTML = `<div class="authwrap"><div style="width:100%;max-width:400px"><div class="authcard">
    <h2 style="font-size:16px;font-weight:800;margin-bottom:4px">Modificare parolă</h2>
    <p class="authnote" style="margin-bottom:16px">Alege o parolă nouă pentru contul tău.</p>
    <form id="formReset" class="authform">
      <div class="f">${fieldLabel("Parolă nouă")}<input type="password" id="resetPass" required minlength="6"></div>
      <div class="f">${fieldLabel("Confirmă parola nouă")}<input type="password" id="resetPass2" required minlength="6"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Salvează parola nouă</button>
      <p id="resetMsg" class="authmsg"></p>
    </form>
  </div></div></div>`;
        document
          .getElementById("formReset")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("resetMsg");
            const p1 = document.getElementById("resetPass").value,
              p2 = document.getElementById("resetPass2").value;
            if (p1 !== p2) {
              msg.className = "authmsg err";
              msg.textContent = "Parolele nu coincid.";
              return;
            }
            const { error } = await sb.auth.updateUser({ password: p1 });
            if (error) {
              msg.className = "authmsg err";
              msg.textContent = error.message;
            } else {
              msg.className = "authmsg ok";
              msg.textContent = "Parola a fost schimbată. Redirecționare…";
              recoveryMode = false;
              setTimeout(async () => {
                const {
                  data: { session },
                } = await sb.auth.getSession();
                if (session) {
                  currentUser = session.user;
                  await loadProfileAndRender();
                } else renderAuthScreen();
              }, 1200);
            }
          });
      }
      function renderConfirmScreen(tokenHash, type) {
        const isRecovery = type === "recovery";
        document.getElementById("appRoot").style.display = "none";
        const el = document.getElementById("authScreen");
        el.innerHTML = `<div class="authwrap"><div style="width:100%;max-width:400px"><div class="authcard" style="text-align:center">
    <h2 style="font-size:16px;font-weight:800;margin-bottom:4px">${isRecovery ? "Resetare parolă" : "Confirmare cont"}</h2>
    <p class="authnote" style="margin-bottom:16px">${isRecovery ? "Apasă butonul de mai jos pentru a continua resetarea parolei." : "Apasă butonul de mai jos pentru a-ți confirma adresa de email."}</p>
    <button id="btnConfirmOtp" class="btn btn-primary" style="width:100%;justify-content:center">${isRecovery ? "Continuă" : "Confirmă contul"}</button>
    <p id="confirmMsg" class="authmsg" style="margin-top:10px"></p>
  </div></div></div>`;
        document
          .getElementById("btnConfirmOtp")
          .addEventListener("click", async () => {
            const btn = document.getElementById("btnConfirmOtp");
            const msg = document.getElementById("confirmMsg");
            btn.disabled = true;
            btn.textContent = "Se verifică…";
            const { error } = await sb.auth.verifyOtp({
              token_hash: tokenHash,
              type,
            });
            window.history.replaceState(
              {},
              document.title,
              window.location.pathname,
            );
            if (error) {
              msg.className = "authmsg err";
              msg.textContent = "Linkul nu mai este valid. Cere un link nou.";
              btn.disabled = false;
              btn.textContent = isRecovery ? "Continuă" : "Confirmă contul";
              return;
            }
            if (isRecovery) {
              recoveryMode = true;
              renderResetPassword();
            } else {
              await sb.auth.signOut();
              renderAuthScreen("login");
              toast("Cont confirmat cu succes. Te poți autentifica.");
            }
          });
      }
      function renderPending() {
        document.getElementById("appRoot").style.display = "none";
        const el = document.getElementById("authScreen");
        el.innerHTML = `<div class="pendingwrap"><div class="pendingcard">
    <h2 style="font-size:17px;font-weight:800;margin-bottom:8px">Cont în așteptare</h2>
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:18px">Contul tău a fost creat cu succes, dar încă nu are un rol alocat. Contactează un administrator pentru activare.</p>
    <button id="btnLogoutPending" class="btn btn-default">Deconectare</button>
  </div></div>`;
        document
          .getElementById("btnLogoutPending")
          .addEventListener("click", () => sb.auth.signOut());
      }
      async function loadProfileAndRender() {
        const { data, error } = await sb
          .from("profiles")
          .select("*")
          .eq("id", currentUser.id)
          .maybeSingle();
        if (error)
          toast("Eroare la încărcarea profilului: " + error.message, true);
        currentProfile = data || null;
        if (!currentProfile || !currentProfile.role) {
          renderPending();
          return;
        }
        document.getElementById("authScreen").innerHTML = "";
        document.getElementById("appRoot").style.display = "";
        renderShellUserInfo();
        DB = await load();
        const miss = missingTables();
        if (miss.length) {
          document.getElementById("wrap").innerHTML =
            `<div class="res-note warn" style="margin:30px"><span><b>Lipsesc tabelele Supabase necesare versiunii v20:</b> ${miss.map(esc).join(", ")}.<br>Rulează scriptul SQL de migrare (supabase-v20.sql), apoi reîncarcă pagina. Nu s-a salvat nimic, pentru a nu suprascrie datele existente.</span></div>`;
          return;
        }
        migrate();
        migrateV19();
        migrateV20();
        ensureUniqueIds();
        invalidateCalc();
        render();
      }
      sb.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") {
          recoveryMode = true;
          renderResetPassword();
          return;
        }
        if (event === "SIGNED_OUT") {
          currentUser = null;
          currentProfile = null;
          renderAuthScreen();
          return;
        }
        if (session && !recoveryMode) {
          const sameUser = currentUser && currentUser.id === session.user.id;
          currentUser = session.user;
          if (sameUser && currentProfile) return;
          loadProfileAndRender();
        }
      });
      (async function initAuth() {
        const tokenHash = new URLSearchParams(window.location.search).get(
          "token_hash",
        );
        const otpType = new URLSearchParams(window.location.search).get("type");
        if (tokenHash && otpType) {
          renderConfirmScreen(tokenHash, otpType);
          return;
        }
        const {
          data: { session },
        } = await sb.auth.getSession();
        if (session) {
          currentUser = session.user;
          await loadProfileAndRender();
        } else renderAuthScreen();
      })();
    </script>
  </body>
</html>
