<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geeli Import · ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root {
        --bg: #f4f5f6;
        --card: #ffffff;
        --text: #1c2126;
        --text-2: #383d43;
        --muted: #7a828a;
        --muted-2: #a6adb4;
        --border: #e9ecef;
        --border-2: #d8dce0;
        --primary: #00a876;
        --primary-d: #008c63;
        --primary-soft: #e3f8f0;
        --blue: #2490ef;
        --blue-soft: #e7f3fe;
        --green: #28a745;
        --green-soft: #e3f6e9;
        --orange: #f0932b;
        --orange-soft: #fdeedd;
        --red: #e24c4c;
        --red-soft: #fbe7e7;
        --gray: #8d99a6;
        --gray-soft: #edeff1;
        --purple: #7b6fe6;
        --purple-soft: #eeecfb;
        --font: "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        --mono:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --shadow:
          0 1px 2px rgba(28, 33, 38, 0.05), 0 1px 3px rgba(28, 33, 38, 0.06);
        --shadow-lg: 0 12px 40px rgba(28, 33, 38, 0.16);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: 13px;
        color: var(--text);
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-2);
        border-radius: 20px;
        border: 3px solid var(--bg);
      }
      .mono {
        font-family: var(--mono);
        font-feature-settings: "tnum";
      }
      a {
        color: var(--blue);
        text-decoration: none;
      }

      .app {
        display: flex;
        min-height: 100vh;
      }
      .scrim {
        display: none;
      }
      .sidebar {
        width: 228px;
        flex: none;
        background: var(--card);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .sb-brand {
        padding: 16px 16px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid var(--border);
      }
      .sb-mark {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--primary), var(--primary-d));
        display: grid;
        place-items: center;
        flex: none;
      }
      .sb-mark svg {
        width: 19px;
        height: 19px;
      }
      .sb-brand b {
        font-weight: 800;
        font-size: 14px;
        letter-spacing: -0.2px;
        display: block;
        line-height: 1.1;
      }
      .sb-brand span {
        font-size: 11px;
        color: var(--muted);
        font-weight: 600;
      }
      .sb-group {
        padding: 12px 10px 4px;
      }
      .sb-group-t {
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted-2);
        padding: 6px 10px 8px;
      }
      .sb-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 10px;
        border-radius: 7px;
        color: var(--text-2);
        font-weight: 500;
        font-size: 13px;
        margin-bottom: 1px;
        text-align: left;
        transition: 0.1s;
      }
      .sb-item svg {
        width: 16px;
        height: 16px;
        flex: none;
        color: var(--muted);
        stroke-width: 2;
      }
      .sb-item:hover {
        background: var(--gray-soft);
      }
      .sb-item.active {
        background: var(--primary-soft);
        color: var(--primary-d);
        font-weight: 600;
      }
      .sb-item.active svg {
        color: var(--primary-d);
      }
      .sb-count {
        margin-left: auto;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        font-family: var(--mono);
      }
      .sb-foot {
        margin-top: auto;
        padding: 12px 10px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 8px;
      }
      .sb-foot button {
        flex: 1;
        padding: 7px;
        border-radius: 7px;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
        background: var(--gray-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      .sb-foot button:hover {
        color: var(--text);
      }
      .sb-foot svg {
        width: 13px;
        height: 13px;
      }

      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .navbar {
        background: var(--card);
        border-bottom: 1px solid var(--border);
        height: 48px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        gap: 14px;
        position: sticky;
        top: 0;
        z-index: 30;
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--muted);
      }
      .breadcrumb .crumb {
        cursor: pointer;
      }
      .breadcrumb .crumb:hover {
        color: var(--text);
      }
      .breadcrumb .sep {
        color: var(--muted-2);
      }
      .breadcrumb .cur {
        color: var(--text);
        font-weight: 600;
      }
      .nav-search {
        margin-left: auto;
        position: relative;
        width: 230px;
      }
      .nav-search svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 15px;
        height: 15px;
        color: var(--muted-2);
      }
      .nav-search input {
        width: 100%;
        padding: 7px 10px 7px 32px;
        border: 1px solid var(--border-2);
        border-radius: 7px;
        background: var(--bg);
        font-size: 12.5px;
      }
      .nav-search input:focus {
        outline: none;
        border-color: var(--primary);
        background: #fff;
      }

      .wrap {
        padding: 20px 24px 70px;
        flex: 1;
        overflow-y: auto;
        width: 100%;
      }
      .page-h {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }
      .page-h h1 {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      .page-h {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .page-h .sp {
        margin-left: auto;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 13px;
        border-radius: 7px;
        font-weight: 600;
        font-size: 12.5px;
        white-space: nowrap;
        transition: 0.12s;
        border: 1px solid transparent;
      }
      .btn svg {
        width: 15px;
        height: 15px;
        stroke-width: 2.2;
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--primary-d);
      }
      .btn-default {
        background: var(--card);
        color: var(--text);
        border-color: var(--border-2);
      }
      .btn-default:hover {
        background: var(--gray-soft);
      }
      .btn-sm {
        padding: 5px 10px;
        font-size: 12px;
      }
      .btn-link {
        color: var(--blue);
        font-weight: 600;
        padding: 4px 6px;
      }
      .btn-link:hover {
        text-decoration: underline;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }
      .ncard {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 15px 16px;
        box-shadow: var(--shadow);
      }
      .ncard .lbl {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
        margin-bottom: 9px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .ncard .lbl .ic {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        display: grid;
        place-items: center;
      }
      .ncard .lbl .ic svg {
        width: 14px;
        height: 14px;
        stroke-width: 2;
      }
      .ncard .val {
        font-size: 23px;
        font-weight: 800;
        letter-spacing: -0.8px;
        font-family: var(--mono);
      }
      .ncard .foot {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 4px;
        font-weight: 500;
      }

      .doc {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
        overflow: hidden;
        margin-bottom: 18px;
      }
      .doc-h {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .doc-h h2 {
        font-size: 14px;
        font-weight: 700;
      }
      .doc-h .cnt {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
        background: var(--gray-soft);
        padding: 1px 8px;
        border-radius: 20px;
        font-family: var(--mono);
      }
      .doc-h .tools {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .lfilter {
        padding: 6px 10px;
        border: 1px solid var(--border-2);
        border-radius: 7px;
        background: var(--bg);
        font-weight: 500;
        font-size: 12px;
      }
      .lfilter:focus {
        outline: none;
        border-color: var(--primary);
      }

      .lv-wrap {
        overflow-x: auto;
      }
      table.lv {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      table.lv thead th {
        text-align: left;
        padding: 9px 14px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        background: var(--card);
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      table.lv thead th.r {
        text-align: right;
      }
      table.lv tbody td {
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      table.lv tbody tr:last-child td {
        border-bottom: none;
      }
      table.lv tbody tr {
        cursor: pointer;
      }
      table.lv tbody tr:hover {
        background: var(--bg);
      }
      .lv .id-link {
        color: var(--blue);
        font-weight: 600;
        font-family: var(--mono);
      }
      .lv .id-link:hover {
        text-decoration: underline;
      }
      td.n {
        font-family: var(--mono);
        font-weight: 500;
        text-align: right;
      }
      .muted {
        color: var(--muted);
      }
      .sub {
        font-size: 11px;
        color: var(--muted);
        font-weight: 500;
      }

      .ind {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .ind::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .ind.gray {
        color: var(--gray);
      }
      .ind.green {
        color: var(--green);
      }
      .ind.orange {
        color: var(--orange);
      }
      .ind.red {
        color: var(--red);
      }
      .ind.blue {
        color: var(--blue);
      }
      .ind.purple {
        color: var(--purple);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 20px;
      }
      .pill.gray {
        background: var(--gray-soft);
        color: #5c6670;
      }
      .pill.green {
        background: var(--green-soft);
        color: #1d7a32;
      }
      .pill.blue {
        background: var(--blue-soft);
        color: #1b6fb8;
      }
      .pill.purple {
        background: #efe7fb;
        color: #6b3fb8;
      }
      .pill.red {
        background: var(--red-soft);
        color: #a12c2c;
      }
      .pill.orange {
        background: var(--orange-soft);
        color: #b4651a;
      }

      /* FORM */
      .form-top {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 14px 18px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .form-top .ft-title {
        font-size: 18px;
        font-weight: 700;
        font-family: var(--mono);
        letter-spacing: -0.3px;
      }
      .form-top .ft-actions {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .form-layout {
        display: grid;
        grid-template-columns: 1fr 268px;
        gap: 16px;
        align-items: start;
      }
      .form-main {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }

      .section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .section-h {
        padding: 11px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 12.5px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .section-h .sh-ic {
        color: var(--primary);
      }
      .section-h .sh-ic svg {
        width: 15px;
        height: 15px;
        stroke-width: 2;
      }
      .section-h .sh-note {
        margin-left: auto;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted-2);
      }
      .section-b {
        padding: 16px;
        overflow-x: auto;
      }
      .fgrid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 13px;
      }
      .f {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .f.c2 {
        grid-column: span 2;
      }
      .f.c3 {
        grid-column: span 3;
      }
      .f.c4 {
        grid-column: span 4;
      }
      .f label {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .f label .u {
        font-size: 9.5px;
        font-weight: 700;
        color: var(--muted-2);
        background: var(--gray-soft);
        padding: 1px 5px;
        border-radius: 4px;
        letter-spacing: 0.3px;
      }
      .f input,
      .f select {
        padding: 7px 10px;
        border: 1px solid var(--border-2);
        border-radius: 6px;
        background: var(--card);
        font-weight: 500;
      }
      .f input:focus,
      .f select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px var(--primary-soft);
      }
      .f input.calc {
        background: var(--bg);
        color: var(--text-2);
        font-weight: 700;
        font-family: var(--mono);
        border-style: dashed;
      }
      .f.hl input {
        border-color: var(--primary);
        background: var(--primary-soft);
        font-weight: 700;
      }
      .inp-r {
        text-align: right;
        font-family: var(--mono);
      }

      /* child table serii */
      .grid-tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      .grid-tbl thead th {
        text-align: left;
        padding: 8px 10px;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--muted);
        background: var(--bg);
        border: 1px solid var(--border);
        text-transform: uppercase;
        letter-spacing: 0.3px;
        white-space: nowrap;
      }
      .grid-tbl td {
        padding: 0;
        border: 1px solid var(--border);
      }
      .grid-tbl td.idx {
        width: 34px;
        text-align: center;
        color: var(--muted-2);
        font-family: var(--mono);
        font-size: 11px;
        background: var(--bg);
      }
      .grid-tbl td.rm {
        width: 36px;
        text-align: center;
      }
      .grid-tbl input,
      .grid-tbl select {
        width: 100%;
        border: none;
        background: transparent;
        padding: 8px 10px;
        font-weight: 500;
      }
      .grid-tbl input:focus,
      .grid-tbl select:focus {
        outline: 2px solid var(--primary);
        outline-offset: -2px;
        background: #fff;
        border-radius: 4px;
      }
      .grid-rm {
        width: 24px;
        height: 24px;
        border-radius: 5px;
        display: inline-grid;
        place-items: center;
        color: var(--muted-2);
      }
      .grid-rm:hover {
        background: var(--red-soft);
        color: var(--red);
      }
      .grid-rm svg {
        width: 14px;
        height: 14px;
      }
      .grid-add {
        margin-top: 10px;
        font-size: 12px;
        font-weight: 600;
        color: var(--primary-d);
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .grid-add svg {
        width: 14px;
        height: 14px;
      }

      /* rezultat cost intrare */
      .res-note {
        padding: 10px 12px;
        background: var(--blue-soft);
        border-radius: 8px;
        font-size: 11.5px;
        color: #1b6fb8;
        font-weight: 500;
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
        line-height: 1.5;
      }
      .res-note svg {
        width: 15px;
        height: 15px;
        flex: none;
        margin-top: 1px;
      }
      .res-note.warn {
        background: var(--red-soft);
        color: #a12c2c;
      }
      .res-note.warn ul {
        margin: 0;
        padding-left: 16px;
      }
      .pl-sum {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
        margin-top: 14px;
      }
      .pl-card {
        border: 1px solid var(--border-2);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.55;
      }
      .pl-card b.k {
        display: block;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .pl-card .v {
        font-family: var(--mono);
        font-weight: 800;
        font-size: 13.5px;
      }
      .pl-item {
        border: 1px solid var(--border-2);
        border-radius: 8px;
        margin-bottom: 8px;
        overflow: hidden;
        background: #fff;
      }
      .pl-item.flag {
        border-color: var(--red);
        background: var(--red-soft);
      }
      .op-anul {
        opacity: 0.62;
      }
      .op-anul input,
      .op-anul select {
        text-decoration: line-through;
      }
      .op-dvi {
        background: #f4faf7;
        border-color: #cfe8dc;
      }
      .pl-line {
        display: grid;
        grid-template-columns: 34px 140px 1fr 1fr 1fr 1.25fr 34px;
      }
      .pl-l1 {
        border-bottom: 1px solid var(--border);
      }
      .pl-span2 {
        grid-column: span 2;
      }
      .pl-c {
        padding: 5px 9px;
        border-left: 1px solid var(--border);
        min-width: 0;
      }
      .pl-c:first-child {
        border-left: 0;
      }
      .pl-c label {
        display: block;
        font-size: 9.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin-bottom: 1px;
      }
      .pl-c input,
      .pl-c select {
        width: 100%;
        border: 0;
        background: transparent;
        font-size: 13px;
        padding: 2px 0;
        font-weight: 600;
        outline: none;
        min-width: 0;
      }
      .pl-c input:focus,
      .pl-c select:focus {
        box-shadow: 0 1px 0 var(--primary);
      }

      /* ===== ÎNCĂRCARE / SALVARE — Supabase =====
   Fiecare rând stochează întregul obiect JS al recordului în coloana jsonb "data".
   Tabele: oferte_producatori, furnizori, comenzi_import (existente) +
   containere_import, plati_import, dvi_import, setari_import (noi, v20).
   Restul aplicației lucrează doar cu DB.* — doar load()/save() știu de Supabase. */
      const TABLES = {
        offers: "oferte_producatori",
        suppliers: "furnizori",
        orders: "comenzi_import",
        containers: "containere_import",
        plati: "plati_import",
        dvi: "dvi_import",
      };
      const SETTINGS_TABLE = "setari_import";
      const _loadOk = {};
      async function loadTable(table) {
        const { data, error } = await sb
          .from(table)
          .select("id,data")
          .order("id");
        _loadOk[table] = !error;
        if (error) {
          console.error(table, error);
          return [];
        }
        return (data || []).map((r) => ({ ...r.data, id: r.id }));
      }
      async function load() {
        const keys = Object.keys(TABLES);
        const [rows, st] = await Promise.all([
          Promise.all(keys.map((k) => loadTable(TABLES[k]))),
          sb
            .from(SETTINGS_TABLE)
            .select("id,data")
            .eq("id", "global")
            .maybeSingle(),
        ]);
        _loadOk[SETTINGS_TABLE] = !st.error;
        const db = emptyDB();
        keys.forEach((k, i) => (db[k] = rows[i]));
        const s = (st.data && st.data.data) || {};
        db.settings = s.settings || { garantie: 0 };
        if (s.v) db.v = s.v;
        else delete db.v;
        return db;
      }
      function missingTables() {
        return Object.keys(_loadOk).filter((t) => !_loadOk[t]);
      }
      let _saveT = null;
      function save() {
        invalidateCalc();
        clearTimeout(_saveT);
        _saveT = setTimeout(persistDB, 350);
      }
      async function syncTable(table, rows) {
        if (_loadOk[table] === false) return; // nu suprascriem un tabel care n-a putut fi citit
        const ids = rows.map((r) => r.id);
        try {
          if (rows.length)
            await sb
              .from(table)
              .upsert(rows.map((r) => ({ id: r.id, data: r })));
          if (ids.length)
            await sb
              .from(table)
              .delete()
              .not(
                "id",
                "in",
                "(" +
                  ids
                    .map((id) => `"${String(id).replace(/"/g, "")}"`)
                    .join(",") +
                  ")",
              );
          else await sb.from(table).delete().neq("id", "");
        } catch (e) {
          toast("Eroare la salvare online — verifică conexiunea", true);
        }
      }
      async function persistDB() {
        const jobs = Object.keys(TABLES).map((k) =>
          syncTable(TABLES[k], DB[k] || []),
        );
        if (_loadOk[SETTINGS_TABLE] !== false)
          jobs.push(
            sb
              .from(SETTINGS_TABLE)
              .upsert({
                id: "global",
                data: { settings: DB.settings || {}, v: DB.v },
              })
              .then((r) => {
                if (r.error) toast("Eroare la salvarea setărilor", true);
              }),
          );
        await Promise.all(jobs);
      }

      /* ===== STOCARE FIȘIERE (Supabase Storage, bucket "geeli-import-fisiere") ===== */
      function fileUrl(id) {
        return sb.storage.from(FILES_BUCKET).getPublicUrl(id).data.publicUrl;
      }
      async function fileAdd(dataUrl, name, type) {
        try {
          const path =
            uid("F") +
            "-" +
            (name || "fisier").replace(/[^a-zA-Z0-9.\-_]/g, "_");
          const blob = await (await fetch(dataUrl)).blob();
          const { error } = await sb.storage
            .from(FILES_BUCKET)
            .upload(path, blob, {
              contentType: type || blob.type || "application/octet-stream",
              upsert: true,
            });
          if (error) throw error;
          return {
            id: path,
            name: name || "fișier",
            type: type || "",
            url: fileUrl(path),
          };
        } catch (e) {
          toast("Nu am putut salva fișierul");
          return null;
        }
      }

        if (rec && rec.id) {
          try {
            await sb.storage.from(FILES_BUCKET).remove([rec.id]);

      /* ===== GENERATOR ID-URI (contor atomic Supabase, evită coliziuni multi-utilizator) ===== */
      async function nextId(prefix, withYear) {
        const year = new Date().getFullYear();
        const key = withYear ? prefix + "-" + year : prefix;
        const { data, error } = await sb.rpc("next_counter", { p_key: key });
        const n = error ? Date.now() % 1000 : data;
        return withYear
          ? prefix + "-" + year + "-" + String(n).padStart(3, "0")
          : prefix + "-" + String(n).padStart(3, "0");

            ordLvl: {},
            cat: {},
            catReal: {},
            catEst: {},
            catN: {},
          };
          LOG_CATS.forEach((c) => {
            O.cat[c.k] = 0;
            O.catReal[c.k] = 0;
            O.catEst[c.k] = 0;
            O.ordLvl[c.k] = 0;
          });
          R.orders[o.id] = O;
        });

        /* 2. plăți către furnizor → curs marfă (mediu ponderat, restul la estimare) */
        PLATI.forEach((p) => {
          if (p.tip !== "furnizor") return;
          const O = R.orders[p.orderId];
          const r = payLei(p, O ? O.o : null);
          R.pay[p.id] = { ...r, p, ok: !!O };
          if (!O) {
            R.warn.push(
              `Plata furnizor ${p.doc || ""} nu e legată de nicio comandă existentă.`,
            );
            return;
          }
          O.P.push(p);
        });
        Object.values(R.orders).forEach((O) => {
          const o = O.o;
          O.cFOBest =
            o.valutaFOB === "USD"
              ? +o.cursProdus || +o.cursUSD || 0
              : o.valutaFOB === "EUR"
                ? +o.cursEUR || 0
                : 1;
          const furn = O.P.filter((p) => p.tip === "furnizor");
          const ok = furn.filter((p) => p.valuta === o.valutaFOB);
          furn
            .filter((p) => p.valuta !== o.valutaFOB)
            .forEach((p) =>
              O.warn.push(
                `Plata furnizor ${p.doc || ""} e în ${p.valuta}, dar marfa e în ${o.valutaFOB} — nu intră în costul mărfii.`,
              ),
            );
          O.paidFX = ok.reduce((a, p) => a + (+p.suma || 0), 0);
          O.paidLei = ok.reduce((a, p) => a + R.pay[p.id].lei, 0);
          O.cFOB = O.cFOBest;
          if (O.valoareFOB > 0 && O.paidFX > 0)
            O.cFOB =
              O.paidFX >= O.valoareFOB
                ? O.paidLei / O.paidFX
                : (O.paidLei + (O.valoareFOB - O.paidFX) * O.cFOBest) /
                  O.valoareFOB;
          if (O.valoareFOB > 0 && O.paidFX > O.valoareFOB * 1.005)
            O.warn.push(
              `Plățile către furnizor (${O.paidFX.toFixed(2)} ${o.valutaFOB}) depășesc valoarea modelelor (${O.valoareFOB.toFixed(2)}) — probabil includ piese; cursul mediu se aplică pe tot.`,
            );
          O.pctPlatit = O.valoareFOB ? Math.min(1, O.paidFX / O.valoareFOB) : 0;
          O.cursMediuFurn = O.paidFX ? O.paidLei / O.paidFX : 0;
          O.furnEstimat = ok.filter(
            (p) => R.pay[p.id].src === "estimat",
          ).length;
          O.M.forEach((m) => {
            m.produsLEI = m.pret * O.cFOB;
          });
        });

        /* 3. containere: rânduri, împărțire după spațiu (+ manual) și după valoare */
        CONTS.forEach((c) => {
          const C = {
            c,
            lines: [],
            warn: [],
            cat: {},
            catReal: {},
            catEst: {},
            total: 0,
            method: "volum",
            principal: null,
            sumPct: 1,
          };
          (c.lines || []).forEach((l) => {
            const O = R.orders[l.orderId];
            const m = O && O.MM[l.modelId];
            if (!O || !m) {
              C.warn.push(
                "Un rând face referire la o comandă sau un model care nu mai există — ignorat.",
              );
              return;
            }
            const L = {
              l,
              O,
              m,
              buc: +l.buc || 0,
              cbm: (+l.buc || 0) * m.cbm,
              kg: (+l.buc || 0) * m.kg,
              val: (+l.buc || 0) * m.pret * O.cFOB,
              cost: {},
              rel: 0,
            };
            C.lines.push(L);
          });
          const Ls = C.lines;
          const totVal = Ls.reduce((a, L) => a + L.val, 0);
          Ls.forEach((L) => {
            L.valShare = totVal
              ? L.val / totVal
              : Ls.length
                ? 1 / Ls.length
                : 0;
          });
          // propunere automată
          const unk = Ls.filter((L) => !(L.cbm > 0)),
            kn = Ls.filter((L) => L.cbm > 0);
          const knownCbm = kn.reduce((a, L) => a + L.cbm, 0);
          const bl = +c.cbmBL || 0;
          if (!unk.length && knownCbm > 0) {
            C.method = "volum";
            Ls.forEach((L) => (L.auto = L.cbm / knownCbm));
          } else if (bl > 0 && knownCbm < bl && unk.length) {
            C.method = "volum + rest din B/L";
            const rest = bl - knownCbm;
            const useKg = unk.every((L) => L.kg > 0);
            const den = unk.reduce((a, L) => a + (useKg ? L.kg : L.val), 0);
            unk.forEach((L) => {
              L.cbmRest = den
                ? (rest * (useKg ? L.kg : L.val)) / den
                : rest / unk.length;
            });
            Ls.forEach((L) => (L.auto = (L.cbm > 0 ? L.cbm : L.cbmRest) / bl));
          } else if (Ls.length) {
            const useKg = Ls.every((L) => L.kg > 0);
            C.method = useKg ? "greutate" : "valoare";
            const den = Ls.reduce((a, L) => a + (useKg ? L.kg : L.val), 0);
            Ls.forEach(
              (L) =>
                (L.auto = den ? (useKg ? L.kg : L.val) / den : 1 / Ls.length),
            );
            if (Ls.length > 1)
              C.warn.push(
                `Lipsește volumul (m³) — spațiul e împărțit provizoriu după ${useKg ? "greutate" : "valoare"}. Completează m³/buc la modele sau volumul de pe B/L, ori ajustează manual.`,
              );
          }
          // ajustare manuală
          const man = Ls.filter(
            (L) =>
              L.l.pctMan !== "" &&
              L.l.pctMan != null &&
              !Number.isNaN(+L.l.pctMan),
          );
          const sMan = man.reduce((a, L) => a + +L.l.pctMan / 100, 0);
          const aut = Ls.filter((L) => !man.includes(L));
          const sAut = aut.reduce((a, L) => a + L.auto, 0);
          man.forEach((L) => {
            L.share = +L.l.pctMan / 100;
            L.manual = true;
          });
          if (sMan > 1 + 1e-9) {
            C.warn.push(
              `Procentele introduse manual însumează ${(sMan * 100).toFixed(1)}% (peste 100%) — au fost normalizate.`,
            );
            man.forEach((L) => (L.share /= sMan));
            aut.forEach((L) => (L.share = 0));
          } else {
            const rest = 1 - sMan;
            aut.forEach(
              (L) =>
                (L.share = sAut
                  ? (rest * L.auto) / sAut
                  : aut.length
                    ? rest / aut.length
                    : 0),
            );
            if (!aut.length && man.length && Math.abs(sMan - 1) > 1e-6) {
              C.warn.push(
                `Toate rândurile sunt ajustate manual, dar totalul e ${(sMan * 100).toFixed(1)}% — normalizat la 100%.`,
              );
              man.forEach((L) => (L.share = sMan ? L.share / sMan : 0));
            }
          }
          C.sumPct = Ls.reduce((a, L) => a + L.share, 0);
          // comanda principală (cea mai mare valoare) — pentru estimare și cursuri
          let best = null;
          Ls.forEach((L) => {
            if (!best || L.val > best.val) best = L;
          });
          C.principal = best ? best.O : null;
          Ls.forEach((L) => {
            if (!L.O.contIds.includes(c.id)) L.O.contIds.push(c.id);
            L.O.lines.push({ L, C });
            L.m.placed += L.buc;
            L.m.lines.push(L);
          });
          R.conts[c.id] = C;
        });

        /* 4. plăți de logistică */
        const contPay = {};
        CONTS.forEach((c) => {
          contPay[c.id] = {};
          LOG_CATS.forEach((k) => (contPay[c.id][k.k] = 0));
        });
        PLATI.forEach((p) => {
          if (p.tip === "furnizor") return;
          let cat = p.tip;
          const C = R.conts[p.contId];
          const O = R.orders[p.orderId];
          const rateO = O ? O.o : C && C.principal ? C.principal.o : null;
          const r = payLei(p, rateO);
          R.pay[p.id] = { ...r, p, ok: true };
          if (O) O.P.push(p);
          if (p.contId && !C) {
            r.linkLost = true;
            if (O)
              O.warn.push(
                `Plata ${p.doc || ""} era legată de un container șters — tratată pe toată comanda.`,
              );
            else {
              R.warn.push(
                `Plata ${p.doc || ""} e legată de un container șters și de nicio comandă — ignorată.`,
              );
              R.pay[p.id].ok = false;
              return;
            }
          }
          if (cat === "comision") {
            if (C) {
              cat = "portExtra";
            } else {
              if (O) {
                O.comision = (O.comision || 0) + r.lei;
              } else {
                R.pay[p.id].ok = false;
              }
              return;
            }
          }
          if (C) {
            contPay[p.contId][cat] += r.lei;
          } else if (O) {
            O.ordLvl[cat] += r.lei;
          } else R.pay[p.id].ok = false;
        });
        Object.values(R.pay).forEach((x) => {
          x.difBNR =
            x.src === "extras" && +x.p.cursBNR > 0
              ? x.curs / x.p.cursBNR - 1
              : null;
          x.flag = x.difBNR !== null && Math.abs(x.difBNR) > BNR_TOL;
          if (x.flag) {
            const O = R.orders[x.p.orderId];
            const msg = `Plata ${x.p.doc || ""}: cursul efectiv ${x.curs.toFixed(4)} diferă cu ${(x.difBNR * 100).toFixed(1)}% de BNR ${(+x.p.cursBNR).toFixed(4)} — verifică suma în lei.`;
            (O ? O.warn : R.warn).push(msg);
          }
        });

        /* 5. cost logistic pe rând de container */
        CONTS.forEach((c) => {
          const C = R.conts[c.id];
          const Ls = C.lines;
          const P0 = C.principal ? C.principal.o : null;
          LOG_CATS.forEach((cat) => {
            const est =
              cat.k === "portExtra"
                ? ddEstLei(c, P0)
                : cat.f && P0
                  ? (+(P0.log || {})[cat.f] || 0) * rateEst(P0, cat.cur, false)
                  : 0;
            if (cat.k === "portExtra" && est > 0 && !(contPay[c.id][cat.k] > 0))
              Ls.forEach((L) => {
                const x = L.O.o.extra || {};
                if (+x.storage || +x.demurrage || +x.stationare)
                  L.O.warn.push(
                    `Containerul ${c.nr || ""} are estimare D&D calculată, iar comanda are și sume manuale la stocare/demurrage/staționare — verifică să nu fie dublate.`,
                  );
              });
            const real = contPay[c.id][cat.k];
            C.catEst[cat.k] = est;
            C.catReal[cat.k] = real > 0;
            let tot = 0;
            Ls.forEach((L) => {
              const w = cat.k === "asig" ? L.valShare : L.share;
              const O = L.O;
              const ordLvl = O.ordLvl[cat.k];
              let v = real !== 0 ? real * w : ordLvl !== 0 ? 0 : est * w;
              if (ordLvl !== 0) {
                const sh = O.lines.reduce((a, x) => a + x.L.share, 0);
                v += sh ? (ordLvl * L.share) / sh : 0;
                if (real !== 0)
                  O.warn.push(
                    `${CAT_LBL[cat.k]}: există plăți și pe container ${c.nr || ""}, și pe toată comanda — verifică să nu fie dublate.`,
                  );
              }
              L.cost[cat.k] = v;
              tot += v;
              O.cat[cat.k] += v;
              if (est || real !== 0 || ordLvl !== 0)
                O.catN[cat.k] = (O.catN[cat.k] || 0) + L.share; // categoria contează doar unde se aplică
              if (real !== 0 || ordLvl !== 0) O.catReal[cat.k] += L.share;
              if (est) O.catEst[cat.k] += est * w;
            });
            C.cat[cat.k] = tot;
            C.total += tot;
          });
          Ls.forEach((L) => {
            L.tr = Object.values(L.cost).reduce((a, b) => a + b, 0);
            L.na = (L.cost.tFobPod || 0) + (L.cost.asig || 0);
            L.m.tr += L.tr;
            L.m.na += L.na;
          });
        });

        /* 6. comenzi fără containere: estimare pe nr. de containere (logica veche, compatibilă) */
        Object.values(R.orders).forEach((O) => {
          if (O.lines.length) return;
          O.mode = "virtual";
          const o = O.o;
          const nc = Math.max(1, +o.nrCont || 1);
          O.ncVirt = nc;
          const cont = O.M.reduce(
            (a, m) => a + (m.contMan > 0 ? m.contMan : 0),
            0,
          );
          const contRest = Math.max(0, nc - cont),
            bucRest = O.M.reduce((a, m) => a + (m.contMan > 0 ? 0 : m.buc), 0);
          O.M.forEach((m) => {
            m.share =
              m.contMan > 0
                ? m.contMan / nc
                : bucRest
                  ? ((contRest / nc) * m.buc) / bucRest
                  : 0;
          });
          const ss = O.M.reduce((a, m) => a + m.share, 0);
          O.alocOK = Math.abs(ss - 1) < 1e-9;
          if (ss > 0 && !O.alocOK) O.M.forEach((m) => (m.share /= ss));
          LOG_CATS.forEach((cat) => {
            const est = cat.f
              ? (+(o.log || {})[cat.f] || 0) * rateEst(o, cat.cur, false) * nc
              : 0;
            const real = O.ordLvl[cat.k];
            const tot = real !== 0 ? real : est;
            O.cat[cat.k] = tot;
            O.catEst[cat.k] = est;
            O.catReal[cat.k] = real !== 0 ? 1 : 0;
            O.catN[cat.k] = 1;
            O.M.forEach((m) => {
              m.tr += tot * m.share;
              if (cat.k === "tFobPod" || cat.k === "asig")
                m.na += tot * m.share;
            });
          });
          O.M.forEach((m) => {
            m.placed = m.buc;
          });
        });
        Object.values(R.orders).forEach((O) => {
          if (!O.mode) O.mode = "containere";
          if (O.mode === "containere")
            O.M.forEach((m) => {
              if (m.placed < m.buc) {
                const un = m.buc - m.placed;
                const avgTr = m.placed ? m.tr / m.placed : 0,
                  avgNa = m.placed ? m.na / m.placed : 0;
                O.warn.push(
                  `${m.model || "Model"}: ${un} buc nu sunt încă în niciun container — transportul lor e estimat la media celorlalte (${avgTr.toFixed(2)} lei/buc).`,
                );
                m.tr += un * avgTr;
                m.na += un * avgNa;
              }
              if (m.placed > m.buc)
                O.warn.push(
                  `${m.model || "Model"}: în containere sunt ${m.placed} buc, dar comanda are ${m.buc} — verifică.`,
                );
            });
        });

        /* 6b. operațiuni vamale: Info TIR (net de TVA) + cost conformare; bucățile intrate în perfecționare formează un „pool” cu cost propriu */
        CONTS.forEach((c) => {
          const C = R.conts[c.id];
          C.opsNet = 0;
          C.opsTva = 0;
          C.perfBuc = 0;
          C.lines.forEach((L) => {
            L.opsBase = 0;
            L.pools = {};
            L.perf = 0;
          });
          (c.ops || [])
            .filter((op) => !op.anulat)
            .forEach((op) => {
              const gross = +op.infoTir || 0;
              const net = netTVA(gross, op.cotaTVA);
              C.opsTva += gross - net;
              const cost =
                net + (op.tip === "perfectionare" ? +op.costConf || 0 : 0);
              C.opsNet += cost;
              const partial =
                op.tip === "perfectionare" || op.acop === "partial";
              const items = partial
                ? (op.items || [])
                    .map((it) => {
                      const L = C.lines.find((x) => x.l.id === it.lineId);
                      return L ? { L, n: Math.min(+it.buc || 0, L.buc) } : null;
                    })
                    .filter((x) => x && x.n > 0)
                : [];
              const w = items.map(
                (x) => x.n * (x.L.buc ? x.L.share / x.L.buc : 0),
              );
              const ws = w.reduce((a, b) => a + b, 0);
              const part = (j) =>
                ws
                  ? (cost * w[j]) / ws
                  : items.length
                    ? cost / items.length
                    : 0;
              if (op.tip === "perfectionare") {
                items.forEach((x, j) => {
                  x.L.pools[op.id] = { n: x.n, cost: part(j), op, rel: 0 };
                  x.L.perf += x.n;
                });
              } else if (partial) {
                items.forEach((x, j) => {
                  x.L.opsBase += part(j);
                });
              } else
                C.lines.forEach((L) => {
                  L.opsBase += cost * L.share;
                });
              if (partial && !items.length && cost)
                C.warn.push(
                  `${OP_TIP[op.tip] ? OP_TIP[op.tip].lbl : "Operațiunea"} ${op.mrn || ""}: nu are bucăți alese — costul ei (${cost.toFixed(2)} lei) nu e alocat.`,
                );
            });
          C.lines.forEach((L) => {
            if (L.perf > L.buc)
              C.warn.push(
                `${L.m.model}: în perfecționare ${L.perf} buc, dar în container sunt ${L.buc}.`,
              );
            C.perfBuc += L.perf;
            L.m.opsEx =
              (L.m.opsEx || 0) +
              L.opsBase +
              Object.values(L.pools).reduce((a, P) => a + P.cost, 0);
            L.m.perf = (L.m.perf || 0) + L.perf;
          });
        });

        /* 7. DVI: articole → modele și rânduri de container */
        DVIS.forEach((d) => {
          const D = { d, arts: [], taxa: 0, tva: 0, buc: 0, warn: [] };
          const arts = (d.art || [])
            .map((a) => {
              const O = R.orders[a.orderId];
              const m = O && O.MM[a.modelId];
              return { a, O, m, val: m ? (+a.buc || 0) * m.pret * O.cFOB : 0 };
            })
            .filter((x) => {
              if (!x.m) {
                D.warn.push("Articol cu comandă/model inexistent — ignorat.");
                return false;
              }
              return true;
            });
          const sv = arts.reduce((s, x) => s + x.val, 0);
          const ex = +d.extra || 0;
          const findL = (s) => {
            const C = R.conts[s.contId];
            return C && C.lines.find((L) => L.l.id === s.lineId);
          };
          const infoC = {};
          D.infoTva = 0;
          Object.entries(d.infoTir || {}).forEach(([cid, g]) => {
            const net = netTVA(g, d.cotaInfo);
            if (net) {
              infoC[cid] = net;
              D.infoTva += (+g || 0) - net;
            }
          });
          const wC = {};
          arts.forEach((x) =>
            (x.a.src || []).forEach((s) => {
              const L = findL(s);
              if (L)
                wC[s.contId] =
                  (wC[s.contId] || 0) +
                  (+s.buc || 0) * (L.buc ? L.share / L.buc : 0);
            }),
          );
          Object.keys(infoC).forEach((cid) => {
            if (!wC[cid])
              D.warn.push(
                `Info TIR trecut pentru containerul ${contLabel(contOf(cid))}, din care nu se scoate nimic în acest DVI — nealocat.`,
              );
          });
          D.infoNet = Object.values(infoC).reduce((a, b) => a + b, 0);
          arts.forEach((x) => {
            const a = x.a,
              m = x.m,
              O = x.O;
            const buc = +a.buc || 0;
            const exS = sv
              ? (ex * x.val) / sv
              : arts.length
                ? ex / arts.length
                : 0;
            m.rel += buc;
            m.taxaRel += +a.taxa || 0;
            m.tvaRel += +a.tva || 0;
            m.dviEx += exS;
            D.taxa += +a.taxa || 0;
            D.tva += +a.tva || 0;
            D.buc += buc;
            let srcB = 0,
              srcTr = 0,
              srcOps = 0,
              info = 0;
            (a.src || []).forEach((s) => {
              const L = findL(s);
              if (!L) return;
              const sb = +s.buc || 0;
              L.rel += sb;
              if (s.pool) {
                const P = L.pools[s.pool];
                if (P) {
                  P.rel += sb;
                  srcOps += sb * (P.n ? P.cost / P.n : 0);
                } else
                  D.warn.push(
                    "Sursă din perfecționare anulată sau inexistentă — verifică DVI-ul.",
                  );
              }
              srcOps += sb * (L.buc ? L.opsBase / L.buc : 0);
              srcB += sb;
              srcTr += sb * (L.buc ? L.tr / L.buc : 0);
              if (infoC[s.contId] && wC[s.contId])
                info +=
                  (infoC[s.contId] * sb * (L.buc ? L.share / L.buc : 0)) /
                  wC[s.contId];
            });
            m.dviInfo = (m.dviInfo || 0) + info;
            const pool = ((a.src || []).find((s) => s.pool) || {}).pool || "";
            if (buc > 0 || +a.taxa || +a.tva)
              m.lots.push({
                d,
                a,
                buc,
                taxa: +a.taxa || 0,
                tva: +a.tva || 0,
                ex: exS,
                srcB,
                srcTr,
                srcOps,
                info,
                pool,
                O,
              });
            D.arts.push({ ...x, ex: exS, info });
          });
          R.dvi[d.id] = D;
        });
        Object.values(R.conts).forEach((C) => {
          C.lines.forEach((L) => {
            if (L.rel > L.buc)
              C.warn.push(
                `${L.m.model}: scoase ${L.rel} buc, dar în container sunt ${L.buc}.`,
              );
          });
          C.buc = C.lines.reduce((a, L) => a + L.buc, 0);
          C.rel = C.lines.reduce((a, L) => a + Math.min(L.rel, L.buc), 0);
          C.status = contStatus(C.c, C.rel, C.buc);
          C.perfUnrel = C.lines.reduce(
            (a, L) =>
              a +
              Object.values(L.pools).reduce(
                (x, P) => x + Math.max(0, P.n - P.rel),
                0,
              ),
            0,
          );
        });

        /* 8. cost pe model, loturi, stoc */
        Object.values(R.orders).forEach((O) => {
          const o = O.o;
          const nrBuc = O.nrBuc;
          const orderEx =
            EXTRA_KEYS.reduce((a, k) => a + (+(o.extra || {})[k] || 0), 0) +
            (O.comision || 0);
          O.extraTotal = orderEx;
          const exPerBuc = nrBuc ? orderEx / nrBuc : 0;
          O.M.forEach((m) => {
            const b = m.buc;
            m.trBuc = b ? m.tr / b : 0;
            m.naBuc = b ? m.na / b : 0;
            m.transportBuc = m.trBuc;
            if (m.rel > b)
              O.warn.push(
                `${m.model || "Model"}: DVI-urile acoperă ${m.rel} buc, comanda are ${b}.`,
              );
            m.unrel = Math.max(0, b - m.rel);
            m.taxaEstBuc = ((m.produsLEI + m.naBuc) * (+o.cotaVama || 0)) / 100;
            m.tvaEstBuc =
              ((m.produsLEI + m.taxaEstBuc + m.trBuc) * (+o.cotaTVA || 0)) /
              100;
            m.taxaTot = m.taxaRel + m.unrel * m.taxaEstBuc;
            m.tvaTot = m.tvaRel + m.unrel * m.tvaEstBuc;
            m.taxaVamala = b ? m.taxaTot / b : 0;
            m.tvaVamal = b ? m.tvaTot / b : 0;
            const opsAll = (m.opsEx || 0) + (m.dviInfo || 0);
            m.extraBuc = exPerBuc + (b ? (m.dviEx + opsAll) / b : 0);
            m.exBuc = m.extraBuc;
            m.bazaTVA = m.produsLEI + m.taxaVamala + m.trBuc;
            m.costNet = m.produsLEI + m.trBuc + m.taxaVamala + m.extraBuc;
            m.totalCuTVA = m.costNet + m.tvaVamal;
            const baza = o.bazaAdaos === "tva" ? m.totalCuTVA : m.costNet;
            m.vanzareB2B = baza * (1 + (+o.adaos || 0) / 100);
            m.marjaBuc = m.vanzareB2B - baza;
            m.lots.forEach((t) => {
              const trB = t.srcB ? t.srcTr / t.srcB : m.trBuc;
              const bb = t.buc || 1;
              t.trBuc = trB;
              t.taxaBuc = t.taxa / bb;
              t.tvaBuc = t.tva / bb;
              t.opsBuc = (t.srcOps + t.info) / bb;
              t.exBuc = exPerBuc + t.ex / bb + t.opsBuc;
              t.costNet = m.produsLEI + trB + t.taxaBuc + t.exBuc;
              t.cuTVA = t.costNet + t.tvaBuc;
            });
            const opsLots = m.lots.reduce((a, t) => a + t.srcOps, 0);
            m.unrelExBuc =
              exPerBuc +
              (m.unrel ? Math.max(0, (m.opsEx || 0) - opsLots) / m.unrel : 0); // extra pentru bucățile încă nescoase (operațiuni deja plătite)
            const fob = b * m.pret;
            m.coef = fob && O.cFOB ? (m.costNet * b) / (fob * O.cFOB) : 0;
            m.leiPerFX = fob ? (m.costNet * b) / fob : 0;
          });
          O.relBuc = O.M.reduce((a, m) => a + Math.min(m.rel, m.buc), 0);
          // stoc în antrepozit & datorie vamală potențială
          O.lines.forEach(({ L, C }) => {
            const un = Math.max(0, L.buc - L.rel);
            if (!un) return;
            const d = un * (L.m.taxaEstBuc + L.m.tvaEstBuc);
            L.debt = d;
            C.debt = (C.debt || 0) + d;
            C.unrel = (C.unrel || 0) + un;
            if (
              C.status === "antrepozit" ||
              C.status === "antrepozit-partial"
            ) {
              R.debt += d;
              R.debtBuc += un;
            }
          });
          const T = (k) => O.M.reduce((a, m) => a + m[k] * m.buc, 0);
          const avg = (k) => (nrBuc ? T(k) / nrBuc : 0);
          O.L = O.cat;
          O.logTotal = Object.values(O.cat).reduce((a, b) => a + b, 0);
          O.navluAsig = O.cat.tFobPod + O.cat.asig;
          const nCont = O.mode === "virtual" ? O.ncVirt : O.contIds.length;
          O.nc = nCont;
          O.catSt = {};
          LOG_CATS.forEach((c) => {
            const n = O.catN[c.k] || 0;
            O.catSt[c.k] = {
              real: O.catReal[c.k],
              n,
              est: O.catEst[c.k],
              full: n > 0 && O.catReal[c.k] >= n - 1e-9,
            };
          });
          const used = LOG_CATS.filter(
            (c) => O.catReal[c.k] > 0 || O.catEst[c.k] > 0,
          );
          O.realCats = used.filter((c) => O.catSt[c.k].full).length;
          O.totCats = used.length;
          O.extraAll =
            orderEx +
            O.M.reduce(
              (a, m) => a + m.dviEx + (m.opsEx || 0) + (m.dviInfo || 0),
              0,
            );
          if (+(o.extra || {}).infoTir)
            O.warn.push(
              `Info TIR pe comandă (câmp vechi): ${(+o.extra.infoTir).toFixed(2)} lei — trece-l pe operațiunile containerelor (istoric MRN) sau în DVI, apoi șterge-l din comandă.`,
            );
          O.platitLei = O.P.reduce(
            (a, p) => a + (R.pay[p.id] ? R.pay[p.id].lei : 0),
            0,
          );
          O.costSchimb = O.P.reduce((a, p) => {
            const x = R.pay[p.id];
            return x && x.src === "extras" && +p.cursBNR > 0
              ? a + (x.lei - (+p.suma || 0) * p.cursBNR)
              : a;
          }, 0);
          O.totalTranse =
            (+(o.transe || {}).avans || 0) +
            (+(o.transe || {}).rest || 0) +
            (+(o.transe || {}).preVapor || 0);
          Object.assign(O, {
            produsLEI: avg("produsLEI"),
            transportBuc: nrBuc ? O.M.reduce((a, m) => a + m.tr, 0) / nrBuc : 0,
            extraBuc: nrBuc ? O.extraAll / nrBuc : 0,
            taxaVamala: avg("taxaVamala"),
            tvaVamal: avg("tvaVamal"),
            bazaTVA: avg("bazaTVA"),
            totalCuTVA: avg("totalCuTVA"),
            costNet: avg("costNet"),
            vanzareB2B: avg("vanzareB2B"),
            marjaBuc: avg("marjaBuc"),
            costTotalNet: T("costNet"),
            totalCuTVATotal: T("totalCuTVA"),
            vanzareTotala: T("vanzareB2B"),
            marjaTotala: T("marjaBuc"),
            taxaTotal: T("taxaVamala"),
            tvaTotal: T("tvaVamal"),
            valoareTVA_LEI: T("produsLEI"),
            vamaDVI: nrBuc > 0 && O.relBuc >= nrBuc,
            tvaDVI: nrBuc > 0 && O.relBuc >= nrBuc,
          });
          O.final = O.pctPlatit >= 1 && O.realCats === O.totCats && O.vamaDVI;
        });
        const g = +(DB.settings || {}).garantie || 0;
        R.garantie = g;
        R.garUse = g ? R.debt / g : 0;
        _calcCache = R;
        _calcCacheV = _calcV;
        return R;
      }

            );

        dup(DB.offers, "Oferta");
        dup(DB.suppliers, "Furnizorul");

      function iso6346(raw) {

          return { st: "bad", s, err: "lungime " + s.length + " (trebuie 11)" };

          return { st: "bad", s, err: "format: 3 litere + U/J/Z/R + 7 cifre" };
        let sum = 0;

                docPlasare: "",
                navlu: c.navlu || "",
                rutier: c.rutier || "",
                descarcare: c.descarcare || "",
                nota: c.continut || "",
                locked: false,
                lines: lines[c.id],
              });
              if (+c.taxa || +c.tva || +c.extra) {
                const ls = lines[c.id];
                const vals = ls.map(
                  (l) =>
                    (+l.buc || 0) * (+(modelOf(o, l.modelId) || {}).pret || 0),
                );
                const sv = vals.reduce((a, b) => a + b, 0);
                DB.dvi.push({
                  id: uid("D"),
                  nr: "(migrat) " + (c.nr || ""),
                  data: c.descarcare || "",
                  cursVamal: 0,
                  extra: +c.extra || 0,
                  nota: "Migrat automat din versiunea anterioară",
                  conts: [c.id],
                  art: ls.map((l, j) => ({
                    id: uid("A"),
                    orderId: o.id,
                    modelId: l.modelId,
                    buc: +l.buc || 0,
                    taxa: sv ? ((+c.taxa || 0) * vals[j]) / sv : 0,
                    tva: sv ? ((+c.tva || 0) * vals[j]) / sv : 0,
                    src: [{ contId: c.id, lineId: l.id, buc: +l.buc || 0 }],
                  })),
                });
              }
            });
            o.nrCont = CL.length;
          }
          const VR = o.vamaReala || {};
          if (!CL.some((c) => +c.taxa || +c.tva) && (+VR.taxa || +VR.tva)) {
            const vals = o.modele.map((m) => (+m.buc || 0) * (+m.pret || 0));
            const sv = vals.reduce((a, b) => a + b, 0);
            DB.dvi.push({
              id: uid("D"),
              nr: "(migrat) total " + o.id,
              data: "",
              cursVamal: 0,
              extra: 0,
              nota: "Migrat automat",
              conts: [],
              art: o.modele.map((m, j) => {
                const src = srcForModel(o.id, m.id, +m.buc || 0);
                return {
                  id: uid("A"),
                  orderId: o.id,
                  modelId: m.id,
                  buc: +m.buc || 0,
                  taxa: sv ? ((+VR.taxa || 0) * vals[j]) / sv : 0,
                  tva: sv ? ((+VR.tva || 0) * vals[j]) / sv : 0,
                  src,
                  manual: !src.length,
                };
              }),
            });
          }
          (o.plati || []).forEach((p) => {
            const q = {
              ...p,
              id: p.id || uid("P"),
              orderId: o.id,
              contId: p.cont || "",
            };
            delete q.cont;
            DB.plati.push(q);
          });
          delete o.contList;
          delete o.plati;
          o.vamaReala = { taxa: 0, tva: 0 };
        });
        DB.v = 19;
        save();
      }

      /* ===== REGISTRU PLĂȚI (comun; filtrat pe comandă sau container) ===== */
      function payCtx() {
        return state.view === "container"
          ? { t: "cont", id: state.id }
          : { t: "order", id: state.id };
      }
      function payIdx(ctx) {
        return DB.plati
          .map((p, i) => i)
          .filter((i) => {
            const p = DB.plati[i];
            return ctx.t === "order"
              ? p.orderId === ctx.id
              : p.contId === ctx.id;
          })
          .sort((a, b) => {
            const da = DB.plati[a].data || "9999",
              db = DB.plati[b].data || "9999";
            return da < db ? -1 : da > db ? 1 : a - b;
          });
      }
      function refreshPlati() {
        const b = document.getElementById("plRows");
        if (!b) return;
        const ctx = payCtx();
        const R = computeAll();
        const O = ctx.t === "order" ? R.orders[ctx.id] : null;
        const cell = (lbl, inner, cls = "") =>
          `<div class="pl-c ${cls}"><label>${lbl}</label>${inner}</div>`;
        const num = (i, k, dis, ph = "") =>
          `<input class="num" type="number" step="any" value="${DB.plati[i][k] ?? ""}" ${dis ? 'disabled placeholder="—"' : `placeholder="${ph}"`} oninput="platF(${i},'${k}',this.valueAsNumber)">`;
        const types =
          ctx.t === "cont"
            ? PAY_TYPES.filter((t) => t.k !== "furnizor")
            : PAY_TYPES;
        b.innerHTML =
          payIdx(ctx)
            .map((i, n) => {
              const p = DB.plati[i];
              const isLei = p.valuta === "LEI";
              const where =
                ctx.t === "order"
                  ? cell(
                      "Container",
                      `<select onchange="platF(${i},'contId',this.value)"><option value="">Toată comanda</option>${O.contIds.map((cid) => `<option value="${cid}" ${p.contId === cid ? "selected" : ""}>${escH(contLabel(contOf(cid)))}</option>`).join("")}${p.contId && !O.contIds.includes(p.contId) ? `<option value="${escH(p.contId)}" selected>${escH(contLabel(contOf(p.contId)))} (alt)</option>` : ""}</select>`,
                    )
                  : cell(
                      "Introdusă din",
                      `<div style="font-size:13px;font-weight:600;padding:2px 0">${p.orderId ? escH(p.orderId) : "fișa containerului"}</div>`,
                    );
              return `<div class="pl-item" id="plr_${i}">
    <div class="pl-line pl-l1"><div class="pl-c pl-n">${n + 1}</div>
      ${cell("Data", `<input type="date" value="${p.data || ""}" oninput="platF(${i},'data',this.value)">`)}
      ${cell("Tip plată", `<select onchange="platF(${i},'tip',this.value)">${types.map((t) => `<option value="${t.k}" ${p.tip === t.k ? "selected" : ""}>${t.lbl}</option>`).join("")}</select>`)}
      ${where}
      ${cell("Document", `<input value="${escH(p.doc)}" placeholder="OP / factură / extras" oninput="platF(${i},'doc',this.value)">`, "pl-span2")}
      <div class="pl-c pl-n"><button class="grid-rm" title="Șterge plata" onclick="rmPlata(${i})">${ICON.x}</button></div></div>
    <div class="pl-line pl-l2"><div class="pl-c pl-n"></div>
      ${cell("Valută", `<select onchange="platF(${i},'valuta',this.value)">${["USD", "EUR", "LEI"].map((v) => `<option ${p.valuta === v ? "selected" : ""}>${v}</option>`).join("")}</select>`)}
      ${cell("Sumă " + (isLei ? "LEI" : p.valuta), num(i, "suma", false, "0"))}
      ${cell("LEI debitat (extras)", num(i, "lei", isLei, "din extras"))}
      ${cell("Curs BNR", num(i, "cursBNR", isLei, "ex. 4.3105"))}
      <div class="pl-c pl-res"><label style="text-align:right">Echivalent LEI</label><span id="pll_${i}">—</span><div id="plc_${i}" style="font-size:11px;color:var(--muted);font-weight:500"></div></div><div class="pl-c pl-n"></div></div>
    </div>`;
            })
            .join("") ||
          `<div style="padding:16px;text-align:center;color:var(--muted-2);font-weight:500;border:1px dashed var(--border-2);border-radius:8px">Nicio plată înregistrată — costul folosește estimările. Adaugă plățile din extrasele de bancă.</div>`;
        renderPlatiCalc();
      }
      function platF(i, k, v) {
        const p = DB.plati[i];
        if (!p) return;
        if (["suma", "lei", "cursBNR"].includes(k)) v = Number.isNaN(v) ? 0 : v;
        p[k] = v;
        if (k === "tip" && !+p.suma) {
          const o = ordOf(p.orderId);
          p.valuta = PAY_DEF_CUR[v] || (o ? o.valutaFOB : "USD");
        }
        if (k === "valuta" && v === "LEI") {
          p.lei = 0;
          p.cursBNR = 0;
        }
        save();
        if (["tip", "contId", "valuta"].includes(k)) refreshPlati();
        afterPayChange();
      }
      function afterPayChange() {
        if (state.view === "container") refreshContCalc();
        else recalc();
      }
      function addPlata() {
        const ctx = payCtx();
        if (ctx.t === "order") {
          const o = cur();
          DB.plati.push({
            id: uid("P"),
            data: today(),
            tip: "furnizor",
            orderId: o.id,
            contId: "",
            valuta: o.valutaFOB,
            suma: 0,
            lei: 0,
            cursBNR: 0,
            doc: "",
          });
        } else
          DB.plati.push({
            id: uid("P"),
            data: today(),
            tip: "tFobPod",
            orderId: "",
            contId: ctx.id,
            valuta: "USD",
            suma: 0,
            lei: 0,
            cursBNR: 0,
            doc: "",
          });
        save();
        refreshPlati();
        afterPayChange();
      }
      function rmPlata(i) {
        DB.plati.splice(i, 1);
        save();
        refreshPlati();
        afterPayChange();
      }
      function renderPlatiCalc() {
        const R = computeAll();
        const ctx = payCtx();
        const pill = (s) =>
          ({
            extras: '<span class="pill green">extras</span>',
            bnr: '<span class="pill blue">BNR</span>',
            estimat: '<span class="pill orange">estimat</span>',
            lei: '<span class="pill gray">lei</span>',
          })[s] || "";
        const W = [];
        payIdx(ctx).forEach((i) => {
          const p = DB.plati[i];
          const x = R.pay[p.id];
          if (!x) return;
          const ec = document.getElementById("plc_" + i),
            el = document.getElementById("pll_" + i),
            tr = document.getElementById("plr_" + i);
          if (ec)
            ec.innerHTML =
              p.valuta === "LEI"
                ? ""
                : (x.curs ? "curs " + x.curs.toFixed(4) : "—") +
                  (x.difBNR !== null
                    ? ` <span style="color:${x.flag ? "var(--red)" : "var(--muted)"};font-weight:700">${x.difBNR >= 0 ? "+" : ""}${(x.difBNR * 100).toFixed(2)}%</span>`
                    : "");
          if (el) el.innerHTML = lei(x.lei) + " " + pill(x.src);
          if (tr) tr.classList.toggle("flag", !!x.flag);
          if (x.flag)
            W.push(
              `Plata ${p.doc || "#"}: cursul efectiv ${x.curs.toFixed(4)} diferă cu ${(x.difBNR * 100).toFixed(1)}% de BNR — verifică suma în lei.`,
            );
        });
        const w = document.getElementById("plWarn");
        if (ctx.t === "order") {
          const O = R.orders[ctx.id];
          if (w) w.innerHTML = warnList([...O.warn, ...R.warn]);
          const S = document.getElementById("plSum");
          if (!S) return;
          const o = O.o;
          const pct = Math.round(O.pctPlatit * 1000) / 10;
          const rest = Math.max(0, O.valoareFOB - O.paidFX);
          S.innerHTML = `<div class="pl-card"><b class="k">Marfă (furnizor)</b><span class="v">${pct}%</span> plătit<div class="bar"><i style="width:${Math.min(100, pct)}%"></i></div>
      ${val(O.paidFX, o.valutaFOB)} din ${val(O.valoareFOB, o.valutaFOB)}<br>Rest de plătit: <b>${val(rest, o.valutaFOB)}</b>${O.totalTranse ? `<br><span style="color:var(--muted)">Plan tranșe: ${val(O.totalTranse, o.valutaFOB)}</span>` : ""}</div>
    <div class="pl-card"><b class="k">Curs marfă</b>Curs mediu efectiv: <span class="v">${O.cursMediuFurn ? O.cursMediuFurn.toFixed(4) : "—"}</span><br>Folosit în cost: <b>${O.cFOB.toFixed(4)}</b><br><span style="color:var(--muted)">${pct >= 100 ? "100% din plăți reale" : `${(100 - pct).toFixed(1)}% încă la estimarea ${O.cFOBest.toFixed(4)}`}</span>${O.furnEstimat ? `<br><span style="color:#B4651A">${O.furnEstimat} plată fără extras/BNR</span>` : ""}</div>
    <div class="pl-card"><b class="k">Logistică</b><span class="v">${O.realCats}/${O.totCats}</span> categorii complet reale<br><span style="color:var(--muted)">pe toate containerele comenzii; plățile introduse din fișa containerului sunt incluse</span></div>
    <div class="pl-card"><b class="k">Total plătit (din această comandă)</b><span class="v">${lei(O.platitLei)}</span><br>Cost schimb față de BNR: <b style="color:${O.costSchimb > 0 ? "var(--red)" : "var(--green)"}">${lei(O.costSchimb)}</b><br><span style="color:var(--muted)">doar plățile cu extras + curs BNR</span></div>`;
        } else if (w) w.innerHTML = warnList(W);
      }

      /* ===== MODELE ÎN COMANDĂ ===== */
      function refreshModels() {
        const o = cur();
        const b = document.getElementById("modTbl");
        if (!b) return;
        const O = compute(o);
        const virt = O.mode === "virtual";
        const numC = (i, k, w, step = "any") =>
          `<td style="padding:0"><input type="number" step="${step}" value="${o.modele[i][k] || ""}" oninput="modelF(${i},'${k}',this.valueAsNumber)" style="text-align:right;font-family:var(--mono)"></td>`;
        b.innerHTML = `<div style="overflow-x:auto"><table class="grid-tbl" style="min-width:${virt ? 820 : 740}px"><thead><tr><th class="idx"></th><th>Model</th><th style="text-align:right;width:80px">Bucăți</th><th style="text-align:right;width:105px">Preț/buc FOB</th><th style="text-align:right;width:82px" title="volum cutie din packing list">m³/buc</th><th style="text-align:right;width:72px">kg/buc</th><th style="width:96px">Tip</th>${virt ? '<th style="text-align:right;width:92px">Containere</th>' : ""}<th style="text-align:right;width:120px">Valoare</th><th class="rm"></th></tr></thead><tbody>
  ${o.modele
    .map(
      (
        m,
        i,
      ) => `<tr><td class="idx">${i + 1}</td><td><input value="${escH(m.model)}" oninput="modelF(${i},'model',this.value)" placeholder="ex. Tricicletă T3"></td>
    ${numC(i, "buc")}${numC(i, "pret")}${numC(i, "cbm")}${numC(i, "kg")}
    <td style="padding:0"><select onchange="modelF(${i},'tip',this.value)" style="width:100%;border:0;background:transparent;padding:8px 10px;font-weight:600"><option value="produs" ${m.tip !== "piese" ? "selected" : ""}>Produs</option><option value="piese" ${m.tip === "piese" ? "selected" : ""}>Piese (lot)</option></select></td>
    ${virt ? `<td style="padding:0"><input type="number" step="any" value="${m.cont || ""}" placeholder="comun" oninput="modelF(${i},'cont',this.valueAsNumber)" style="text-align:right;font-family:var(--mono)"></td>` : ""}
    <td style="text-align:right;padding:8px 10px;font-family:var(--mono);color:var(--muted)"><span id="mv_${i}"></span></td>
    <td class="rm"><button class="grid-rm" onclick="rmModel(${i})">${ICON.x}</button></td></tr>`,
    )
    .join("")}</tbody></table></div>`;
      }
      function syncModels() {
        const o = cur();
        const n = o.modele.reduce((a, m) => a + (+m.buc || 0), 0);
        o.nrBuc = n;
        o.pretBuc = n
          ? o.modele.reduce((a, m) => a + (+m.buc || 0) * (+m.pret || 0), 0) / n
          : 0;
      }
      function modelF(i, k, v) {
        cur().modele[i][k] =
          !["model", "tip"].includes(k) && Number.isNaN(v) ? 0 : v;
        syncModels();
        save();
        recalc();
      }
      function addModel() {
        cur().modele.push({
          id: uid("M"),
          model: "",
          buc: 0,
          pret: 0,
          cbm: 0,
          kg: 0,
          tip: "produs",
          cont: 0,
        });
        syncModels();
        save();
        refreshModels();
        recalc();
      }
      function modelUsed(o, mid) {
        const inL = (DB.containers || []).some((c) =>
          (c.lines || []).some((l) => l.orderId === o.id && l.modelId === mid),
        );
        const inD = (DB.dvi || []).some((d) =>
          (d.art || []).some((a) => a.orderId === o.id && a.modelId === mid),
        );
        return inL || inD;
      }
      function rmModel(i) {
        const o = cur();
        if (o.modele.length <= 1)
          return toast("Comanda trebuie să aibă cel puțin un model");
        if (modelUsed(o, o.modele[i].id))
          return toast(
            "Modelul apare în containere sau DVI — scoate-l întâi de acolo",
          );
        o.modele.splice(i, 1);
        syncModels();
        save();
        refreshModels();
        recalc();
      }

      /* ===== CONTAINERE ÎN FIȘA COMENZII ===== */
      function refreshOrdConts() {
        const o = cur();
        const b = document.getElementById("ordConts");
        if (!b) return;
        const R = computeAll();
        const O = R.orders[o.id];
        let h = "";
        if (O.mode === "virtual")
          h += noteBox(
            `Marfa comenzii nu e încă încărcată în containere. Transportul se estimează pe <b>${O.ncVirt} container(e)</b> (câmpul „Nr. containere”). Când știi încărcarea, creează containerele — inclusiv cele combinate cu marfă din alte comenzi.`,
          );
        else {
          h += `<div style="overflow-x:auto"><table class="grid-tbl" style="min-width:760px"><thead><tr><th>Container</th><th>Status</th><th>Marfa acestei comenzi</th><th>Alte comenzi în container</th><th style="text-align:right">Spațiu</th><th style="text-align:right">Transport alocat</th><th style="text-align:right">Scos</th></tr></thead><tbody>`;
          O.contIds.forEach((cid) => {
            const C = R.conts[cid];
            const mine = C.lines.filter((L) => L.O === O),
              other = C.lines.filter((L) => L.O !== O);
            const sh = mine.reduce((a, L) => a + L.share, 0),
              tr = mine.reduce((a, L) => a + L.tr, 0),
              rel = mine.reduce((a, L) => a + Math.min(L.rel, L.buc), 0),
              buc = mine.reduce((a, L) => a + L.buc, 0);
            h += `<tr style="cursor:pointer" onclick="openCont('${cid}')"><td style="padding:8px 10px"><span class="id-link" style="font-family:var(--mono)">${escH(contLabel(C.c))}</span><div>${isoBadge(C.c.nr)}</div></td><td style="padding:8px 10px">${stPill(C.status)}</td>
        <td style="padding:8px 10px">${mine.map((L) => `${escH(L.m.model)} × ${L.buc}`).join("<br>")}</td><td style="padding:8px 10px;color:var(--muted)">${other.length ? other.map((L) => `${escH(L.O.o.id)}: ${escH(L.m.model)} × ${L.buc}`).join("<br>") : "—"}</td>
        <td class="r" style="padding:8px 10px;font-family:var(--mono)">${pct1(sh)}${mine.some((L) => L.manual) ? ' <span class="pill orange">manual</span>' : ""}</td><td class="r" style="padding:8px 10px;font-family:var(--mono)">${lei(tr)}</td><td class="r" style="padding:8px 10px;font-family:var(--mono)">${rel}/${buc}</td></tr>`;
          });
          h += `</tbody></table></div>`;
        }
        h += `<div style="display:flex;gap:14px;margin-top:10px;flex-wrap:wrap"><button class="grid-add" onclick="newContForOrder()">${ICON.plus}Container nou cu marfă din comandă</button><button class="grid-add" onclick="addOrderToCont()">${ICON.cont}Adaugă marfă în container existent</button></div>`;
        b.innerHTML = h;
      }
      function openCont(id) {
        state.view = "container";
        state.id = id;
        render();
        window.scrollTo(0, 0);
      }
      function newCont(lines, nr) {
        const c = {
          id: uid("C"),
          nr: nr || "",
          tip: "40HQ",
          cbmBL: 0,
          kgBL: 0,
          sosit: false,
          ops: [],
          navlu: "",
          rutier: "",
          descarcare: "",
          nota: "",
          locked: false,
          lines: lines || [],
        };
        DB.containers.push(c);
        save();
        return c;
      }
      function newContForOrder() {
        const o = cur();
        const c = newCont(
          o.modele.map((m) => ({
            id: uid("L"),
            orderId: o.id,
            modelId: m.id,
            buc: 0,
            pctMan: null,
            nota: "",
          })),
        );
        toast("Container creat — completează numărul și bucățile");
        openCont(c.id);
      }
      function addOrderToCont() {
        const o = cur();
        if (!DB.containers.length) return newContForOrder();
        openModal(
          "Adaugă marfă în container",
          `<p class="sub" style="margin-bottom:10px">Alege containerul în care se află și marfă din <b>${o.id}</b>:</p><select id="pickCont" style="width:100%;padding:8px;border:1px solid var(--border-2);border-radius:8px">${DB.containers.map((c) => `<option value="${c.id}">${escH(contLabel(c))} — ${escH(contSummary(c))}</option>`).join("")}</select>`,
          `<button class="btn btn-default" onclick="closeModal()">Renunță</button><button class="btn btn-primary" onclick="doAddOrderToCont()">Adaugă</button>`,
        );
      }
      function doAddOrderToCont() {
        const o = cur();
        const c = contOf(document.getElementById("pickCont").value);
        if (!c) return;
        o.modele.forEach((m) =>
          c.lines.push({
            id: uid("L"),
            orderId: o.id,
            modelId: m.id,
            buc: 0,
            pctMan: null,
            nota: "",
          }),
        );
        save();
        closeModal();
        openCont(c.id);
        toast(
          "Rânduri adăugate — completează bucățile, șterge ce nu e în container",
        );
      }

      /* ===== DVI & STOC ÎN FIȘA COMENZII ===== */
      function refreshOrdDvi(O) {
        const b = document.getElementById("ordDvi");
        if (!b) return;
