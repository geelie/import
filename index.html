      }
      function payPasteHere() {
        const c = curCont();
        if (!payClip || !contSpots(c).some((v) => payClip.spots.includes(v)))
          return;
        const r = payPaste([c.id]);
        refreshPlati();
        afterPayChange();
        toast(
          `${r.added} plăți lipite${r.skipped ? ` · ${r.skipped} existau deja și n-au fost dublate` : ""}`,
        );
      }
      function payPaste(targetIds) {
        let added = 0,
          skipped = 0;
        const touched = new Set();
        const key = (p) =>
          [
            p.tip,
            p.valuta,
            +p.suma || 0,
            String(p.doc || "").trim(),
            p.data || "",
          ].join("|");
        targetIds.forEach((cid) => {
          const tc = contOf(cid);
          if (!tc || cid === payClip.from) return;
          if (!contSpots(tc).some((v) => payClip.spots.includes(v))) return; // doar același spot
          const have = new Set(
            DB.plati.filter((p) => p.contId === cid).map(key),
          );
          const tOrders = new Set((tc.lines || []).map((l) => l.orderId));
          payClip.items.forEach((it) => {
            if (have.has(key(it))) {
              skipped++;
              return;
            }
            const np = JSON.parse(JSON.stringify(it));
            np.id = uid("P");
            np.contId = cid;
            np.orderId =
              it.orderId && tOrders.has(it.orderId) ? it.orderId : "";
            DB.plati.push(np);
            have.add(key(np));
            added++;
            touched.add(cid);
          });
        });
        if (added) save();
        return { added, skipped, conts: touched.size };
      }

      /* ===== MODELE ÎN COMANDĂ ===== */
      function refreshModels() {

        const O = compute(o);

        const numC = (i, k, w, step = "any") =>

    .map(
      (
        m,

      ) => `<tr><td class="idx">${i + 1}</td><td><input value="${escH(m.model)}" oninput="modelF(${i},'model',this.value)" placeholder="ex. Tricicletă T3"></td>
    ${numC(i, "buc")}${numC(i, "pret")}${numC(i, "cbm")}${numC(i, "kg")}
    <td style="padding:0"><select onchange="modelF(${i},'tip',this.value)" style="width:100%;border:0;background:transparent;padding:8px 10px;font-weight:600"><option value="produs" ${m.tip !== "piese" ? "selected" : ""}>Produs</option><option value="piese" ${m.tip === "piese" ? "selected" : ""}>Piese (lot)</option></select></td>

      function syncModels() {
        const o = cur();
        const n = o.modele.reduce((a, m) => a + (+m.buc || 0), 0);

        o.pretBuc = n
          ? o.modele.reduce((a, m) => a + (+m.buc || 0) * (+m.pret || 0), 0) / n
          : 0;

      function modelF(i, k, v) {
        cur().modele[i][k] =
          !["model", "tip"].includes(k) && Number.isNaN(v) ? 0 : v;

        save();
        recalc();

          pret: 0,
          cbm: 0,
          kg: 0,

      function modelUsed(o, mid) {
        const inL = (DB.containers || []).some((c) =>

        );
        const inD = (DB.dvi || []).some((d) =>

        o.modele.splice(i, 1);
        syncModels();
        save();
        refreshModels();
        recalc();

        h += `<div class="section"><div class="section-h"><span class="sh-ic">${ICON.warn}</span>Free time & demurrage / detention <span class="sh-note">numărătoare de la data descărcării</span></div><div class="section-b"><div id="cDD"></div><div id="cDDCalc"></div></div></div>`;
        h += `<div class="section"><div class="section-h"><span class="sh-ic">${ICON.shield}</span>Istoric MRN & operațiuni vamale <span class="sh-note">nimic nu se șterge · DVI-urile apar automat</span></div><div class="section-b">

      function contSet(k, v) {

            "select[onchange^=\"contSet('sosit'\"]",

        const c = curCont();

    <td ${td}><span id="clc_${i}"></span><div id="clk_${i}" style="font-size:10.5px;color:var(--muted)"></div></td><td ${td}><span id="clv_${i}"></span></td>
    <td style="padding:0"><input type="number" step="any" min="0" max="100" ${dis} id="clp_${i}" value="${l.pctMan ?? ""}" placeholder="auto" oninput="lineSet(${i},'pctMan',this.value===''?null:this.valueAsNumber)" style="text-align:right;font-family:var(--mono)"></td>

    <td class="rm" id="clx_${i}" style="white-space:nowrap">${lineBtns(c, l, i)}</td></tr>`;
            })

          `<tr><td colspan="9" style="padding:14px;text-align:center;color:var(--muted-2);font-weight:500">Container gol — adaugă rânduri cu marfa din comenzi.</td></tr>`;

      function lineBtns(c, l, i) {
        if (c.locked) return "";

          (l.pctMan != null
            ? `<button class="grid-rm" title="Revino la propunerea automată" onclick="lineSet(${i},'pctMan',null);refreshContLines()">${ICON.undo}</button>`

          `<button class="grid-rm" title="Șterge rândul" onclick="rmContLine(${i})">${ICON.x}</button>`
        );
      }
      function lineSet(i, k, v) {
        const c = curCont();
        const l = c.lines[i];
        if (!l || c.locked) return;
        if (k === "buc") v = Number.isNaN(v) ? 0 : Math.max(0, v);
        if (k === "pctMan" && v !== null && Number.isNaN(v)) v = null;
        l[k] = v;
        if (k === "orderId") {
          const o = ordOf(v);
          l.modelId = o && o.modele[0] ? o.modele[0].id : "";
        }
        save();
        if (k === "orderId" || k === "modelId") return refreshContLines();
        if (k === "pctMan") {
          const x = document.getElementById("clx_" + i);
          if (x) x.innerHTML = lineBtns(c, l, i);

        if (k !== "nota") refreshContCalc();
      }
      function lineInDvi(c, l) {
        return (DB.dvi || []).some((d) =>
          (d.art || []).some((a) =>

          ),

      function addContLine() {
        const c = curCont();

        const oid = last ? last.orderId : (DB.orders[0] || {}).id || "";
        const o = ordOf(oid);
        c.lines.push({
          id: uid("L"),
          orderId: oid,
          modelId: o && o.modele[0] ? o.modele[0].id : "",
          buc: 0,
          pctMan: null,
          nota: "",

        save();
        refreshContLines();

      function rmContLine(i) {

        save();
        refreshContLines();

          (p) => p.contId === id && !p.orderId,

          "Șterge containerul",

            ? `<table class="grid-tbl"><thead><tr><th>DVI</th><th>Data</th><th>Scos din acest container</th></tr></thead><tbody>${ds
                .map(
                  (d) =>
                    `<tr style="cursor:pointer" onclick="openDvi('${d.id}')"><td style="padding:8px 10px"><span class="id-link">${escH(d.nr || "(fără nr.)")}</span></td><td style="padding:8px 10px">${d.data ? ro(d.data) : "—"}</td><td style="padding:8px 10px">${d.art
                      .map((a) => {
                        const n = (a.src || [])
                          .filter((s) => s.contId === c.id)
                          .reduce((x, s) => x + (+s.buc || 0), 0);
                        if (!n) return "";
                        const m = modelOf(ordOf(a.orderId), a.modelId);
                        return `${escH(m ? m.model : "?")} × ${n}`;
                      })
                      .filter(Boolean)
                      .join(", ")}</td></tr>`,
                )
                .join("")}</tbody></table>`
            : '<div style="color:var(--muted);font-size:12.5px;margin-bottom:6px">Nimic scos încă din acest container.</div>',
        );
        const un = C.buc - C.rel;
        set(
          "cSide",
          `<div class="fs-hd" style="margin-top:0">Status</div><div class="fs-row"><span class="k">Stare</span><span class="v">${stPill(C.status)}</span></div>
    <div class="fs-row"><span class="k">Bucăți</span><span class="v">${C.buc}</span></div><div class="fs-row"><span class="k">Scoase</span><span class="v">${C.rel}</span></div><div class="fs-row"><span class="k">Rămase</span><span class="v">${un}</span></div>
    <div class="fs-hd">Costuri (LEI)</div><div class="fs-row"><span class="k">Logistică container</span><span class="v big">${lei0(C.total)}</span></div>
    <div class="fs-row"><span class="k">Categorii din plăți</span><span class="v">${LOG_CATS.filter((k) => C.catReal[k.k]).length}</span></div>
    <div class="fs-row"><span class="k">Operațiuni vamale (net)</span><span class="v">${lei0(C.opsNet || 0)}</span></div>
    ${C.perfBuc ? `<div class="fs-row"><span class="k">În perfecționare (nescoase)</span><span class="v">${C.perfUnrel}/${C.perfBuc}</span></div>` : ""}
    ${un && C.debt ? `<div class="fs-hd">Vamă de plătit (estimat)</div><div class="fs-row"><span class="k">Taxă + TVA rămase</span><span class="v">${lei0(C.debt)}</span></div>` : ""}`,
        );
        renderPlatiCalc();
        refreshDDCalc();
      }

      /* ===== FREE TIME & D&D (demurrage / detention) pe container =====
   Trepte: fiecare treaptă e valabilă până în ziua „pana” inclusiv (gol = în continuare), cu tarif pe zi în moneda aleasă.
   Zilele libere = treptele de la început cu tarif 0. Combinat: descărcare → returnare gol.
   Separat: demurrage descărcare → ridicare din port; detention ridicare → returnare gol. Neîncheiat = calculat până azi. */
      const dNum = (s) =>
        s ? Math.floor(Date.parse(s + "T00:00:00Z") / 864e5) : null;
      const dStr = (n) => new Date(n * 864e5).toISOString().slice(0, 10);
      const ddToday = () => {
        const d = new Date();
        return (
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0")
        );
      };
      function ddDef() {
        return {
          mod: "combinat",
          incl: true,
          moneda: "USD",
          curs: 0,
          ridicare: "",
          retur: "",
          tA: [
            { pana: 14, tarif: 0 },
            { pana: "", tarif: 0 },
          ],
          tB: [
            { pana: 7, tarif: 0 },
            { pana: "", tarif: 0 },
          ],
        };
      }
      function ddOf(c) {
        if (!c.dd) c.dd = ddDef();
        return c.dd;
      }
      function ddRate(T, day) {
        for (const t of T) {
          const p = +t.pana || 0;
          if (!p || day <= p) return +t.tarif || 0;
        }
        return T.length ? +T[T.length - 1].tarif || 0 : 0;
      }
      function ddFree(T) {
        let d = 1;
        while (d <= 3650 && ddRate(T, d) === 0) d++;
        return d > 3650 ? Infinity : d - 1;
      }
      function ddPart(T, startS, endS, incl, lbl, endLbl) {
        const tn = dNum(ddToday());
        const s = dNum(startS);
        if (s == null)
          return { lbl, endLbl, pending: true, free: ddFree(T), cost: 0 };
        if (s > tn)
          return {
            lbl,
            endLbl,
            future: true,
            startS,
            free: ddFree(T),
            cost: 0,
            n: 0,
            left: Infinity,
          };
        const e = endS ? dNum(endS) : tn,
          closed = !!endS && e <= tn,
          planned = !!endS && e > tn,
          bad = !!endS && e < s;
        const n = bad ? 0 : Math.max(0, e - s + (incl ? 1 : 0));
        let cost = 0;
        for (let d = 1; d <= n; d++) cost += ddRate(T, d);
        const free = ddFree(T),
          lastFree = free === Infinity ? null : s + free - (incl ? 1 : 0);
        const left = lastFree == null ? Infinity : lastFree - tn;
        return {
          lbl,
          endLbl,
          startS,
          endS,
          closed,
          planned,
          bad,
          n,
          cost,
          free,
          lastFree,
          left,
          noTariff: !T.some((t) => +t.tarif > 0),
        };
      }
      function ddTierWarn(T, lbl) {
        const w = [];
        let prev = 0;
        T.forEach((t, i) => {
          const p = +t.pana || 0;
          if (!p && i < T.length - 1)
            w.push(
              `${lbl}: treapta ${i + 1} n-are sfârșit („în continuare”), deci treptele de după ea nu se aplică.`,
            );
          else if (p && p <= prev)
            w.push(
              `${lbl}: treapta ${i + 1} se termină în ziua ${p}, nu după treapta anterioară (ziua ${prev}) — verifică ordinea.`,
            );
          if (p) prev = p;
        });
        return w;
      }
      function ddCalc(c, P0) {
        if (!c || !c.descarcare) return { ok: false };
        const d = c.dd || ddDef();
        const parts =
          d.mod === "separat"
            ? [
                ddPart(
                  d.tA,
                  c.descarcare,
                  d.ridicare,
                  d.incl,
                  "Demurrage (în port)",
                  "ridicare din port",
                ),
                ddPart(
                  d.tB,
                  d.ridicare,
                  d.retur,
                  d.incl,
                  "Detention (la tine)",
                  "returnare gol",
                ),
              ]
            : [
                ddPart(
                  d.tA,
                  c.descarcare,
                  d.retur,
                  d.incl,
                  "D&D combinat",
                  "returnare gol",
                ),
              ];
        let rate = 1,
          rateSrc = "LEI";
        if (d.moneda !== "LEI") {
          if (+d.curs > 0) {
            rate = +d.curs;
            rateSrc = "introdus";
          } else {
            rate = P0
              ? +(d.moneda === "USD" ? P0.cursUSD : P0.cursEUR) || 0
              : 0;
            rateSrc = rate ? "din comanda " + P0.id : "lipsă";
          }
        }
        const totalCur = parts.reduce((a, p) => a + p.cost, 0),
          totalLei = totalCur * rate;
        const act = parts.filter((p) => !p.pending && !p.closed && !p.future);
        let level = "inchis";
        if (act.some((p) => (p.planned ? p.left < 0 : p.cost > 0)))
          level = "rosu";
        else if (act.length) {
          const m = Math.min(...act.map((p) => p.left));
          level = m <= 3 ? "portocaliu" : "verde";
        } else if (parts.some((p) => p.pending || p.future)) level = "verde";
        const minLeft = act.length
          ? Math.min(...act.map((p) => p.left))
          : Infinity;
        return {
          ok: true,
          d,
          parts,
          rate,
          rateSrc,
          totalCur,
          totalLei,
          level,
          minLeft,
        };
      }
      function ddActive(c) {
        const d = c && c.dd;
        return !!(
          d &&
          c.descarcare &&
          (d.mod === "separat" ? [...d.tA, ...d.tB] : d.tA).some(
            (t) => +t.tarif > 0,
          )
        );
      }
      function ddEstLei(c, P0) {
        const r = ddCalc(c, P0);
        return r.ok ? r.totalLei : 0;
      }
      function ddLeftTxt(n) {
        return n === Infinity
          ? "fără tarif introdus"
          : n < 0
            ? "depășit cu " + -n + " zile"
            : n === 0
              ? "azi e ultima zi liberă"
              : n === 1
                ? "1 zi liberă rămasă"
                : n + " zile libere rămase";
      }
      function ddBadge(c, P0) {
        if (!ddActive(c)) return "";
        const r = ddCalc(c, P0);
        if (!r.ok) return "";
        if (r.level === "rosu")
          return `<span class="pill red">D&D curge · ${lei0(r.totalLei)}</span>`;
        if (r.parts.some((p) => p.planned && p.cost > 0))
          return `<span class="pill orange">⚠ data planificată depășește free time · ${lei0(r.totalLei)}</span>`;
        if (r.level === "portocaliu")
          return `<span class="pill orange">⚠ ${ddLeftTxt(r.minLeft)}</span>`;
        if (r.level === "verde")
          return `<span class="pill green">${r.minLeft === Infinity ? "free time" : ddLeftTxt(r.minLeft)}</span>`;
        return r.totalLei > 0
          ? `<span class="pill gray">D&D închis · ${lei0(r.totalLei)}</span>`
          : '<span class="pill gray">returnat fără D&D</span>';
      }
      function ddDashboard() {
        const R = computeAll();
        const PR = { rosu: 0, portocaliu: 1, verde: 2 };
        const rows = DB.containers
          .map((c) => {
            const C = R.conts[c.id];
            const r = ddCalc(c, C && C.principal ? C.principal.o : null);
            return { c, r };
          })
          .filter((x) => ddActive(x.c) && x.r.ok && x.r.level !== "inchis")
          .sort(
            (a, b) =>
              PR[a.r.level] - PR[b.r.level] || a.r.minLeft - b.r.minLeft,
          );
        if (!rows.length) return "";
        return `<div class="doc"><div class="doc-h"><h2>Free time containere</h2><span class="cnt">${rows.length}</span><div class="tools"><button class="btn-link" onclick="go('containers')">Containere →</button></div></div><div class="lv-wrap"><table class="lv"><thead><tr><th>Container</th><th>Situație</th><th>Ultima zi liberă</th><th class="r">D&D estimat</th></tr></thead><tbody>${rows
          .map(({ c, r }) => {
            const lf = r.parts
              .filter(
                (p) =>
                  !p.pending && !p.closed && !p.future && p.lastFree != null,
              )
              .map((p) => p.lastFree);
            return `<tr onclick="openCont('${c.id}')"><td><span class="id-link" style="font-family:var(--mono)">${escH(contLabel(c))}</span><div class="sub">${escH(contSummary(c))}</div></td><td>${ddBadge(c, R.conts[c.id].principal ? R.conts[c.id].principal.o : null)}</td><td>${lf.length ? ro(dStr(Math.min(...lf))) : "—"}</td><td class="n">${lei0(r.totalLei)}</td></tr>`;
          })
          .join("")}</tbody></table></div></div>`;
      }
      function refreshDD() {
        const c = curCont();
        const b = document.getElementById("cDD");
        if (!c || !b) return;
        const d = ddOf(c);
        const opt = (v, l, cur) =>
          `<option value="${v}" ${String(cur) === String(v) ? "selected" : ""}>${l}</option>`;
        const tierTbl = (g, title) => {
          const T = d[g];
          let from = 1;
          return `<div style="font-size:12px;font-weight:700;margin:12px 0 6px">${title}</div><table class="grid-tbl" style="max-width:520px"><thead><tr><th style="width:110px">De la ziua</th><th style="width:130px" title="gol = în continuare, fără limită">Până în ziua</th><th style="text-align:right">Tarif / zi (${escH(d.moneda)})</th><th class="rm" style="width:40px"></th></tr></thead><tbody>${T.map(
            (t, i) => {
              const f = from;
              from = (+t.pana || 0) + 1;
              return `<tr><td class="ddFrom" data-g="${g}" data-i="${i}" style="padding:8px 10px;font-family:var(--mono)">${f}</td><td style="padding:0"><input type="number" step="1" min="0" value="${t.pana ?? ""}" placeholder="în continuare" oninput="ddTierSet('${g}',${i},'pana',this.value===''?'':this.valueAsNumber);ddFromUpdate()" style="font-family:var(--mono)"></td><td style="padding:0"><input type="number" step="any" min="0" value="${t.tarif || ""}" placeholder="0 = liber" oninput="ddTierSet('${g}',${i},'tarif',this.valueAsNumber)" style="text-align:right;font-family:var(--mono)"></td><td class="rm">${T.length > 1 ? `<button class="grid-rm" title="Șterge treapta" onclick="ddTierRm('${g}',${i})">${ICON.x}</button>` : ""}</td></tr>`;
            },
          ).join(
            "",
          )}</tbody></table><button class="grid-add" onclick="ddTierAdd('${g}')">${ICON.plus}Adaugă treaptă</button>`;
        };
        const others = DB.containers.filter((x) => x.id !== c.id && x.dd);
        b.innerHTML = `<div class="fgrid">
    <div class="f"><label>Mod taxare</label><select onchange="ddSet('mod',this.value);refreshDD()">${opt("combinat", "D&D combinat (o singură perioadă)", d.mod)}${opt("separat", "Demurrage + detention separate", d.mod)}</select></div>
    <div class="f"><label>Ziua descărcării se numără?</label><select onchange="ddSet('incl',this.value==='1')">${opt(1, "Da — descărcarea e ziua 1", d.incl ? 1 : 0)}${opt(0, "Nu — ziua 1 e ziua următoare", d.incl ? 1 : 0)}</select></div>
    <div class="f"><label>Moneda tarifului</label><select onchange="ddSet('moneda',this.value);refreshDD()">${["USD", "EUR", "LEI"].map((m) => opt(m, m, d.moneda)).join("")}</select></div>
    ${d.moneda !== "LEI" ? `<div class="f"><label>Curs ${escH(d.moneda)}/LEI</label><input type="number" step="any" class="inp-r" value="${d.curs || ""}" placeholder="gol = cursul comenzii" oninput="ddSet('curs',this.valueAsNumber)"></div>` : ""}
    <div class="f"><label>Data descărcării<span class="u">din „Date container”</span></label><input type="date" value="${escH(c.descarcare || "")}" disabled></div>
    <div class="f"><label>Ridicare din port</label><input type="date" value="${escH(d.ridicare || "")}" oninput="ddSet('ridicare',this.value)"></div>
    <div class="f"><label>Returnare container gol</label><input type="date" value="${escH(d.retur || "")}" oninput="ddSet('retur',this.value)"></div>
  </div>
  ${d.mod === "separat" ? tierTbl("tA", "Trepte demurrage (descărcare → ridicare din port)") + tierTbl("tB", "Trepte detention (ridicare → returnare gol)") : tierTbl("tA", "Trepte D&D combinat (descărcare → returnare gol)")}
  ${others.length ? `<div style="display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap"><span style="font-size:12px;font-weight:700">Copiază setările de la:</span><select id="ddCopySrc" style="padding:6px;border:1px solid var(--border-2);border-radius:8px">${others.map((x) => `<option value="${x.id}">${escH(contLabel(x))}</option>`).join("")}</select><button class="btn btn-default btn-sm" onclick="ddCopy()">Copiază</button></div>` : ""}
  ${noteBox("Introdu treptele <b>exact ca în tariful liniei maritime</b> pentru tipul acestui container (zilele cu tarif 0 sunt zilele libere). Perioadele neîncheiate se calculează <b>până azi</b>. Pune cursul BNR din data facturii pentru o comparație exactă. Estimarea intră în costul containerului la „Stocare / demurrage / staționare” până când adaugi plata reală în aceeași categorie.")}`;
        refreshDDCalc();
      }
      function ddSet(k, v) {
        const c = curCont();
        if (!c) return;
        const d = ddOf(c);
        if (k === "curs" && Number.isNaN(v)) v = 0;
        d[k] = v;
        save();
        refreshContCalc();
      }
      function ddTierSet(g, i, k, v) {
        const c = curCont();
        const t = ddOf(c)[g][i];
        if (!t) return;
        if (k === "tarif") v = Number.isNaN(v) ? 0 : Math.max(0, v);
        if (k === "pana" && v !== "")
          v = Number.isNaN(v) || v <= 0 ? "" : Math.round(v);
        t[k] = v;
        save();
        refreshContCalc();
      }
      function ddFromUpdate() {
        const c = curCont();
        if (!c || !c.dd) return;
        ["tA", "tB"].forEach((g) => {
          let from = 1;
          (c.dd[g] || []).forEach((t, i) => {
            const td = document.querySelector(
              `.ddFrom[data-g="${g}"][data-i="${i}"]`,
            );
            if (td) td.textContent = from;
            from = (+t.pana || 0) + 1;
          });
        });
      }
      function ddTierAdd(g) {
        const d = ddOf(curCont());
        d[g].push({ pana: "", tarif: 0 });
        save();
        refreshDD();
        refreshContCalc();
      }
      function ddTierRm(g, i) {
        const d = ddOf(curCont());
        if (d[g].length < 2) return;
        d[g].splice(i, 1);
        save();
        refreshDD();
        refreshContCalc();
      }
      function ddCopy() {
        const c = curCont();
        const s = contOf(document.getElementById("ddCopySrc").value);
        if (!s || !s.dd) return;
        const d = ddOf(c);
        const x = JSON.parse(JSON.stringify(s.dd));
        d.mod = x.mod;
        d.incl = x.incl;
        d.moneda = x.moneda;
        d.curs = x.curs;
        d.tA = x.tA;
        d.tB = x.tB;
        save();
        refreshDD();
        refreshContCalc();
        toast(
          "Tarife copiate — datele de ridicare/returnare au rămas ale acestui container",
        );
      }
      function refreshDDCalc() {
        const c = curCont();
        const b = document.getElementById("cDDCalc");
        if (!c || !b) return;
        const R = computeAll();
        const C = R.conts[c.id];
        const r = ddCalc(c, C && C.principal ? C.principal.o : null);
        if (!r.ok) {
          b.innerHTML = noteBox(
            "Completează <b>Data descărcare</b> în „Date container” ca să pornească numărătoarea.",
            "warn",
          );
          return;
        }
        const cur = (v) =>
          new Intl.NumberFormat("ro-RO", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          }).format(v) +
          " " +
          r.d.moneda;
        const w = [];
        let h = `<table class="grid-tbl" style="margin-top:14px"><thead><tr><th>Perioadă</th><th>De la → până la</th><th style="text-align:right">Zile</th><th style="text-align:right">Zile libere</th><th>Ultima zi liberă</th><th>Situație</th><th style="text-align:right">Cost</th></tr></thead><tbody>`;
        r.parts.forEach((p) => {
          if (p.pending) {
            h += `<tr><td style="padding:8px 10px;font-weight:600">${p.lbl}</td><td style="padding:8px 10px;color:var(--muted)" colspan="2">începe la ridicarea din port</td><td class="r" style="padding:8px 10px;font-family:var(--mono)">${p.free === Infinity ? "—" : p.free}</td><td>—</td><td><span class="pill gray">neînceput</span></td><td class="r" style="padding:8px 10px;font-family:var(--mono)">—</td></tr>`;
            return;
          }
          if (p.future) {
            h += `<tr><td style="padding:8px 10px;font-weight:600">${p.lbl}</td><td style="padding:8px 10px;color:var(--muted)" colspan="2">începe pe ${ro(p.startS)}</td><td class="r" style="padding:8px 10px;font-family:var(--mono)">${p.free === Infinity ? "—" : p.free}</td><td>—</td><td><span class="pill gray">neînceput</span></td><td class="r" style="padding:8px 10px;font-family:var(--mono)">—</td></tr>`;
            return;
          }
          if (p.bad)
            w.push(
              `${p.lbl}: data de ${p.endLbl} e înaintea datei de început.`,
            );
          if (p.noTariff)
            w.push(`${p.lbl}: nu ai introdus niciun tarif — costul va ieși 0.`);
          const st = p.planned
            ? `<span class="pill blue">planificat${p.cost > 0 ? " · cu cost" : " · în free time"}</span>`
            : p.closed
              ? p.cost > 0
                ? '<span class="pill gray">închis, cu cost</span>'
                : '<span class="pill green">închis în free time</span>'
              : p.cost > 0
                ? '<span class="pill red">se taxează</span>'
                : p.left <= 3
                  ? `<span class="pill orange">${ddLeftTxt(p.left)}</span>`
                  : `<span class="pill green">${ddLeftTxt(p.left)}</span>`;
          h += `<tr><td style="padding:8px 10px;font-weight:600">${p.lbl}</td><td style="padding:8px 10px">${ro(p.startS)} → ${p.closed ? ro(p.endS) : p.planned ? ro(p.endS) + ' <span style="color:var(--muted)">(planificat)</span>' : "<b>azi</b> (neîncheiat)"}</td><td class="r" style="padding:8px 10px;font-family:var(--mono)">${p.n}</td><td class="r" style="padding:8px 10px;font-family:var(--mono)">${p.free === Infinity ? "—" : p.free}</td><td style="padding:8px 10px">${p.lastFree != null ? ro(dStr(p.lastFree)) : "—"}</td><td style="padding:8px 10px">${st}</td><td class="r" style="padding:8px 10px;font-family:var(--mono);font-weight:700">${cur(p.cost)}</td></tr>`;
        });
        h += `</tbody><tfoot><tr><td colspan="6" style="padding:10px;font-weight:700">Total D&D estimat${r.d.moneda !== "LEI" ? ` <span style="font-weight:500;color:var(--muted);font-size:11.5px">curs ${r.rate ? r.rate.toFixed(4) : "—"} (${escH(r.rateSrc)})</span>` : ""}</td><td class="r" style="padding:10px;font-family:var(--mono);font-weight:800;color:var(--primary-d)">${r.d.moneda !== "LEI" ? cur(r.totalCur) + "<br>" : ""}${lei(r.totalLei)}</td></tr></tfoot></table>`;
        w.push(
          ...ddTierWarn(r.d.tA, r.d.mod === "separat" ? "Demurrage" : "D&D"),
        );
        if (r.d.mod === "separat") w.push(...ddTierWarn(r.d.tB, "Detention"));
        if (r.d.mod === "separat" && r.d.retur && !r.d.ridicare)
          w.push(
            "Ai data returnării, dar nu și data ridicării din port — detention nu se poate calcula, iar demurrage curge până azi.",
          );
        if (r.d.ridicare && r.d.retur && dNum(r.d.retur) < dNum(r.d.ridicare))
          w.push("Data returnării e înaintea datei ridicării.");
        if (r.d.moneda !== "LEI" && !r.rate)
          w.push(
            "Lipsește cursul de schimb — introdu cursul sau completează cursul în comanda principală.",
          );
        const paid = Object.values(R.pay || {})
          .filter(
            (x) =>
              x.ok && x.p && x.p.contId === c.id && x.p.tip === "portExtra",
          )
          .reduce((a, x) => a + (+x.lei || 0), 0);
        if (paid) {
          const dif = paid - r.totalLei;
          h += `<table class="grid-tbl" style="margin-top:10px"><tbody><tr><td style="padding:8px 10px">Plătit pe acest container (categoria „Stocare / demurrage / staționare”, fără comisioane bancare)</td><td class="r" style="padding:8px 10px;font-family:var(--mono);font-weight:700">${lei(paid)}</td></tr><tr><td style="padding:8px 10px">Diferență plătit − estimat <span style="color:var(--muted);font-size:11.5px">(adaos expeditor, stocare terminal, curs sau trepte diferite)</span></td><td class="r" style="padding:8px 10px;font-family:var(--mono);font-weight:700;color:${Math.abs(dif) < 1 ? "var(--green)" : "#B4651A"}">${dif > 0 ? "+" : ""}${lei(dif)}</td></tr></tbody></table>`;
        }
        h += warnList(w);
        b.innerHTML = h;
      }

      /* ===== MRN — 18 caractere: an (2 cifre) + țară (2 litere) + 13 caractere (ultimul = indicatorul de procedură) + cifra de control ISO 6346 pe primele 17 ===== */
      function mrnCheck(raw, ind) {
        const s = (raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
        if (!s) return { st: "empty", s };
        if (s.length !== 18)
          return { st: "bad", s, err: "lungime " + s.length + " (trebuie 18)" };
        if (!/^[0-9]{2}[A-Z]{2}[A-Z0-9]{14}$/.test(s))
          return {
            st: "bad",
            s,
            err: "format: 2 cifre (an) + 2 litere (țară) + 14 caractere",
          };
        let sum = 0;
        for (let i = 0; i < 17; i++) {
          const ch = s[i];
          sum += (/[0-9]/.test(ch) ? +ch : ISO_V[ch]) * Math.pow(2, i);
        }
        const cd = (sum % 11) % 10;
        if (String(cd) !== s[17])
          return {
            st: "bad",
            s,
            err:
              "cifra de control e " +
              s[17] +
              ", corect " +
              cd +
              " — verifică O/0, I/1, S/5",
          };
        const p = s[16];
        let warn = "";
        if (/[0-9]/.test(p))
          warn =
            "format vechi (dinainte de CVU) — indicatorul de procedură nu se verifică";
        else if (ind && !ind.includes(p))
          warn = `indicatorul „${p}” — pentru această declarație se așteaptă ${ind.split("").join("/")}`;
        return { st: warn ? "warn" : "ok", s, warn };
      }
      function mrnBadge(nr, ind) {
        const r = mrnCheck(nr, ind);
        return r.st === "ok"
          ? '<span style="color:var(--green);font-size:10.5px;font-weight:700">✓ MRN valid</span>'
          : r.st === "warn"
            ? `<span style="color:#B4651A;font-size:10.5px;font-weight:700">⚠ ${escH(r.warn)}</span>`
            : r.st === "bad"
              ? `<span style="color:var(--red);font-size:10.5px;font-weight:700">✗ ${escH(r.err)}</span>`
              : "";
      }

      /* ===== MIGRARE v19 → v20: istoric MRN pe container, Info TIR pe operațiuni ===== */
      function migrateV20() {
        (DB.containers || []).forEach((c) => {
          if (!c.ops) c.ops = [];
        });
        (DB.dvi || []).forEach((d) => {
          if (!d.infoTir) d.infoTir = {};
          if (d.cotaInfo == null) d.cotaInfo = 21;
        });
        if (DB.v >= 20) return;
        try {
          localStorage.setItem(LS + "_backup_v19", JSON.stringify(DB));
        } catch (e) {}
        (DB.containers || []).forEach((c) => {
          if (c.dataIntrare || c.docPlasare)
            c.ops.push({
              id: uid("O"),
              tip: "plasare",
              data: c.dataIntrare || "",
              mrn: (c.docPlasare || "").toUpperCase(),
              prev: "",
              acop: "tot",
              items: [],
              infoTir: 0,
              cotaTVA: 21,
              docPlata: "",
              costConf: 0,
              nota: "Migrat din câmpurile „Intrare în antrepozit” / „Declarație plasare”",
              anulat: false,
              motiv: "",
              piese: [],
            });
          delete c.dataIntrare;
          delete c.docPlasare;
        });
        DB.v = 20;
        save();
      }

      /* ===== ISTORIC MRN / OPERAȚIUNI VAMALE (fișa containerului) ===== */
      function newOp(tip) {
        return {
          id: uid("O"),
          tip,
          data: today(),
          mrn: "",
          prev: "",
          acop: tip === "perfectionare" ? "partial" : "tot",
          items: [],
          infoTir: 0,
          cotaTVA: 21,
          docPlata: "",
          costConf: 0,
          nota: "",
          anulat: false,
          motiv: "",
          piese: [],
        };
      }
      function addOp() {
        const c = curCont();
        if (!c.ops) c.ops = [];
        const has = (t) => c.ops.some((o) => o.tip === t && !o.anulat);
        const tip = has("plasare")
          ? "perfectionare"
          : has("tranzit")
            ? "plasare"
            : "tranzit";
        const op = newOp(tip);
        const last = [...c.ops].reverse().find((o) => !o.anulat);
        if (last) op.prev = "op:" + last.id;
        c.ops.push(op);
        save();
        refreshOps();
        refreshContCalc();
      }
      function opPoolUsed(c, op) {
        return (DB.dvi || []).some((d) =>
          (d.art || []).some((a) =>

        const E = [
          ...c.ops.map((op, i) => ({ k: "op", op, i, data: op.data || "" })),

        const cell = (lbl, inner, cls = "") =>

          `<option value="">—</option>${c.ops
            .filter((o) => o !== op)
            .map(

            )
            .join(
              "",
            )}${dvis.map((d) => `<option value="dvi:${d.id}" ${op.prev === "dvi:" + d.id ? "selected" : ""}>DVI ${escH(d.nr || "(fără MRN)")}</option>`).join("")}`;
        b.innerHTML =
          E.map((e, n) => {
            if (e.k === "dvi") {
              const d = e.d;
              const its = (d.art || [])
                .map((a) => {
                  const q = (a.src || [])
                    .filter((s) => s.contId === c.id)
                    .reduce((x, s) => x + (+s.buc || 0), 0);
                  if (!q) return "";
                  const m = modelOf(ordOf(a.orderId), a.modelId);
                  return `${escH(m ? m.model : "?")} × ${q}${a.pool ? ' <span class="pill purple">din perfecționare</span>' : ""}`;
                })
                .filter(Boolean)
                .join(", ");
              const g = +(d.infoTir || {})[c.id] || 0;
              return `<div class="pl-item op-dvi"><div style="display:flex;gap:12px;align-items:flex-start;padding:10px 12px;flex-wrap:wrap"><span class="pl-n" style="width:22px">${n + 1}</span>
        <div style="flex:1;min-width:220px"><div style="font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">${d.data ? ro(d.data) : "fără dată"} · Punere în liberă circulație (DVI)</div>
        <div style="font-family:var(--mono);font-weight:700;margin-top:2px">${escH(d.nr || "(fără MRN)")} ${mrnBadge(d.nr, IND_DVI)}</div><div style="font-size:12px;margin-top:4px">${its}</div></div>
        <div style="text-align:right;font-size:12px">Info TIR: <b style="font-family:var(--mono)">${g ? lei(g) : "—"}</b>${g ? `<div style="color:var(--muted)">net ${lei(netTVA(g, d.cotaInfo))}</div>` : ""}<div><span class="id-link" style="cursor:pointer" onclick="openDvi('${d.id}')">Deschide DVI →</span></div></div></div></div>`;
            }
            const op = e.op,
              i = e.i;
            const dis = op.anulat ? "disabled" : "";
            const perf = op.tip === "perfectionare";
            const partial = perf || op.acop === "partial";
            const items = partial
              ? `<div style="padding:8px 12px;border-top:1px solid var(--border)"><div style="font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px">${perf ? "Bucăți trecute în perfecționare activă" : "Marfa acoperită de declarație"}</div>
      ${
        (op.items || [])
          .map(
            (
              it,
              j,
            ) => `<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><select ${dis} onchange="itemSet(${i},${j},'lineId',this.value)" style="flex:1;min-width:0;border:1px solid var(--border-2);border-radius:6px;padding:5px 6px;font-weight:600">${c.lines.map((l) => `<option value="${l.id}" ${l.id === it.lineId ? "selected" : ""}>${escH(lineLbl(l))}</option>`).join("")}</select>
        <input type="number" step="1" min="0" ${dis} value="${it.buc || ""}" placeholder="buc" oninput="itemSet(${i},${j},'buc',this.valueAsNumber)" style="width:80px;border:1px solid var(--border-2);border-radius:6px;padding:5px 6px;text-align:right;font-family:var(--mono)">
        ${op.anulat ? "" : `<button class="grid-rm" title="Scoate" onclick="itemRm(${i},${j})">${ICON.x}</button>`}</div>`,
          )
          .join("") ||
        '<div style="font-size:12px;color:var(--red);margin-bottom:6px">Alege bucățile — altfel costul operațiunii nu se alocă.</div>'
      }
      ${op.anulat ? "" : `<button class="grid-add" style="margin:0" onclick="itemAdd(${i})">${ICON.plus}bucăți</button>`}</div>`
              : "";
            const piese = perf
              ? `<div style="padding:8px 12px;border-top:1px solid var(--border)"><div style="font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px">Piese înlocuite — returnare la producător <span style="text-transform:none;font-weight:500">· evidență, fără efect pe stoc sau cost</span></div>
      <div style="overflow-x:auto"><table class="grid-tbl" style="min-width:680px"><thead><tr><th>Piesă</th><th style="text-align:right;width:70px">Cant.</th><th style="width:200px">MRN export</th><th style="width:130px">Data export</th><th style="width:120px">Stare</th><th>Notă</th><th class="rm"></th></tr></thead><tbody>
      ${
        (op.piese || [])
          .map((p, j) => {
            const pd = op.anulat || p.anulat ? "disabled" : "";
            const st = pieceState(p);
            return `<tr style="${p.anulat ? "opacity:.55" : ""}"><td style="padding:0"><input ${pd} value="${escH(p.denumire)}" placeholder="ex. Controller 48V" oninput="pieceSet(${i},${j},'denumire',this.value)"></td><td style="padding:0"><input ${pd} type="number" step="1" value="${p.cant || ""}" oninput="pieceSet(${i},${j},'cant',this.valueAsNumber)" style="text-align:right;font-family:var(--mono)"></td>
        <td style="padding:0"><input ${pd} value="${escH(p.mrnExport)}" placeholder="când primești declarația" oninput="pieceSet(${i},${j},'mrnExport',this.value.toUpperCase())" style="font-family:var(--mono);text-transform:uppercase"><div id="pmx_${i}_${j}" style="padding:0 10px 5px">${mrnBadge(p.mrnExport, IND_EXPORT)}</div></td>
        <td style="padding:0"><input ${pd} type="date" value="${p.dataExport || ""}" oninput="pieceSet(${i},${j},'dataExport',this.value)"></td><td style="padding:8px 10px">${st}</td>
        <td style="padding:0"><input ${pd} value="${escH(p.anulat ? "Anulat: " + (p.motiv || "") : p.nota)}" oninput="pieceSet(${i},${j},'nota',this.value)"></td><td class="rm">${pd ? "" : `<button class="grid-rm" title="Anulează (rămâne în istoric)" onclick="pieceAnul(${i},${j})">${ICON.x}</button>`}</td></tr>`;
          })
          .join("") ||
        '<tr><td colspan="7" style="padding:10px;text-align:center;color:var(--muted-2)">Nicio piesă înregistrată.</td></tr>'
      }</tbody></table></div>
      ${op.anulat ? "" : `<button class="grid-add" style="margin:6px 0 0" onclick="pieceAdd(${i})">${ICON.plus}piesă înlocuită</button>`}</div>`
              : "";
            return `<div class="pl-item ${op.anulat ? "op-anul" : ""}" id="op_${i}">
      ${op.anulat ? `<div style="background:var(--red-soft);color:#A12C2C;font-size:12px;font-weight:600;padding:6px 12px">Anulată${op.dataAnulare ? " la " + ro(op.dataAnulare) : ""} — motiv: ${escH(op.motiv || "")}. Rămâne în istoric, fără efect pe cost sau stoc.</div>` : ""}
      <div class="pl-line pl-l1"><div class="pl-c pl-n">${n + 1}</div>
        ${cell("Data", `<input ${dis} type="date" value="${op.data || ""}" oninput="opSet(${i},'data',this.value)">`)}
        ${cell(
          "Declarație",
          `<select ${dis} onchange="opSet(${i},'tip',this.value)">${Object.entries(
            OP_TIP,
          )
            .map(
              ([k, v]) =>
                `<option value="${k}" ${op.tip === k ? "selected" : ""}>${v.lbl}</option>`,
            )
            .join("")}</select>`,
        )}
        ${cell('MRN <span id="opm_' + i + '">' + mrnBadge(op.mrn, (OP_TIP[op.tip] || {}).ind) + "</span>", `<input ${dis} value="${escH(op.mrn)}" placeholder="18 caractere" style="font-family:var(--mono);text-transform:uppercase" oninput="opSet(${i},'mrn',this.value.toUpperCase())">`, "pl-span2")}
        ${cell("Provine din", `<select ${dis} onchange="opSet(${i},'prev',this.value)">${prevOpts(op)}</select>`)}
        <div class="pl-c pl-n">${op.anulat ? "" : `<button class="grid-rm" title="Anulează (rămâne în istoric)" onclick="opAnul(${i})">${ICON.x}</button>`}</div></div>
      <div class="pl-line pl-l2"><div class="pl-c pl-n"></div>
        ${cell("Info TIR cu TVA", `<input ${dis} class="num" type="number" step="any" value="${op.infoTir || ""}" placeholder="ex. 840" oninput="opSet(${i},'infoTir',this.valueAsNumber)">`)}
        ${cell("Cotă TVA %", `<input ${dis} class="num" type="number" step="any" value="${op.cotaTVA ?? 21}" oninput="opSet(${i},'cotaTVA',this.valueAsNumber)">`)}
        ${
          perf
            ? cell(
                "Cost conformare (fără TVA)",
                `<input ${dis} class="num" type="number" step="any" value="${op.costConf || ""}" placeholder="opțional" oninput="opSet(${i},'costConf',this.valueAsNumber)">`,
              )
            : cell(
                "Marfă acoperită",
                `<select ${dis} onchange="opSet(${i},'acop',this.value)"><option value="tot" ${op.acop !== "partial" ? "selected" : ""}>Tot containerul</option><option value="partial" ${op.acop === "partial" ? "selected" : ""}>Doar o parte</option></select>`,
              )
        }
        ${cell("Document plată", `<input ${dis} value="${escH(op.docPlata)}" placeholder="factură / OP" oninput="opSet(${i},'docPlata',this.value)">`)}
        <div class="pl-c pl-res"><label style="text-align:right">Cost net operațiune</label><span id="opn_${i}">—</span><div id="opt_${i}" style="font-size:11px;color:var(--muted);font-weight:500"></div></div><div class="pl-c pl-n"></div></div>
      ${items}${piese}
      <div style="padding:6px 12px 10px;border-top:1px solid var(--border)"><input ${dis} value="${escH(op.nota)}" placeholder="Notă" oninput="opSet(${i},'nota',this.value)" style="width:100%;border:0;background:transparent;font-size:12.5px"></div>
    </div>`;
          }).join("") ||
          `<div style="padding:16px;text-align:center;color:var(--muted-2);font-weight:500;border:1px dashed var(--border-2);border-radius:8px">Nicio declarație încă. Adaugă tranzitul T1, plasarea în antrepozit etc. DVI-urile de punere în liberă circulație apar aici automat.</div>`;
        refreshOpsCalc();
      }
      function refreshOpsCalc() {
        const c = curCont();
        if (!c) return;
        (c.ops || []).forEach((op, i) => {
          const g = +op.infoTir || 0;
          const net = netTVA(g, op.cotaTVA);
          const cost =
            net + (op.tip === "perfectionare" ? +op.costConf || 0 : 0);
          const e = document.getElementById("opn_" + i),
            t = document.getElementById("opt_" + i);
          if (e) e.textContent = cost ? lei(cost) : "—";
          if (t)
            t.textContent = g
              ? `Info TIR net ${lei(net)} · TVA ${lei(g - net)}`
              : "";
        });
      }
      function opSet(i, k, v) {
        const c = curCont();
        const op = c.ops[i];
        if (!op || op.anulat) return;
        if (["infoTir", "costConf"].includes(k) && Number.isNaN(v)) v = 0;
        if (k === "cotaTVA" && Number.isNaN(v)) v = 21;
        if (
          k === "tip" &&
          op.tip === "perfectionare" &&
          v !== "perfectionare" &&
          opPoolUsed(c, op)
        ) {
          toast(
            "Din această perfecționare s-au scos deja bucăți prin DVI — nu se poate schimba tipul",
          );
          return refreshOps();
        }
        op[k] = v;
        if (k === "tip" && v === "perfectionare") op.acop = "partial";
        save();
        if (k === "mrn") {
          const e = document.getElementById("opm_" + i);
          if (e) e.innerHTML = mrnBadge(v, (OP_TIP[op.tip] || {}).ind);
        }
        if (["tip", "acop"].includes(k)) refreshOps();
        else if (k === "data") null;
        else refreshOpsCalc();
        if (!["mrn", "nota", "docPlata", "prev"].includes(k)) refreshContCalc();
      }
      function itemAdd(i) {
        const c = curCont();
        const op = c.ops[i];
        const l = c.lines[0];
        if (!l) return toast("Containerul nu are conținut");
        (op.items = op.items || []).push({ lineId: l.id, buc: 0 });
        save();
        refreshOps();
      }
      function itemSet(i, j, k, v) {
        const c = curCont();
        const op = c.ops[i];
        const it = op.items[j];
        if (k === "buc") v = Number.isNaN(v) ? 0 : Math.max(0, v);
        if (
          op.tip === "perfectionare" &&
          opPoolUsed(c, op) &&
          (k === "lineId" || v < it.buc)
        ) {
          toast(
            "Bucăți din această perfecționare au fost deja scoase prin DVI — modifică întâi DVI-ul",
          );
          return refreshOps();
        }
        it[k] = v;
        save();
        if (k === "lineId") refreshOps();
        refreshContCalc();
      }
      function itemRm(i, j) {
        const c = curCont();
        const op = c.ops[i];
        if (op.tip === "perfectionare" && opPoolUsed(c, op))
          return toast(
            "Bucăți din această perfecționare au fost deja scoase prin DVI — modifică întâi DVI-ul",
          );
        op.items.splice(j, 1);
        save();
        refreshOps();
        refreshContCalc();
      }
      function askReason(title, cb) {
        window._reasonCb = cb;
        openModal(
          title,
          `<p class="sub" style="margin-bottom:8px">Înregistrarea nu se șterge: rămâne în istoric, marcată anulată, cu motivul de mai jos.</p><textarea id="reasonTxt" style="width:100%;min-height:80px;padding:10px;border:1px solid var(--border-2);border-radius:8px" placeholder="Motivul anulării (obligatoriu)"></textarea>`,
          `<button class="btn btn-default" onclick="closeModal()">Renunță</button><button class="btn btn-primary" style="background:var(--red)" onclick="const r=document.getElementById('reasonTxt').value.trim();if(!r)return toast('Scrie motivul');closeModal();window._reasonCb(r)">Anulează</button>`,
        );

      function opAnul(i) {
        const c = curCont();

          return toast(
            "Din această perfecționare s-au scos bucăți prin DVI — anulează întâi DVI-ul",
          );

          op.anulat = true;
          op.motiv = r;
          op.dataAnulare = today();
          save();
          refreshOps();
          refreshContCalc();
          toast("Declarație anulată — rămâne în istoric");
        });
      }
      function pieceExported(p) {

      function linePools(c, l) {

      /* ===== IMPORT SERII DIN EXCEL / CSV ===== */
      function _norm(s) {
        return (s == null ? "" : "" + s)
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .trim();
      }
      function _colIdx(ref) {
        const m = (ref || "").match(/^([A-Z]+)/);
        if (!m) return 0;
        let n = 0;
        for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
        return n - 1;
      }
      async function xlsxToRows(arrayBuffer) {
        const u8 = new Uint8Array(arrayBuffer);
        const dv = new DataView(u8.buffer);
        let eocd = -1;
        for (
          let i = u8.length - 22;
          i >= 0 && i > u8.length - 22 - 65536;
          i--
        ) {
          if (dv.getUint32(i, true) === 0x06054b50) {
            eocd = i;
            break;
          }
        }
        if (eocd < 0) throw new Error("ZIP invalid");
        const cdCount = dv.getUint16(eocd + 10, true);
        let p = dv.getUint32(eocd + 16, true);
        const files = {};
        for (let n = 0; n < cdCount; n++) {
          if (dv.getUint32(p, true) !== 0x02014b50) break;
          const method = dv.getUint16(p + 10, true),
            compSize = dv.getUint32(p + 20, true);
          const nameLen = dv.getUint16(p + 28, true),
            extraLen = dv.getUint16(p + 30, true),
            commentLen = dv.getUint16(p + 32, true);
          const localOff = dv.getUint32(p + 42, true);
          const name = new TextDecoder().decode(
            u8.subarray(p + 46, p + 46 + nameLen),
          );
          files[name] = { method, compSize, localOff };
          p += 46 + nameLen + extraLen + commentLen;
        }
        async function extract(name) {
          const f = files[name];
          if (!f) return null;
          const lh = f.localOff;
          const nameLen = dv.getUint16(lh + 26, true),
            extraLen = dv.getUint16(lh + 28, true);
          const start = lh + 30 + nameLen + extraLen;
          const comp = u8.subarray(start, start + f.compSize);
          if (f.method === 0) return new TextDecoder().decode(comp);
          const ds = new DecompressionStream("deflate-raw");
          const w = ds.writable.getWriter();
          w.write(comp);
          w.close();
          const ab = await new Response(ds.readable).arrayBuffer();
          return new TextDecoder().decode(new Uint8Array(ab));
        }
        let shared = [];
        const ssXml = await extract("xl/sharedStrings.xml");
        if (ssXml) {
          const doc = new DOMParser().parseFromString(ssXml, "application/xml");
          shared = [...doc.getElementsByTagName("si")].map((si) =>
            [...si.getElementsByTagName("t")]
              .map((t) => t.textContent)
              .join(""),
          );
        }
        // gasesc prima foaie
        let sheetName = "xl/worksheets/sheet1.xml";
        if (!files[sheetName]) {
          const k = Object.keys(files).find((f) =>
            /xl\/worksheets\/.*\.xml$/.test(f),
          );
          if (k) sheetName = k;
        }
        const shXml = await extract(sheetName);
        if (!shXml) throw new Error("Fără foaie de calcul");
        const doc = new DOMParser().parseFromString(shXml, "application/xml");
        const rows = [];
        for (const row of doc.getElementsByTagName("row")) {
          const cells = [];
          for (const c of row.getElementsByTagName("c")) {
            const col = _colIdx(c.getAttribute("r"));
            const t = c.getAttribute("t");
            const vEl = c.getElementsByTagName("v")[0];
            let val = "";
            if (t === "s" && vEl) val = shared[+vEl.textContent] || "";
            else if (t === "inlineStr" || t === "str") {
              const tEl = c.getElementsByTagName("t")[0];
              val = tEl ? tEl.textContent : vEl ? vEl.textContent : "";
            } else if (vEl) val = vEl.textContent;
            cells[col] = val;
          }
          rows.push(cells);
        }
        return rows;
      }
      function parseCSV(text) {
        const rows = [];
        const sep =
          (text.split("\n")[0].match(/;/g) || []).length >
          (text.split("\n")[0].match(/,/g) || []).length
            ? ";"
            : ",";
        text.split(/\r?\n/).forEach((line) => {
          if (!line.trim()) return;
          const cells = [];
          let cur = "",
            q = false;
          for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (q) {
              if (ch === '"') {
                if (line[i + 1] === '"') {
                  cur += '"';
                  i++;
                } else q = false;
              } else cur += ch;
            } else {
              if (ch === '"') q = true;
              else if (ch === sep) {
                cells.push(cur);
                cur = "";
              } else cur += ch;
            }
          }
          cells.push(cur);
          rows.push(cells);
        });
        return rows;
      }
      function importSeriiFromRows(rows) {
        const clean = rows.filter(
          (r) => r && r.some((x) => x != null && ("" + x).trim()),
        );
        if (clean.length < 1) return toast("Fișier gol");
        const header = clean[0].map(_norm);
        const find = (...keys) =>
          header.findIndex((h) => keys.some((k) => h.includes(k)));
        const iModel = find("model"),
          iSasiu = find("sasiu", "chassis", "vin", "caroserie"),
          iMotor = find("motor", "engine"),
          iCuloare = find("culoare", "color", "culo");
        const hasHeader =
          iModel >= 0 || iSasiu >= 0 || iMotor >= 0 || iCuloare >= 0;
        const o = cur();
        let added = 0;
        const start = hasHeader ? 1 : 0;
        const g = (row, idx, fallback) => {
          const v =
            (idx >= 0 ? row[idx] : fallback != null ? row[fallback] : "") || "";
          return ("" + v).trim();
        };
        for (let r = start; r < clean.length; r++) {
          const row = clean[r];
          o.serii.push({
            model: g(row, iModel, 0),
            sasiu: g(row, iSasiu, 1),
            motor: g(row, iMotor, 2),
            culoare: g(row, iCuloare, 3),
          });
          added++;
        }
        save();
        refreshSerii();
        toast(
          added +
            " serii importate din " +
            (hasHeader ? "fișier" : "fișier (fără antet)"),
        );
      }
      function importSerii(files) {
        if (!files.length) return;
        const f = files[0];
        const nm = f.name.toLowerCase();
        const o = cur();
        const doImport = (fn) => {
          if (o.serii.length && o.serii.some((s) => s.sasiu || s.motor)) {
            if (
              !confirm(
                "Adaug seriile importate la cele existente?\n(OK = adaugă, Anulează = renunță)",
              )

        if (nm.endsWith(".csv")) {
          const r = new FileReader();
          r.onload = (e) => {

            } catch (err) {

      }

        curOffer().ctc.push({ criteriu: "", rezultat: "—", obs: "" });

        refreshCtc();

      /* scorecard ponderat */
      function refreshEval() {
        const o = curOffer();
        const body = document.getElementById("evalRows");
        if (!body) return;
        body.innerHTML = o.evaluare
          .map(
            (c, i) =>
              `<tr><td><input value="${(c.criteriu || "").replace(/"/g, "&quot;")}" oninput="evalF(${i},'criteriu',this.value)"></td><td style="padding:0"><input type="number" value="${c.pondere || ""}" oninput="evalF(${i},'pondere',+this.value)" style="width:100%;border:none;background:transparent;padding:8px 10px;text-align:right;font-family:var(--mono)"></td><td style="padding:0"><select onchange="evalF(${i},'nota',+this.value)" style="width:100%;border:none;background:transparent;padding:8px;text-align:right;font-weight:600">${[0, 1, 2, 3, 4, 5].map((n) => `<option value="${n}" ${(+c.nota || 0) === n ? "selected" : ""}>${n || "—"}</option>`).join("")}</select></td><td class="calc" style="padding:8px 10px;text-align:right;font-family:var(--mono);font-weight:600;color:var(--muted)">${((+c.nota || 0) * (+c.pondere || 0)).toFixed(0)}</td><td class="rm"><button class="grid-rm" onclick="rmEval(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></td></tr>`,

        const o = curOffer();
        const wsum = o.evaluare.reduce((s, c) => s + (+c.pondere || 0), 0);
        const we = document.getElementById("wsum");
        if (we)
          we.innerHTML = `Total pondere: <span class="${wsum !== 100 ? "wsum-warn" : ""}" style="font-family:var(--mono)">${wsum}%</span>${wsum !== 100 ? " (recomandat 100%)" : ""}`;
        const sc = computeScore(o);
        const sb = document.getElementById("scoreBig");
        if (sb)
          sb.innerHTML = `<div><span class="sb-num">${sc.toFixed(1)}</span><span class="sb-of"> / 5</span></div>${starsHTML(Math.round(sc), false)}<div style="margin-left:auto;text-align:right"><div style="font-weight:800;font-size:14px;color:var(--primary-d)">${sc >= 4 ? "Recomandat" : sc >= 3 ? "Acceptabil" : sc > 0 ? "Sub prag" : "Neevaluat"}</div><div class="sub">${Math.round((sc / 5) * 100)}% din maxim</div></div>`;

        curOffer().evaluare[i][k] = v;
        save();

        if (k === "nota") refreshEval();
        else refreshEvalSummary();
      }
      function addEval() {
        curOffer().evaluare.push({ criteriu: "", pondere: 0, nota: 0 });
        save();
        refreshEval();
      }
      function rmEval(i) {
        curOffer().evaluare.splice(i, 1);
        save();
        refreshEval();
      }

      function eecF(i, k, v) {
        curOffer().conformEEC[i][k] = v;
        save();
        if (k === "rezultat") refreshEEC();
      }
      function eecDocToggle(k) {
        const o = curOffer();
        o.eecDocs[k] = !o.eecDocs[k];
        save();
        refreshEEC();
      }
      function eecDocUpload(k, files) {
        if (!files.length) return;
        compressFile(files[0], async (data, name, type) => {
          const rec = await fileAdd(data, name, type);
          if (rec) {
            const o = curOffer();
            if (o.eecDocsFiles[k]) await fileDel(o.eecDocsFiles[k]);
            o.eecDocsFiles[k] = rec;
            save();
            refreshEEC();
            toast("Fișier încărcat");
          }
        });
      }
      function eecDocRemove(k) {
        const o = curOffer();
        fileDel(o.eecDocsFiles[k]);
        o.eecDocsFiles[k] = null;
        save();
        refreshEEC();
      }
      /* poze per criteriu */
      function openEecPhotos(i) {
        window._eecIdx = i;
        const c = curOffer().conformEEC[i];
        openModal(
          "Poze dovadă · " + c.parte,
          `<p class="sub" style="margin-bottom:12px">${c.criteriu}</p><input type="file" id="eecPhotoInput" accept="image/*" multiple style="display:none" onchange="addEecPhotos(this.files);this.value=''"><div class="gallery" id="eecGallery"></div>`,
          `<button class="btn btn-primary" onclick="closeModal();refreshEEC()">Gata</button>`,
        );
        refreshEecGallery();
      }
      function refreshEecGallery() {
        const g = document.getElementById("eecGallery");
        if (!g) return;
        const c = curOffer().conformEEC[window._eecIdx];
        g.innerHTML =
          (c.poze || [])
            .map(
              (p, i) =>
                `<div class="gphoto" onclick="eecLightbox(${i})"><img ${imgSrc(p)} alt=""><button class="gdel" onclick="event.stopPropagation();rmEecPhoto(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>`,
            )
            .join("") +
          `<div class="gadd" onclick="document.getElementById('eecPhotoInput').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Adaugă poze</div>`;
        loadImages();
      }
      function addEecPhotos(files) {
        if (!files.length) return;
        const c = curOffer().conformEEC[window._eecIdx];
        let pending = files.length;
        Array.from(files).forEach((f) =>
          compressImg(f, async (data) => {
            const rec = await fileAdd(data, f.name, "image/jpeg");
            if (rec) c.poze.push(rec);
            if (--pending === 0) {
              save();
              refreshEecGallery();
            }
          }),
        );
      }
      function rmEecPhoto(i) {
        const c = curOffer().conformEEC[window._eecIdx];
        fileDel(c.poze[i]);
        c.poze.splice(i, 1);
        save();
        refreshEecGallery();
      }
      function eecLightbox(i) {
        const p = curOffer().conformEEC[window._eecIdx].poze[i];
        if (p.id) openFile(p.id, "image");
        else if (p.data) {
          document.getElementById("lightboxImg").src = p.data;
          document.getElementById("lightbox").classList.add("open");
        }
      }

      /* ===== COMPARAȚIE MULTI-FURNIZOR ===== */
      function vCompare() {
        crumb([
          { t: "Oferte producător", go: "go('offers')" },
          { t: "Comparație" },
        ]);
        const cats = [
          ...new Set(DB.offers.map((o) => o.categorie).filter(Boolean)),
        ];
        let list = DB.offers.filter(
          (o) => !state.compareCat || o.categorie === state.compareCat,
        );
        let h = `<div class="page-h"><h1>Comparație oferte</h1><div class="sp"><select class="lfilter" onchange="state.compareCat=this.value;vCompare()"><option value="">Toate categoriile</option>${cats.map((c) => `<option ${state.compareCat === c ? "selected" : ""}>${c}</option>`).join("")}</select><button class="btn btn-default" onclick="go('offers')">Înapoi</button></div></div>`;
        if (list.length < 1) {
          h += `<div class="empty" style="padding:60px"><p>Nicio ofertă de comparat</p></div>`;
          document.getElementById("wrap").innerHTML = h;
          return;
        }
        // rânduri de comparație; best evidențiat
        const rows = [];
        const bp = (o) => {
          const b = bestPrice(o);
          return b ? b.pret : null;
        };
        rows.push({
          lbl: "Preț de la",
          get: (o) => {
            const b = bestPrice(o);
            return b ? val(b.pret, b.valuta) : "—";
          },
          best: "min",
          raw: (o) => bp(o),
        });
        rows.push({
          lbl: "MOQ",
          get: (o) => o.moq || "—",
          best: "min",
          raw: (o) => +o.moq || null,
        });
        rows.push({
          lbl: "Timp producție",
          get: (o) => (o.timpProductieZile || "—") + " zile",
          best: "min",
          raw: (o) => +o.timpProductieZile || null,
        });
        rows.push({
          lbl: "Timp livrare",
          get: (o) => (o.timpLivrareZile || "—") + " zile",
          best: "min",
          raw: (o) => +o.timpLivrareZile || null,
        });
        rows.push({
          lbl: "Timp total",
          get: (o) =>
            (+o.timpProductieZile || 0) + (+o.timpLivrareZile || 0) + " zile",
          best: "min",
          raw: (o) =>
            (+o.timpProductieZile || 0) + (+o.timpLivrareZile || 0) || null,
        });
        rows.push({
          lbl: "Conformități",
          get: (o) =>
            o.conformitati.filter((c) => c.status !== "lipsa").length +
            "/" +
            o.conformitati.length,
          best: "max",
          raw: (o) => o.conformitati.filter((c) => c.status !== "lipsa").length,
        });
        rows.push({
          lbl: "CTC trecute",
          get: (o) =>
            o.ctc.filter((c) => c.rezultat === "OK").length +
            "/" +
            o.ctc.length,
          best: "max",
          raw: (o) => o.ctc.filter((c) => c.rezultat === "OK").length,
        });
        rows.push({
          lbl: "Conformitate EEC",
          get: (o) => {
            const s = eecStats(o);
            return (
              s.conf + "/" + s.tot + (s.neconf ? ` (${s.neconf} nec.)` : "")
            );
          },
          best: "max",
          raw: (o) => eecStats(o).conf,
        });
        rows.push({
          lbl: "Poze",
          get: (o) => o.poze.length,
          best: "max",
          raw: (o) => o.poze.length,
        });
        rows.push({
          lbl: "Mostră",
          get: (o) => MOSTRA_LBL[o.mostraStatus] || "—",
          best: null,
        });
        EVAL_CRITERIA.forEach((c, ci) =>
          rows.push({
            lbl: c.criteriu,
            get: (o) => {
              const e = o.evaluare?.[ci];
              return e && e.nota ? e.nota + "/5" : "—";
            },
            best: "max",
            raw: (o) => o.evaluare?.[ci]?.nota || null,
            eval: true,
          }),
        );
        rows.push({
          lbl: "SCOR COMPOZIT",
          get: (o) => computeScore(o).toFixed(1) + "/5",
          best: "max",
          raw: (o) => computeScore(o),
          strong: true,
        });

        h += `<div class="doc"><div class="lv-wrap"><table class="lv"><thead><tr><th style="min-width:150px">Criteriu</th>${list.map((o) => `<th style="min-width:150px"><span class="id-link" onclick="openOffer('${o.id}')">${o.id}</span><div class="sub" style="font-weight:600;color:var(--text)">${o.producator}</div><div class="sub">${o.produs}</div></th>`).join("")}</tr></thead><tbody>`;
        rows.forEach((r) => {
          let best = null;
          if (r.best && r.raw) {
            const vals = list.map(r.raw).filter((v) => v != null);
            if (vals.length)
              best = r.best === "min" ? Math.min(...vals) : Math.max(...vals);
          }
          h += `<tr${r.eval ? ' style="background:var(--bg)"' : ""}><td class="${r.strong ? "cell-strong" : ""}" style="font-weight:${r.strong ? 800 : 600};${r.strong ? "font-size:13px" : ""}">${r.lbl}</td>${list
            .map((o) => {
              const isBest = best != null && r.raw && r.raw(o) === best;
              return `<td class="${r.strong ? "" : "n"}" style="${isBest ? "background:var(--primary-soft);color:var(--primary-d);font-weight:800" : ""};${r.strong ? "font-family:var(--mono);font-weight:800;font-size:14px" : ""}">${r.get(o)}${isBest && !r.strong ? " ★" : ""}</td>`;
            })
            .join("")}</tr>`;
        });
        h += `<tr><td></td>${list.map((o) => `<td>${o.orderId ? `<span class="pill blue">Comandat</span>` : `<button class="btn btn-primary btn-sm" onclick="offerToOrder('${o.id}')">Alege →</button>`}</td>`).join("")}</tr>`;
        h += `</tbody></table></div></div><div class="res-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>Celulele verzi cu ★ marchează cea mai bună ofertă pe fiecare criteriu. Scorul compozit ține cont de ponderi.</span></div>`;
        document.getElementById("wrap").innerHTML = h;
      }

      /* acțiuni ofertă */
      async function newOffer() {
        const id = await nextId("OF", true);
        DB.offers.push(blankOffer(id));
        save();
        openOffer(id);
        toast("Ofertă creată");
      }
      function delOffer(id) {
        openModal(
          "Șterge oferta",
          `<p style="font-weight:500">Sigur ștergi <b>${id}</b>?</p>`,
          `<button class="btn btn-default" onclick="closeModal()">Renunță</button><button class="btn btn-primary" style="background:var(--red)" onclick="confirmDelOffer('${id}')">Șterge</button>`,
        );
      }
      function confirmDelOffer(id) {
        DB.offers = DB.offers.filter((x) => x.id !== id);
        save();
        closeModal();
        go("offers");
        toast("Ștearsă");
      }
      async function offerToOrder(id) {
        const of = DB.offers.find((x) => x.id === id);
        const b = bestPrice(of);
        if (
          !DB.suppliers.some((s) => s.nume === of.producator) &&
          of.producator
        )
          DB.suppliers.push({
            id: await nextId("FURN", false),
            nume: of.producator,
            tara: "China",
            oras: "",
            contact: "",
            email: "",
            incoterms: "FOB",
          });
        const oid = await nextId("IMP", true);
        const ord = Object.assign(blankOrder(oid), {
          supplier: of.producator,
          produs: of.produs,
          tipAsamblare: of.tipAsamblare,
          pretBuc: b ? +b.pret : 0,
          valutaFOB: b ? b.valuta : "USD",
          nrBuc: b ? +b.cantMin : 0,
        });
        DB.orders.push(ord);
        of.orderId = oid;
        of.status = "Comandat";
        save();
        toast("Comandă " + oid + " creată din ofertă");
        openDoc(oid);
      }

      function antet() {

      function antetEditor() {

        <div style="display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap"><div id="antLogo" style="min-width:150px;min-height:50px;border:1px dashed var(--border-2);border-radius:8px;display:grid;place-items:center;padding:6px">${antetLogoSrc(a) ? `<img src="${antetLogoSrc(a)}" style="max-height:40px;max-width:220px">` : '<span style="font-size:11.5px;color:var(--muted)">fără siglă</span>'}</div>

      /* ===== FIȘĂ CONTAINER — de la încărcare până la scoaterea din antrepozit (PDF A4) ===== */
      function printContainerPDF(id) {

        if (!c) return;
        document.getElementById("printArea").innerHTML =
          buildContainerPrintHTML(c);
        const old = document.title;
        document.title = `Fisa container ${(c.nr || "").replace(/[^A-Za-z0-9]/g, "")} ${ddToday()}`;
        const back = () => {
          document.title = old;
          window.removeEventListener("afterprint", back);
        };
        window.addEventListener("afterprint", back);
        const imgs = [...document.querySelectorAll("#printArea img")];
        Promise.all(
          imgs.map((im) =>
            im.complete ? 1 : new Promise((r) => (im.onload = im.onerror = r)),
          ),
        ).then(() => setTimeout(() => window.print(), 60));
      }

        let plTot = 0;

              .join(
                "",
              )}${C.opsNet ? `<tr><td>Operațiuni vamale — Info TIR fără TVA</td><td class="n muted">—</td><td class="n">${lei(C.opsNet)}</td><td><span class="tag real">declarații</span></td></tr>` : ""}<tr class="tot"><td colspan="2">Total logistică container</td><td class="n">${lei((C.total || 0) + (C.opsNet || 0))}</td><td></td></tr></tbody></table>`

      /* ===== STATISTICI (doar admin) — totul citit din computeAll(), fără a modifica vreun calcul ===== */
      const ST_COL = [
        "#0f6b4f",

        "#f59e0b",
        "#8b5cf6",
        "#ef4444",
        "#14b8a6",

      ];
      let statsF = null;

      function statsDef() {

          from: d.toISOString().slice(0, 10),
