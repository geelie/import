          spot: "",
        };
      }
      function statsPreset(k) {
        const to = ddToday(),
          d = new Date();
        if (k === "an") d.setMonth(0, 1);
        else if (k === "tot") d.setFullYear(2000, 0, 1);
        else d.setMonth(d.getMonth() - +k);
        Object.assign(statsF, {
          from: d.toISOString().slice(0, 10),
          to,
          preset: k,
        });
        vStats();
      }
      function statsSet(k, v) {
        statsF[k] = v;
        if (k === "from" || k === "to") statsF.preset = "";
        vStats();
      }
      const daysBetween = (a, b) => (a && b ? dNum(b) - dNum(a) : null);
      const ym = (d) => (d ? String(d).slice(0, 7) : "");
      const ymLbl = (k) => {
        const [y, m] = k.split("-");
        return (
          [
            "ian",
            "feb",
            "mar",
            "apr",
            "mai",
            "iun",
            "iul",
            "aug",
            "sep",
            "oct",
            "nov",
            "dec",
          ][+m - 1] +
          " " +
          y.slice(2)
        );
      };
      function monthsRange(from, to) {
        const out = [];
        let [y, m] = from.slice(0, 7).split("-").map(Number);
        const [y2, m2] = to.slice(0, 7).split("-").map(Number);
        while (y < y2 || (y === y2 && m <= m2)) {
          out.push(y + "-" + String(m).padStart(2, "0"));
          if (++m > 12) {
            m = 1;
            y++;
          }
          if (out.length > 120) break;
        }
        return out;
      }
      const nf0 = (v) =>
        new Intl.NumberFormat("ro-RO", { maximumFractionDigits: 0 }).format(
          v || 0,
        );
      const nfK = (v) =>
        Math.abs(v) >= 1e6
          ? (v / 1e6).toLocaleString("ro-RO", { maximumFractionDigits: 1 }) +
            " mil"
          : Math.abs(v) >= 1e4
            ? Math.round(v / 1e3).toLocaleString("ro-RO") + " k"
            : nf0(v);
      const pctTxt = (v) =>
        v == null || !isFinite(v)
          ? "—"
          : (v * 100).toLocaleString("ro-RO", { maximumFractionDigits: 1 }) +
            "%";

      /* --- grafice SVG --- */
      function svgBars(items, o = {}) {
        // items: [{lbl, v, note}]
        const W = 680,
          H = o.h || 220,
          L = 52,
          B = 34,
          T = 14;
        const max = Math.max(1, ...items.map((x) => x.v));
        const n = Math.max(1, items.length),
          bw = Math.min(46, ((W - L - 10) / n) * 0.62),
          step = (W - L - 10) / n;
        const y = (v) => T + (H - T - B) * (1 - v / max);
        const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => max * f);
        let s = `<svg class="st-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || "grafic")}">`;
        ticks.forEach(
          (tv) =>
            (s += `<line x1="${L}" x2="${W - 6}" y1="${y(tv)}" y2="${y(tv)}" stroke="#e5e8ec"/><text x="${L - 6}" y="${y(tv) + 3}" text-anchor="end" font-size="9.5" fill="#6b7280">${nfK(tv)}</text>`),
        );
        items.forEach((it, i) => {
          const x = L + step * i + (step - bw) / 2;
          const h = Math.max(0, H - B - y(it.v));
          s += `<rect x="${x}" y="${y(it.v)}" width="${bw}" height="${h}" rx="3" fill="${it.c || o.c || ST_COL[0]}"><title>${esc(it.lbl)}: ${nf0(it.v)}</title></rect>`;
          if (it.v)
            s += `<text x="${x + bw / 2}" y="${y(it.v) - 4}" text-anchor="middle" font-size="9" fill="#374151">${esc(it.note != null ? it.note : nfK(it.v))}</text>`;
          s += `<text x="${x + bw / 2}" y="${H - B + 13}" text-anchor="middle" font-size="9.5" fill="#4b5563">${esc(it.lbl)}</text>`;
        });
        return s + `</svg>`;
      }
      function svgStacked(rows, keys, o = {}) {
        // rows: [{lbl, parts:{k:v}}] — bare verticale suprapuse
        const W = 680,
          H = o.h || 240,
          L = 52,
          B = 34,
          T = 12;
        const tot = (r) =>
          keys.reduce((a, k) => a + Math.max(0, r.parts[k.k] || 0), 0);
        const max = Math.max(1, ...rows.map(tot));
        const n = Math.max(1, rows.length),
          step = (W - L - 10) / n,
          bw = Math.min(46, step * 0.62);
        const y = (v) => T + (H - T - B) * (1 - v / max);
        let s = `<svg class="st-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || "grafic")}">`;
        [0, 0.25, 0.5, 0.75, 1].forEach(
          (f) =>
            (s += `<line x1="${L}" x2="${W - 6}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="#e5e8ec"/><text x="${L - 6}" y="${y(max * f) + 3}" text-anchor="end" font-size="9.5" fill="#6b7280">${nfK(max * f)}</text>`),
        );
        rows.forEach((r, i) => {
          const x = L + step * i + (step - bw) / 2;
          let acc = 0;
          keys.forEach((k, j) => {
            const v = Math.max(0, r.parts[k.k] || 0);
            if (!v) return;
            s += `<rect x="${x}" y="${y(acc + v)}" width="${bw}" height="${y(acc) - y(acc + v)}" fill="${k.c || ST_COL[j % ST_COL.length]}"><title>${esc(r.lbl)} · ${esc(k.lbl)}: ${nf0(v)}</title></rect>`;
            acc += v;
          });
          if (acc)
            s += `<text x="${x + bw / 2}" y="${y(acc) - 4}" text-anchor="middle" font-size="9" fill="#374151">${nfK(acc)}</text>`;
          s += `<text x="${x + bw / 2}" y="${H - B + 13}" text-anchor="middle" font-size="9.5" fill="#4b5563">${esc(r.lbl.length > 16 ? r.lbl.slice(0, 15) + "…" : r.lbl)}</text>`;
        });
        return s + `</svg>` + legend(keys);
      }
      function svgHBars(items, o = {}) {
        // bare orizontale: [{lbl, v, note}]
        const W = 680,
          rowH = 24,
          L = o.L || 170,
          H = items.length * rowH + 8;
        const max = Math.max(1, ...items.map((x) => x.v));
        let s = `<svg class="st-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || "grafic")}">`;
        items.forEach((it, i) => {
          const y0 = 4 + i * rowH,
            w = ((W - L - 90) * it.v) / max;
          s += `<text x="${L - 8}" y="${y0 + 15}" text-anchor="end" font-size="10.5" fill="#374151">${esc(it.lbl.length > (o.max || 30) ? it.lbl.slice(0, (o.max || 30) - 1) + "…" : it.lbl)}</text><rect x="${L}" y="${y0 + 3}" width="${Math.max(1, w)}" height="${rowH - 9}" rx="3" fill="${it.c || o.c || ST_COL[0]}"><title>${esc(it.lbl)}: ${nf0(it.v)}</title></rect><text x="${L + w + 6}" y="${y0 + 15}" font-size="10" fill="#374151">${esc(it.note != null ? it.note : nf0(it.v))}</text>`;
        });
        return s + `</svg>`;
      }
      function svgShare(parts) {
        // o singură bară 100% cu ponderi + legendă
        const W = 680,
          H = 34,
          tot = parts.reduce((a, p) => a + Math.max(0, p.v), 0) || 1;
        let x = 0,
          s = `<svg class="st-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="structura costului">`;
        parts.forEach((p, i) => {
          const w = (W * Math.max(0, p.v)) / tot;
          if (w <= 0) return;
          s += `<rect x="${x}" y="4" width="${w}" height="26" fill="${p.c || ST_COL[i % ST_COL.length]}"><title>${esc(p.lbl)}: ${nf0(p.v)} lei (${pctTxt(p.v / tot)})</title></rect>`;
          if (w > 44)
            s += `<text x="${x + w / 2}" y="21" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="700">${pctTxt(p.v / tot)}</text>`;
          x += w;
        });
        return (
          s +
          `</svg>` +
          legend(
            parts.map((p, i) => ({
              lbl: p.lbl,
              c: p.c || ST_COL[i % ST_COL.length],
            })),
          )
        );
      }
      function svgLines(series, o = {}) {
        // series: [{name, pts:[{x:'YYYY-MM-DD', y, lbl}]}]
        const W = 680,
          H = o.h || 240,
          L = 56,
          B = 30,
          T = 12,
          R = 14;
        const xs = series.flatMap((s) => s.pts.map((p) => dNum(p.x)));
        const ys = series.flatMap((s) => s.pts.map((p) => p.y));
        if (!xs.length) return "";
        const x0 = Math.min(...xs),
          x1 = Math.max(...xs),
          yMin = Math.min(...ys) * 0.95,
          yMax = Math.max(...ys) * 1.05 || 1;
        const X = (d) =>
          L +
          (x1 === x0
            ? (W - L - R) / 2
            : ((dNum(d) - x0) / (x1 - x0)) * (W - L - R));
        const Y = (v) =>
          T + (H - T - B) * (1 - (v - yMin) / (yMax - yMin || 1));
        let s = `<svg class="st-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || "evoluție")}">`;
        [0, 0.25, 0.5, 0.75, 1].forEach((f) => {
          const v = yMin + (yMax - yMin) * f;
          s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e5e8ec"/><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end" font-size="9.5" fill="#6b7280">${nfK(v)}</text>`;
        });
        series.forEach((se, i) => {
          const c = ST_COL[i % ST_COL.length];
          const pts = se.pts.slice().sort((a, b) => dNum(a.x) - dNum(b.x));
          s += `<polyline fill="none" stroke="${c}" stroke-width="2" points="${pts.map((p) => X(p.x) + "," + Y(p.y)).join(" ")}"/>`;
          pts.forEach(
            (p) =>
              (s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3.5" fill="${c}"><title>${esc(se.name)} · ${esc(p.lbl || "")} · ${fmtD(p.x)}: ${nf0(p.y)} lei</title></circle>`),
          );
        });
        s += `<text x="${L}" y="${H - 8}" font-size="9.5" fill="#6b7280">${fmtD(dStr(x0))}</text><text x="${W - R}" y="${H - 8}" text-anchor="end" font-size="9.5" fill="#6b7280">${fmtD(dStr(x1))}</text>`;
        return (
          s +
          `</svg>` +
          legend(
            series.map((se, i) => ({
              lbl: se.name,
              c: ST_COL[i % ST_COL.length],
            })),
          )
        );
      }
      function legend(keys) {
        return `<div class="st-leg">${keys.map((k, i) => `<span><i style="background:${k.c || ST_COL[i % ST_COL.length]}"></i>${esc(k.lbl)}</span>`).join("")}</div>`;
      }
      function stTable(id, head, rows, foot) {
        // head: [{t, n}] ; rows: arrays of [display, raw]
        _stTables[id] = {
          head: head.map((h) => h.t),
          rows: rows.map((r) => r.map((c) => (Array.isArray(c) ? c[1] : c))),
        };
        return `<div class="st-scroll"><table class="st-tbl"><thead><tr>${head.map((h) => `<th${h.n ? ' class="n"' : ""}>${esc(h.t)}</th>`).join("")}</tr></thead><tbody>${rows
          .map(
            (r) =>
              `<tr>${r.map((c, j) => `<td${head[j].n ? ' class="n"' : ""}>${Array.isArray(c) ? c[0] : esc(c)}</td>`).join("")}</tr>`,
          )
          .join(
            "",
          )}${foot ? `<tr class="tot">${foot.map((c, j) => `<td${head[j].n ? ' class="n"' : ""}>${c}</td>`).join("")}</tr>` : ""}</tbody></table></div>`;
      }
      function stCard(titlu, sub, body, csvId) {
        return `<div class="st-card"><div class="st-h"><h3>${titlu}</h3>${csvId ? `<button class="btn btn-default btn-sm st-noprint" onclick="statsCSV('${csvId}')">CSV</button>` : ""}${sub ? `<div class="st-sub">${sub}</div>` : ""}</div>${body}</div>`;
      }
      function statsCSV(id) {
        const tb = _stTables[id];
        if (!tb) return;
        const q = (v) => {
          const s =
            v == null
              ? ""
              : typeof v === "number"
                ? String(Math.round(v * 100) / 100).replace(".", ",")
                : String(v);
          return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        };
        const csv =
          "﻿" +
          [tb.head, ...tb.rows].map((r) => r.map(q).join(";")).join("\r\n");
        const a = document.createElement("a");
        a.href = URL.createObjectURL(
          new Blob([csv], { type: "text/csv;charset=utf-8" }),
        );
        a.download = `statistici_${id}_${statsF.from}_${statsF.to}.csv`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      }

      /* --- date --- */
      function statsData() {
        const F = statsF;
        const R = computeAll();
        const spotOf = (o) => String((o.maritim || {}).spot || "").trim();
        const ords = DB.orders.filter((o) => {
          const d = o.dataCreare || "";
          if (!d || d < F.from || d > F.to) return false;
          if (F.sup && o.supplier !== F.sup) return false;
          if (F.st && o.status !== F.st) return false;
          if (F.tip && o.tipAsamblare !== F.tip) return false;
          if (F.spot && spotOf(o) !== F.spot) return false;
          return true;
        });
        const ids = new Set(ords.map((o) => o.id));
        const rows = ords.map((o) => {
          const O = R.orders[o.id];
          const conts = (O.contIds || []).map(contOf).filter(Boolean);
          const desc =
            conts
              .map((c) => c.descarcare)
              .filter(Boolean)
              .sort()[0] || "";
          const plas =
            conts
              .flatMap((c) =>
                (c.ops || [])
                  .filter((op) => op.tip === "plasare" && !op.anulat && op.data)
                  .map((op) => op.data),
              )
              .sort()[0] || "";
          const dvis = (DB.dvi || [])
            .filter(
              (d) => d.data && (d.art || []).some((a) => a.orderId === o.id),
            )
            .map((d) => d.data)
            .sort();
          const produs = O.M.reduce(
            (a, m) => a + (m.produsLEI || 0) * (m.buc || 0),
            0,
          );
          return {
            o,
            O,
            conts,
            desc,
            plas,
            dvi1: dvis[0] || "",
            dviN: dvis[dvis.length - 1] || "",
            nDvi: dvis.length,
            produs,
          };
        });
        return { R, ords, ids, rows };
      }

      function vStats() {
        const wrap = document.getElementById("wrap");
        if (!currentProfile || currentProfile.role !== "admin") {
          wrap.innerHTML = `<div class="empty" style="padding:60px"><p>Statisticile sunt disponibile doar administratorului.</p></div>`;
          return;
        }
        crumb([{ t: "Statistici" }]);
        statsF = statsF || statsDef();
        wrap.innerHTML = `<div class="page-h"><h1>Statistici comenzi</h1><div class="ft-actions"><button class="btn btn-primary btn-sm" onclick="printStatsPDF()">Raport PDF</button></div></div>${statsFilters()}<div id="statsBody">${statsBody()}</div>`;
      }
      function statsFilters() {
        const F = statsF;
        const uniq = (a) =>
          [...new Set(a.filter(Boolean))].sort((x, y) =>
            x.localeCompare(y, "ro"),
          );
        const opt = (arr, cur, all) =>
          `<option value="">${all}</option>` +
          arr
            .map(
              (v) =>
                `<option ${v === cur ? "selected" : ""}>${esc(v)}</option>`,
            )
            .join("");
        const sel = (k, lbl, arr, all) =>
          `<div class="f"><label>${lbl}</label><select onchange="statsSet('${k}',this.value)">${opt(arr, F[k], all)}</select></div>`;
        return `<div class="st-card st-noprint"><div class="st-filters">
      <div class="f"><label>Perioadă (data creării comenzii)</label><div class="st-chips">${[
        ["3", "3 luni"],
        ["6", "6 luni"],
        ["12", "12 luni"],
        ["an", "Anul curent"],
        ["tot", "Tot"],
      ]
        .map(
          ([k, l]) =>
            `<button class="${F.preset === k ? "on" : ""}" onclick="statsPreset('${k}')">${l}</button>`,
        )
        .join("")}</div></div>
      <div class="f"><label>De la</label><input type="date" value="${F.from}" onchange="statsSet('from',this.value)"></div>
      <div class="f"><label>Până la</label><input type="date" value="${F.to}" onchange="statsSet('to',this.value)"></div>
      ${sel("sup", "Furnizor", uniq(DB.orders.map((o) => o.supplier)), "Toți")}
      ${sel("st", "Status", uniq(DB.orders.map((o) => o.status)), "Toate")}
      ${sel("tip", "Tip asamblare", uniq(DB.orders.map((o) => o.tipAsamblare)), "Toate")}
      ${sel("spot", "Spot", uniq(DB.orders.map((o) => String((o.maritim || {}).spot || "").trim())), "Toate")}
    </div></div>`;
      }
      function statsBody() {
        const { R, rows, ids } = statsData();
        const F = statsF;
        if (!rows.length)
          return `<div class="st-card"><div style="padding:30px;text-align:center;color:var(--muted)">Nicio comandă creată în perioada ${fmtD(F.from)} – ${fmtD(F.to)} cu filtrele alese.</div></div>`;
        const S = (f) => rows.reduce((a, r) => a + (+f(r) || 0), 0);
        const buc = S((r) => r.O.nrBuc),
          costNet = S((r) => r.O.costTotalNet),
          vanz = S((r) => r.O.vanzareTotala),
          marja = S((r) => r.O.marjaTotala);
        const produs = S((r) => r.produs),
          taxa = S((r) => r.O.taxaTotal),
          tva = S((r) => r.O.tvaTotal),
          log = S((r) => r.O.logTotal),
          extra = S((r) => r.O.extraAll);
        const realCats = S((r) => r.O.realCats),
          totCats = S((r) => r.O.totCats);
        const valFOBlei = S((r) => r.produs),
          platit = S((r) => r.O.platitLei),
          schimb = S((r) => r.O.costSchimb);
        const pctPl = rows.length
          ? S((r) => r.O.pctPlatit * r.produs) / (produs || 1)
          : 0;
        let h = "";
        // KPI
        const K = (l, v, s) =>
          `<div class="st-kpi"><span>${l}</span><b>${v}</b>${s ? `<i>${s}</i>` : ""}</div>`;
        h += `<div class="st-kpis">${K("Comenzi", rows.length, `${fmtD(F.from)} – ${fmtD(F.to)}`)}${K("Bucăți", nf0(buc))}${K("Valoare marfă", lei0(valFOBlei), "preț FOB în lei")}${K("Cost total intrare", lei0(costNet), "fără TVA")}${K("Cost mediu / buc", lei0(buc ? costNet / buc : 0))}${K("Vânzare B2B estimată", lei0(vanz))}${K("Marjă estimată", lei0(marja), pctTxt(vanz ? marja / vanz : null) + " din vânzare")}${K("Costuri logistice reale", pctTxt(totCats ? realCats / totCats : null), "categorii cu plăți reale")}${K("Plătit furnizor", pctTxt(pctPl), lei0(platit) + " plătit total")}${K("Câștig/pierdere curs", lei0(-schimb), "față de BNR (+ = câștig)")}</div>`;
        // 1. comenzi pe lună
        const dts = rows.map((r) => r.o.dataCreare).sort();
        const months = monthsRange(
          dts[0] > F.from ? dts[0] : F.from,
          dts[dts.length - 1] < F.to ? F.to : dts[dts.length - 1],
        ).slice(-36);
        const byM = {};
        rows.forEach((r) => {
          const k = ym(r.o.dataCreare);
          (byM[k] = byM[k] || { n: 0, v: 0, c: 0 }).n++;
          byM[k].v += r.produs;
          byM[k].c += r.O.costTotalNet || 0;
        });
        h += stCard(
          "Comenzi pe lună",
          "valoarea mărfii (lei) · eticheta = număr comenzi",
          svgBars(
            months.map((k) => ({
              lbl: ymLbl(k),
              v: (byM[k] || {}).v || 0,
              note: (byM[k] || {}).n ? byM[k].n + " cmd" : "",
            })),
            { aria: "comenzi pe lună" },
          ) +
            stTable(
              "luni",
              [
                { t: "Luna" },
                { t: "Comenzi", n: 1 },
                { t: "Valoare marfă (lei)", n: 1 },
                { t: "Cost total intrare (lei)", n: 1 },
              ],
              months
                .filter((k) => byM[k])
                .map((k) => [
                  ymLbl(k),
                  [byM[k].n, byM[k].n],
                  [nf0(byM[k].v), byM[k].v],
                  [nf0(byM[k].c), byM[k].c],
                ]),
            ),
          "luni",
        );
        // 2. status
        const bySt = {};
        rows.forEach((r) => (bySt[r.o.status] = (bySt[r.o.status] || 0) + 1));
        h += stCard(
          "Comenzi pe status",
          "",
          svgHBars(
            Object.entries(bySt)
              .sort((a, b) => b[1] - a[1])
              .map(([k, v], i) => ({
                lbl: k,
                v,
                c: ST_COL[i % ST_COL.length],
                note: v + " (" + pctTxt(v / rows.length) + ")",
              })),
            { aria: "status" },
          ),
        );
        // 3. structura costului
        const catParts = LOG_CATS.map((k, i) => ({
          lbl: k.sh || k.lbl,
          v: S((r) => (r.O.cat || {})[k.k]),
          c: ST_COL[(i + 1) % ST_COL.length],
        })).filter((p) => p.v > 0);
        const parts = [
          { lbl: "Marfă (FOB)", v: produs, c: ST_COL[0] },
          ...catParts,
          { lbl: "Taxă vamală", v: taxa, c: "#a16207" },
          { lbl: "Extra (Info TIR, comisioane…)", v: extra, c: "#64748b" },
        ].filter((p) => p.v > 0);
        const tp = parts.reduce((a, p) => a + p.v, 0);
        h += stCard(
          "Structura costului total de intrare",
          `${lei0(tp)} fără TVA · TVA vamal separat: ${lei0(tva)}`,
          svgShare(parts) +
            stTable(
              "structura",
              [
                { t: "Componentă" },
                { t: "Lei", n: 1 },
                { t: "Pondere", n: 1 },
                { t: "Lei / bucată", n: 1 },
              ],
              parts.map((p) => [
                p.lbl,
                [nf0(p.v), p.v],
                [pctTxt(p.v / tp), p.v / tp],
                [nf0(buc ? p.v / buc : 0), buc ? p.v / buc : 0],
              ]),
              ["Total", nf0(tp), "100%", nf0(buc ? tp / buc : 0)],
            ),
          "structura",
        );
        // 4. cost pe bucată pe model
        const mods = {};
        rows.forEach((r) =>
          r.O.M.forEach((m) => {
            const k = (m.model || "?").trim();
            const x = (mods[k] = mods[k] || {
              buc: 0,
              produs: 0,
              tr: 0,
              taxa: 0,
              ex: 0,
              cost: 0,
              vanz: 0,
              marja: 0,
              ords: new Set(),
            });
            const b = +m.buc || 0;
            x.buc += b;
            x.produs += (m.produsLEI || 0) * b;
            x.tr += (m.transportBuc || 0) * b;
            x.taxa += (m.taxaVamala || 0) * b;
            x.ex += (m.extraBuc || 0) * b;
            x.cost += (m.costNet || 0) * b;
            x.vanz += (m.vanzareB2B || 0) * b;
            x.marja += (m.marjaBuc || 0) * b;
            x.ords.add(r.o.id);
          }),
        );
        const mList = Object.entries(mods)
          .filter(([, x]) => x.buc > 0)
          .sort((a, b) => b[1].cost - a[1].cost);
        const keys = [
          { k: "produs", lbl: "Marfă", c: ST_COL[0] },
          { k: "tr", lbl: "Transport", c: ST_COL[1] },
          { k: "taxa", lbl: "Taxă vamală", c: "#a16207" },
          { k: "ex", lbl: "Extra", c: "#64748b" },
        ];
        h += stCard(
          "Cost pe bucată, pe model",
          "medie ponderată cu bucățile din comenzile filtrate · fără TVA",
          svgStacked(
            mList
              .slice(0, 12)
              .map(([k, x]) => ({
                lbl: k,
                parts: {
                  produs: x.produs / x.buc,

                ],

        // 5. evoluția costului pe bucată (modele în ≥2 comenzi)
        const ser = {};

              rows.map((r) => [

                ],
                [fmtD(r.o.dataCreare), r.o.dataCreare],
                r.o.supplier || "",
                r.o.status || "",
                [nf0(r.O.nrBuc), r.O.nrBuc],
                [val(r.O.valoareFOB, r.o.valutaFOB), r.O.valoareFOB],
                [nf0(r.O.costTotalNet), r.O.costTotalNet],
                [nf0(r.O.costNet), r.O.costNet],
                [nf0(r.O.vanzareTotala), r.O.vanzareTotala],
                [nf0(r.O.marjaTotala), r.O.marjaTotala],

              [

                "",
                "",
                "",
                nf0(buc),
                "",
                nf0(costNet),
                nf0(buc ? costNet / buc : 0),

                nf0(marja),
                "",

          "comenzi",
        );
        // 7. furnizori
        const sup = {};
        rows.forEach((r) => {
          const k = r.o.supplier || "(fără furnizor)";
          const x = (sup[k] = sup[k] || {
            n: 0,
            buc: 0,
            val: 0,
            cost: 0,
            marja: 0,
            vanz: 0,
            lead: [],
            delay: [],
          });
          x.n++;
          x.buc += r.O.nrBuc || 0;
          x.val += r.produs;
          x.cost += r.O.costTotalNet || 0;
          x.marja += r.O.marjaTotala || 0;
          x.vanz += r.O.vanzareTotala || 0;
          const ld = daysBetween(r.o.dataCreare, r.desc);
          if (ld != null) x.lead.push(ld);
          const dl = daysBetween((r.o.maritim || {}).etaPOD, r.desc);
          if (dl != null) x.delay.push(dl);
        });
        const avg = (a) =>
          a.length ? a.reduce((s, v) => s + v, 0) / a.length : null;
        const sL = Object.entries(sup).sort((a, b) => b[1].val - a[1].val);
        h += stCard(
          "Furnizori",
          "termen = de la crearea comenzii la descărcarea în port · întârziere = descărcare reală față de ETA POD (+ = mai târziu)",

              lbl: k,
              v: x.val,
              note: lei0(x.val) + " · " + x.n + " cmd",
              c: ST_COL[i % ST_COL.length],
            })),
            { aria: "furnizori", L: 200 },
          ) +
            stTable(
              "furnizori",
              [
                { t: "Furnizor" },
                { t: "Comenzi", n: 1 },
                { t: "Bucăți", n: 1 },
                { t: "Valoare marfă", n: 1 },
                { t: "Cost total net", n: 1 },
                { t: "Marjă", n: 1 },
                { t: "Marjă %", n: 1 },
                { t: "Termen mediu (zile)", n: 1 },
                { t: "Întârziere medie ETA (zile)", n: 1 },
              ],
              sL.map(([k, x]) => [
                k,
                [x.n, x.n],
                [nf0(x.buc), x.buc],
                [nf0(x.val), x.val],
                [nf0(x.cost), x.cost],
                [nf0(x.marja), x.marja],
                [
                  pctTxt(x.vanz ? x.marja / x.vanz : null),
                  x.vanz ? x.marja / x.vanz : "",
                ],
                [
                  avg(x.lead) == null ? "—" : Math.round(avg(x.lead)),
                  avg(x.lead) ?? "",
                ],
                [
                  avg(x.delay) == null ? "—" : Math.round(avg(x.delay)),
                  avg(x.delay) ?? "",
                ],
              ]),
            ),
          "furnizori",
        );
        // 8. durate etape
        const st = [
          [
            "Creare → ETA încărcare (plan)",

          ],
          [
            "ETA încărcare → ETA port (plan)",

              .map((s, i) => ({
                lbl: s.l,
                v: Math.max(0, s.avg),
                note: Math.round(s.avg) + " zile (" + s.n + " cmd)",
                c: s.avg < 0 ? "#ef4444" : ST_COL[i % ST_COL.length],
              })),
            { aria: "durate", L: 260, max: 40 },
          ) +
            stTable(
              "etape",
              [
                { t: "Etapă" },
                { t: "Comenzi", n: 1 },
                { t: "Medie", n: 1 },
                { t: "Minim", n: 1 },
                { t: "Maxim", n: 1 },
              ],
              stats.map((s) => [
                s.l,
                [s.n, s.n],
                [s.avg == null ? "—" : Math.round(s.avg), s.avg ?? ""],
                [s.min ?? "—", s.min ?? ""],
                [s.max ?? "—", s.max ?? ""],
              ]),
            ) +
            `<details class="st-noprint" style="margin-top:8px"><summary style="cursor:pointer;font-size:12px;font-weight:700">Detaliu pe comandă</summary>` +
            stTable(
              "etape_comenzi",
              [
                { t: "Comandă" },
                { t: "Creare" },
                { t: "ETA FOB" },
                { t: "ETA POD" },
                { t: "Descărcare" },
                { t: "Plasare" },
                { t: "Primul DVI" },
                { t: "Ultimul DVI" },
                { t: "Întârziere ETA", n: 1 },
              ],
              rows.map((r) => [
                r.o.id,
                fmtD(r.o.dataCreare),
                fmtD((r.o.maritim || {}).etaFOB),
                fmtD((r.o.maritim || {}).etaPOD),
                fmtD(r.desc),
                fmtD(r.plas),
                fmtD(r.dvi1),
                fmtD(r.dviN),
                [
                  daysBetween((r.o.maritim || {}).etaPOD, r.desc) ?? "—",
                  daysBetween((r.o.maritim || {}).etaPOD, r.desc) ?? "",
                ],

            ) +
            `</details>`,
          "etape",
        );
        // 9. plăți pe lună pe categorii (plățile de container împărțite după cota comenzii în container)
        const payM = {};
        const catK = [
          { k: "furnizor", lbl: "Furnizor (marfă)", c: ST_COL[0] },
          ...LOG_CATS.map((k, i) => ({
            k: k.k,
            lbl: k.sh || k.lbl,
            c: ST_COL[(i + 1) % ST_COL.length],
          })),
          { k: "comision", lbl: "Comision bancar", c: "#64748b" },
        ];
        const shareIn = (cid, oid) =>
          ((R.conts[cid] || {}).lines || [])
            .filter((L) => L.l.orderId === oid)
            .reduce((a, L) => a + (L.share || 0), 0);
        (DB.plati || []).forEach((p) => {
          const lei = +(R.pay[p.id] || {}).lei || 0;
          if (!lei || !p.data) return;
          let f = 0;
          if (p.contId) rows.forEach((r) => (f += shareIn(p.contId, r.o.id)));
          else if (ids.has(p.orderId)) f = 1;
          if (!f) return;
          const k = ym(p.data);
          const x = (payM[k] = payM[k] || {});
          x[p.tip] = (x[p.tip] || 0) + lei * f;
        });
        const pMonths = Object.keys(payM).sort();
        const usedK = catK.filter((k) => pMonths.some((m) => payM[m][k.k]));
        h += stCard(
          "Plăți efectuate pe lună",

                      payM[m][k.k] || 0,

                    [
                      nf0(usedK.reduce((a, k) => a + (payM[m][k.k] || 0), 0)),

            : `<div style="color:var(--muted);font-size:12.5px">Nicio plată cu dată pentru comenzile filtrate.</div>`,
          "plati_luna",
        );
        // 10. plată furnizor + curs
        h += stCard(
          "Plata furnizorului și cursul valutar",
          "curs efectiv = media plăților reale către furnizor · câștig/pierdere = diferența față de cursul BNR introdus pe plăți",
          stTable(
            "furnizor_plata",
            [
              { t: "Comandă" },
              { t: "Metoda de plată" },
              { t: "Valoare FOB", n: 1 },
              { t: "Plătit (valută)", n: 1 },
              { t: "% plătit", n: 1 },
              { t: "Rest de plată", n: 1 },
              { t: "Curs estimat", n: 1 },
              { t: "Curs efectiv", n: 1 },
              { t: "Câștig / pierdere curs (lei)", n: 1 },
            ],
            rows.map((r) => [
              r.o.id,
              (r.o.metodaPlata && r.o.metodaPlata.nume) || "manual",
              [val(r.O.valoareFOB, r.o.valutaFOB), r.O.valoareFOB],

              { t: "Scoase (DVI)", n: 1 },
              { t: "Rămase", n: 1 },
              { t: "DVI-uri", n: 1 },
              { t: "Taxă vamală", n: 1 },
              { t: "TVA vamal", n: 1 },
              { t: "Sursă" },

            rows.map((r) => [
              r.o.id,
              [nf0(r.O.nrBuc), r.O.nrBuc],

              [
                nf0((r.O.nrBuc || 0) - (r.O.relBuc || 0)),

              [r.nDvi, r.nDvi],

            [

              S((r) => r.nDvi),
              nf0(taxa),
              nf0(tva),
              "",
            ],
          ),
          "vama",
        );
        // 12. logistică pe container, pe luna descărcării
        const cM = {};
        const seen = new Set();
        rows.forEach((r) =>
          r.conts.forEach((c) => {
            if (seen.has(c.id)) return;
            seen.add(c.id);
            const C = R.conts[c.id];
            if (!C || !c.descarcare) return;
            const k = ym(c.descarcare);
            const x = (cM[k] = cM[k] || { n: 0, cost: 0, dd: 0 });
            x.n++;
            x.cost += C.total || 0;
            x.dd += (C.cat || {}).portExtra || 0;
          }),
        );
        const cMonths = Object.keys(cM).sort();
        h += stCard(
          "Cost logistic pe container",
          "containerele comenzilor filtrate, după luna descărcării · cost logistic mediu pe container (lei)",
          cMonths.length
            ? svgBars(
                cMonths.map((m) => ({
                  lbl: ymLbl(m),
                  v: cM[m].cost / cM[m].n,
                  note: nfK(cM[m].cost / cM[m].n) + " (" + cM[m].n + ")",
                })),
                { aria: "cost container", c: ST_COL[1] },
              ) +
                stTable(
                  "containere_luna",
                  [
                    { t: "Luna descărcării" },
                    { t: "Containere", n: 1 },
                    { t: "Cost logistic total", n: 1 },
                    { t: "Mediu / container", n: 1 },
                    { t: "Stocare / demurrage / staționare", n: 1 },
                  ],
                  cMonths.map((m) => [
                    ymLbl(m),
                    [cM[m].n, cM[m].n],
                    [nf0(cM[m].cost), cM[m].cost],
                    [nf0(cM[m].cost / cM[m].n), cM[m].cost / cM[m].n],
                    [nf0(cM[m].dd), cM[m].dd],

                )
            : `<div style="color:var(--muted);font-size:12.5px">Niciun container descărcat pentru comenzile filtrate.</div>`,
          "containere_luna",
        );
        h += `<div style="font-size:11.5px;color:var(--muted);margin:4px 2px 20px">Cifrele sunt aceleași ca în fișele comenzilor (aceleași funcții de calcul). Unde nu există încă plăți sau DVI-uri reale, valorile sunt estimări.</div>`;
        return h;
      }

      /* ===== IMPORT DIN BACKUP (sigur, multi-utilizator) =====
   Doar admin. Fișierul e verificat pe o copie; nimic nu se scrie până la confirmare.
   Nu șterge nimic din Supabase: adaugă rândurile care lipsesc și, doar dacă bifezi, le înlocuiește pe cele existente. */
      let _imp = null;
      function importBackup() {
        if (!currentProfile || currentProfile.role !== "admin")
          return toast(
            "Importul din backup e permis doar administratorului",
            true,
          );
        const inp = document.createElement("input");
        inp.type = "file";
        inp.accept = ".json";
        inp.onchange = (e) => {
          const fr = new FileReader();
          fr.onload = () => impCheck(fr.result);
          fr.readAsText(e.target.files[0]);
        };
        inp.click();
      }
      function impCheck(text) {
        let obj;
        try {
          obj = JSON.parse(text);
        } catch (e) {
          return toast(
            "Fișierul nu e JSON valid — nu s-a încărcat nimic",
            true,
          );
        }
        const keys = Object.keys(TABLES);
        if (
          !obj ||
          typeof obj !== "object" ||
          !Array.isArray(obj.orders) ||
          keys.some((k) => obj[k] !== undefined && !Array.isArray(obj[k]))
        )
          return toast(
            "Fișierul nu e un backup Geeli Import — nu s-a încărcat nimic",
            true,
          );
        delete obj._files;
        const keep = DB;
        _suspendSave = true;
        let tmp;
        try {
          DB = JSON.parse(JSON.stringify(obj));
          keys.forEach((k) => (DB[k] = Array.isArray(DB[k]) ? DB[k] : []));
          DB.settings = DB.settings || { garantie: 0 };
          migrate();
          migrateV19();
          migrateV20();
          ensureUniqueIds();
          computeAll(); // verifică și că datele se pot calcula
          tmp = DB;
        } catch (err) {
          tmp = null;
        } finally {
          DB = keep;
          _suspendSave = false;
          invalidateCalc();
        }
        if (!tmp)
          return toast(
            "Backup-ul are o structură necunoscută — nu s-a încărcat nimic",
            true,
          );
        const lbl = {
          offers: "oferte",
          suppliers: "furnizori",
          orders: "comenzi",
          containers: "containere",
          plati: "plăți",
          dvi: "DVI-uri",
        };
        const rows = keys.map((k) => {
          const ids = new Set(DB[k].map((r) => r.id));
          const n = tmp[k].length,
            ex = tmp[k].filter((r) => ids.has(r.id)).length;
          return { k, n, nou: n - ex, ex };
        });
        _imp = tmp;
        openModal(
          "Import din backup",
          `<div style="font-size:13px;margin-bottom:10px">Fișierul e valid. Conține:</div>
        <table class="grid-tbl"><thead><tr><th>Tip</th><th style="text-align:right">În fișier</th><th style="text-align:right">Noi</th><th style="text-align:right">Există deja</th></tr></thead><tbody>${rows
          .map(
            (r) =>
              `<tr><td style="padding:7px 10px">${lbl[r.k]}</td><td style="padding:7px 10px;text-align:right">${r.n}</td><td style="padding:7px 10px;text-align:right">${r.nou}</td><td style="padding:7px 10px;text-align:right">${r.ex}</td></tr>`,
          )
          .join("")}</tbody></table>
        <div class="res-note" style="margin-top:12px"><span>Nu se șterge nimic din baza online. Înregistrările noi se adaugă.</span></div>
        <label style="display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:13px"><input type="checkbox" id="impOver" style="margin-top:3px">Înlocuiește și înregistrările care există deja cu versiunea din backup (modificările făcute după data backup-ului la acestea se pierd)</label>`,
          `<button class="btn btn-default" onclick="closeModal()">Renunță</button><button class="btn btn-primary" onclick="impRun()">Importă</button>`,
        );
      }
      async function impRun() {
        if (!_imp) return;
        const over = document.getElementById("impOver").checked;
        closeModal();
        toast("Se importă…");
        const errors = [];
        let add = 0,
          rep = 0;
        for (const k of Object.keys(TABLES)) {
          const table = TABLES[k];
          const have = new Map(DB[k].map((r) => [r.id, r]));
          await pool(_imp[k], 6, async (r) => {
            const cur = have.get(r.id);
            if (cur && !over) return;
            const data = Object.assign(JSON.parse(JSON.stringify(r)), {
              _v: (cur ? +cur._v || 0 : 0) + 1,
              _by: userTag() + " (import backup)",
              _at: new Date().toISOString(),
            });
            const res = cur
              ? await sb.from(table).update({ data }).eq("id", r.id)
              : await sb.from(table).insert({ id: r.id, data });
            if (res.error) errors.push(`${r.id}: ${res.error.message}`);
            else cur ? rep++ : add++;
          });
        }
        _imp = null;
        DB = await load();
        setBaseline();
        migrate();
        migrateV19();
        migrateV20();
        ensureUniqueIds();
        invalidateCalc();
        go("dashboard");
        if (errors.length)
          saveBanner(
            `Import parțial: ${add} adăugate, ${rep} înlocuite, ${errors.length} erori (${errors.slice(0, 2).join(" · ")})`,
          );
        else toast(`Import terminat: ${add} adăugate, ${rep} înlocuite`);
      }
      let tT;
      function toast(m, isErr) {
        const t = document.getElementById("toast");
        t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>${m}`;
        t.style.background = isErr ? "var(--red)" : "var(--text)";
        t.querySelector("svg").style.color = isErr ? "#fff" : "var(--primary)";
        t.classList.add("show");
        clearTimeout(tT);
        tT = setTimeout(() => t.classList.remove("show"), 2600);
      }

      function bindUserRow(p) {
        const row = document.querySelector(`tr[data-urow="${p.id}"]`);
        if (!row) return;
        row.querySelector(".usave").addEventListener("click", async (e) => {
          const btn = e.currentTarget;
          const role = row.querySelector(".urole").value || null;
          const nume = row.querySelector(".unume").value.trim() || null;
          if (p.id === currentUser.id && role !== "admin") {
            toast(
              "Nu îți poți retrage propriul rol de admin din acest panou",
              true,
            );
            return;
          }
          btn.disabled = true;
          btn.textContent = "Se salvează…";
          const { error } = await sb
            .from("profiles")
            .update({ role, nume, updated_at: new Date().toISOString() })
            .eq("id", p.id);
          btn.disabled = false;
          btn.textContent = "Salvează";
          if (error) {
            toast("Eroare: " + error.message, true);
            return;
          }
          toast("Salvat");
          if (p.id === currentUser.id) {
            currentProfile.role = role;
            currentProfile.nume = nume;
            renderShellUserInfo();
          }
        });
        const delBtn = row.querySelector(".udel");
        if (!delBtn.disabled) {
          delBtn.addEventListener("click", async () => {
            if (
              !confirm(
                `Ștergi definitiv contul ${p.email}? Acțiunea nu poate fi anulată.`,
              )
            )
              return;
            delBtn.disabled = true;
            delBtn.textContent = "Se șterge…";
            const { data, error } = await sb.functions.invoke("delete-user", {
              body: { target_id: p.id },
            });
            const errMsg = error?.message || data?.error;
            if (errMsg) {
              toast("Eroare la ștergere: " + errMsg, true);
              delBtn.disabled = false;
              delBtn.textContent = "Șterge";
              return;
            }
            toast("Cont șters");
            row.remove();
          });

    <p class="authnote" style="margin-bottom:16px">${isRecovery ? "Apasă butonul de mai jos pentru a continua resetarea parolei." : "Apasă butonul de mai jos pentru a-ți confirma adresa de email."}</p>

        document

      async function loadProfileAndRender() {
        const { data, error } = await sb
          .from("profiles")
          .select("*")
          .eq("id", currentUser.id)
          .maybeSingle();
        if (error)
          toast("Eroare la încărcarea profilului: " + error.message, true);
        currentProfile = data || null;
        if (!currentProfile || !currentProfile.role) {
          renderPending();
          return;
        }
        document.getElementById("authScreen").innerHTML = "";
        document.getElementById("appRoot").style.display = "";
        renderShellUserInfo();
        DB = await load();
        setBaseline();
        _lastSync = Date.now();
        const miss = missingTables();
        if (miss.length) {
          document.getElementById("wrap").innerHTML =
            `<div class="res-note warn" style="margin:30px"><span><b>Lipsesc tabelele Supabase necesare versiunii v20:</b> ${miss.map(esc).join(", ")}.<br>Rulează scriptul SQL de migrare (supabase-v20.sql), apoi reîncarcă pagina. Nu s-a salvat nimic, pentru a nu suprascrie datele existente.</span></div>`;
          return;

        migrate();
        migrateV19();
        migrateV20();
        ensureUniqueIds();
        invalidateCalc();

      sb.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") {
          recoveryMode = true;
          renderResetPassword();
          return;
        }
        if (event === "SIGNED_OUT") {
          currentUser = null;
          currentProfile = null;
          renderAuthScreen();
          return;
        }
        if (session && !recoveryMode) {
          const sameUser = currentUser && currentUser.id === session.user.id;
          currentUser = session.user;
          if (sameUser && currentProfile) return;
          loadProfileAndRender();
        }
      });
      (async function initAuth() {
        const tokenHash = new URLSearchParams(window.location.search).get(
          "token_hash",
        );
        const otpType = new URLSearchParams(window.location.search).get("type");
        if (tokenHash && otpType) {
          renderConfirmScreen(tokenHash, otpType);
          return;
        }
        const {
          data: { session },
        } = await sb.auth.getSession();
        if (session) {
          currentUser = session.user;
          await loadProfileAndRender();
        } else renderAuthScreen();
      })();
    </script>
  </body>
</html>
