<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geeli Import · ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root {
        --bg: #f4f5f6;
        --card: #ffffff;
        --text: #1c2126;
        --text-2: #383d43;
        --muted: #7a828a;
        --muted-2: #a6adb4;
        --border: #e9ecef;
        --border-2: #d8dce0;
        --primary: #00a876;
        --primary-d: #008c63;
        --primary-soft: #e3f8f0;
        --blue: #2490ef;
        --blue-soft: #e7f3fe;
        --green: #28a745;
        --green-soft: #e3f6e9;
        --orange: #f0932b;
        --orange-soft: #fdeedd;
        --red: #e24c4c;
        --red-soft: #fbe7e7;
        --gray: #8d99a6;
        --gray-soft: #edeff1;
        --purple: #7b6fe6;
        --purple-soft: #eeecfb;
        --font: "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        --mono:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --shadow:
          0 1px 2px rgba(28, 33, 38, 0.05), 0 1px 3px rgba(28, 33, 38, 0.06);
        --shadow-lg: 0 12px 40px rgba(28, 33, 38, 0.16);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: 13px;
        color: var(--text);
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-2);
        border-radius: 20px;
        border: 3px solid var(--bg);
      }
      .mono {
        font-family: var(--mono);
        font-feature-settings: "tnum";
      }
      a {
        color: var(--blue);
        text-decoration: none;
      }

      .app {
        display: flex;
        min-height: 100vh;
      }
      .scrim {
        display: none;
      }
      .sidebar {
        width: 228px;
        flex: none;
        background: var(--card);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .sb-brand {
        padding: 16px 16px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid var(--border);
      }
      .sb-mark {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--primary), var(--primary-d));
        display: grid;
        place-items: center;
        flex: none;
      }
      .sb-mark svg {
        width: 19px;
        height: 19px;
      }
      .sb-brand b {
        font-weight: 800;
        font-size: 14px;
        letter-spacing: -0.2px;
        display: block;
        line-height: 1.1;
      }
      .sb-brand span {
        font-size: 11px;
        color: var(--muted);
        font-weight: 600;
      }
      .sb-group {
        padding: 12px 10px 4px;
      }
      .sb-group-t {
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted-2);
        padding: 6px 10px 8px;
      }
      .sb-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 10px;
        border-radius: 7px;
        color: var(--text-2);
        font-weight: 500;
        font-size: 13px;
        margin-bottom: 1px;
        text-align: left;
        transition: 0.1s;
      }
      .sb-item svg {
        width: 16px;
        height: 16px;
        flex: none;
        color: var(--muted);
        stroke-width: 2;
      }
      .sb-item:hover {
        background: var(--gray-soft);
      }
      .sb-item.active {
        background: var(--primary-soft);
        color: var(--primary-d);
        font-weight: 600;
      }
      .sb-item.active svg {
        color: var(--primary-d);
      }
      .sb-count {
        margin-left: auto;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        font-family: var(--mono);
      }
      .sb-foot {
        margin-top: auto;
        padding: 12px 10px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 8px;
      }
      .sb-foot button {
        flex: 1;
        padding: 7px;
        border-radius: 7px;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
        background: var(--gray-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      .sb-foot button:hover {
        color: var(--text);
      }
      .sb-foot svg {
        width: 13px;
        height: 13px;
      }

      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .navbar {
        background: var(--card);
        border-bottom: 1px solid var(--border);
        height: 48px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        gap: 14px;
        position: sticky;
        top: 0;
        z-index: 30;
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--muted);
      }
      .breadcrumb .crumb {
        cursor: pointer;
      }
      .breadcrumb .crumb:hover {
        color: var(--text);
      }
      .breadcrumb .sep {
        color: var(--muted-2);
      }
      .breadcrumb .cur {
        color: var(--text);
        font-weight: 600;
      }
      .nav-search {
        margin-left: auto;
        position: relative;
        width: 230px;
      }
      .nav-search svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 15px;
        height: 15px;
        color: var(--muted-2);
      }
      .nav-search input {
        width: 100%;
        padding: 7px 10px 7px 32px;
        border: 1px solid var(--border-2);
        border-radius: 7px;
        background: var(--bg);
        font-size: 12.5px;
      }
      .nav-search input:focus {
        outline: none;
        border-color: var(--primary);
        background: #fff;
      }

      .wrap {
        padding: 20px 24px 70px;
        flex: 1;
        overflow-y: auto;
        width: 100%;
      }
      .page-h {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }
      .page-h h1 {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      .page-h {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .page-h .sp {
        margin-left: auto;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 13px;
        border-radius: 7px;
        font-weight: 600;
        font-size: 12.5px;
        white-space: nowrap;
        transition: 0.12s;
        border: 1px solid transparent;
      }
      .btn svg {
        width: 15px;
        height: 15px;
        stroke-width: 2.2;
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--primary-d);
      }
      .btn-default {
        background: var(--card);
        color: var(--text);
        border-color: var(--border-2);
      }
      .btn-default:hover {
        background: var(--gray-soft);
      }
      .btn-sm {
        padding: 5px 10px;
        font-size: 12px;
      }
      .btn-link {
        color: var(--blue);
        font-weight: 600;
        padding: 4px 6px;
      }
      .btn-link:hover {
        text-decoration: underline;
      }
      .authwrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: radial-gradient(circle at 20% 20%, #1b2430 0%, #0e1318 65%);
      }
      .authcard {
        width: 100%;
        max-width: 400px;
        background: var(--card);
        border-radius: 16px;
        box-shadow: var(--shadow-lg);
        padding: 28px;
      }
      .authbrand {
        text-align: center;
        margin-bottom: 22px;
        color: #fff;
      }
      .authbrand b {
        font-size: 19px;
        display: block;
        margin-bottom: 2px;
        letter-spacing: 0.2px;
      }
      .authbrand span {
        font-size: 11.5px;
        color: #9aa5b1;
      }
      .authtabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 18px;
      }
      .authtab {
        padding: 8px 10px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .authtab.active {
        color: var(--primary);
        border-color: var(--primary);
      }
      .authform {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .authmsg {
        font-size: 12.5px;
        text-align: center;
        min-height: 16px;
      }
      .authmsg.err {
        color: var(--red);
      }
      .authmsg.ok {
        color: var(--primary-d);
      }
      .authnote {
        font-size: 11.5px;
        color: var(--muted);
        text-align: center;
      }
      .pendingwrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--bg);
      }
      .pendingcard {
        max-width: 420px;
        text-align: center;
        background: var(--card);
        border-radius: 16px;
        box-shadow: var(--shadow-lg);
        padding: 32px;
      }
      .sb-user {
        padding: 9px 14px;
        font-size: 11.5px;
        color: var(--muted);
        border-top: 1px solid var(--border);
        line-height: 1.4;
      }
      .sb-user b {
        color: var(--text);
        font-weight: 600;
      }
      .role-tag {
        display: inline-block;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.3px;
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--primary-soft);
        color: var(--primary-d);
        margin-top: 2px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }
      .ncard {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 15px 16px;
        box-shadow: var(--shadow);
      }
      .ncard .lbl {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
        margin-bottom: 9px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .ncard .lbl .ic {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        display: grid;
        place-items: center;
      }
      .ncard .lbl .ic svg {
        width: 14px;
        height: 14px;
        stroke-width: 2;
      }
      .ncard .val {
        font-size: 23px;
        font-weight: 800;
        letter-spacing: -0.8px;
        font-family: var(--mono);
      }
      .ncard .foot {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 4px;
        font-weight: 500;
      }

      .doc {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
        overflow: hidden;
        margin-bottom: 18px;
      }
      .doc-h {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .doc-h h2 {
        font-size: 14px;
        font-weight: 700;
      }
      .doc-h .cnt {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
        background: var(--gray-soft);
        padding: 1px 8px;
        border-radius: 20px;
        font-family: var(--mono);
      }
      .doc-h .tools {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .lfilter {
        padding: 6px 10px;
        border: 1px solid var(--border-2);
        border-radius: 7px;
        background: var(--bg);
        font-weight: 500;
        font-size: 12px;
      }
      .lfilter:focus {
        outline: none;
        border-color: var(--primary);
      }

      .lv-wrap {
        overflow-x: auto;
      }
      table.lv {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      table.lv thead th {
        text-align: left;
        padding: 9px 14px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        background: var(--card);
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      table.lv thead th.r {
        text-align: right;
      }
      table.lv tbody td {
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      table.lv tbody tr:last-child td {
        border-bottom: none;
      }
      table.lv tbody tr {
        cursor: pointer;
      }
      table.lv tbody tr:hover {
        background: var(--bg);
      }
      .lv .id-link {
        color: var(--blue);
        font-weight: 600;
        font-family: var(--mono);
      }
      .lv .id-link:hover {
        text-decoration: underline;
      }
      td.n {
        font-family: var(--mono);
        font-weight: 500;
        text-align: right;
      }
      .muted {
        color: var(--muted);
      }
      .sub {
        font-size: 11px;
        color: var(--muted);
        font-weight: 500;
      }

      .ind {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .ind::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .ind.gray {
        color: var(--gray);
      }
      .ind.green {
        color: var(--green);
      }
      .ind.orange {
        color: var(--orange);
      }
      .ind.red {
        color: var(--red);
      }
      .ind.blue {
        color: var(--blue);
      }
      .ind.purple {
        color: var(--purple);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 20px;
      }
      .pill.gray {
        background: var(--gray-soft);
        color: #5c6670;
      }
      .pill.green {
        background: var(--green-soft);
        color: #1d7a32;
      }
      .pill.blue {
        background: var(--blue-soft);
        color: #1b6fb8;
      }
      .pill.orange {
        background: var(--orange-soft);
        color: #b4651a;
      }

      /* FORM */
      .form-top {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 14px 18px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .form-top .ft-title {
        font-size: 18px;
        font-weight: 700;
        font-family: var(--mono);
        letter-spacing: -0.3px;
      }
      .form-top .ft-actions {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .form-layout {
        display: grid;
        grid-template-columns: 1fr 268px;
        gap: 16px;
        align-items: start;
      }
      .form-main {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }

      .section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .section-h {
        padding: 11px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 12.5px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .section-h .sh-ic {
        color: var(--primary);
      }
      .section-h .sh-ic svg {
        width: 15px;
        height: 15px;
        stroke-width: 2;
      }
      .section-h .sh-note {
        margin-left: auto;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted-2);
      }
      .section-b {
        padding: 16px;
        overflow-x: auto;
      }
      .fgrid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 13px;
      }
      .f {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .f.c2 {
        grid-column: span 2;
      }
      .f.c3 {
        grid-column: span 3;
      }
      .f.c4 {
        grid-column: span 4;
      }
      .f label {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .f label .u {
        font-size: 9.5px;
        font-weight: 700;
        color: var(--muted-2);
        background: var(--gray-soft);
        padding: 1px 5px;
        border-radius: 4px;
        letter-spacing: 0.3px;
      }
      .f input,
      .f select {
        padding: 7px 10px;
        border: 1px solid var(--border-2);
        border-radius: 6px;
        background: var(--card);
        font-weight: 500;
      }
      .f input:focus,
      .f select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px var(--primary-soft);
      }
      .f input.calc {
        background: var(--bg);
        color: var(--text-2);
        font-weight: 700;
        font-family: var(--mono);
        border-style: dashed;
      }
      .f.hl input {
        border-color: var(--primary);
        background: var(--primary-soft);
        font-weight: 700;
      }
      .inp-r {
        text-align: right;
        font-family: var(--mono);
      }

      /* child table serii */
      .grid-tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      .grid-tbl thead th {
        text-align: left;
        padding: 8px 10px;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--muted);
        background: var(--bg);
        border: 1px solid var(--border);
        text-transform: uppercase;
        letter-spacing: 0.3px;
        white-space: nowrap;
      }
      .grid-tbl td {
        padding: 0;
        border: 1px solid var(--border);
      }
      .grid-tbl td.idx {
        width: 34px;
        text-align: center;
        color: var(--muted-2);
        font-family: var(--mono);
        font-size: 11px;
        background: var(--bg);
      }
      .grid-tbl td.rm {
        width: 36px;
        text-align: center;
      }
      .grid-tbl input,
      .grid-tbl select {
        width: 100%;
        border: none;
        background: transparent;
        padding: 8px 10px;
        font-weight: 500;
      }
      .grid-tbl input:focus,
      .grid-tbl select:focus {
        outline: 2px solid var(--primary);
        outline-offset: -2px;
        background: #fff;
        border-radius: 4px;
      }
      .grid-rm {
        width: 24px;
        height: 24px;
        border-radius: 5px;
        display: inline-grid;
        place-items: center;
        color: var(--muted-2);
      }
      .grid-rm:hover {
        background: var(--red-soft);
        color: var(--red);
      }
      .grid-rm svg {
        width: 14px;
        height: 14px;
      }
      .grid-add {
        margin-top: 10px;
        font-size: 12px;
        font-weight: 600;
        color: var(--primary-d);
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .grid-add svg {
        width: 14px;
        height: 14px;
      }

      /* rezultat cost intrare */
      .res-note {
        padding: 10px 12px;
        background: var(--blue-soft);
        border-radius: 8px;
        font-size: 11.5px;
        color: #1b6fb8;
        font-weight: 500;
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
        line-height: 1.5;
      }
      .res-note svg {
        width: 15px;
        height: 15px;
        flex: none;
        margin-top: 1px;
      }
      .result-tbl {
        width: 100%;
        border-collapse: collapse;

      async function loadTable(table) {
        const { data, error } = await sb
          .from(table)
          .select("id,data")
          .order("id");
        if (error) {
          toast("Eroare la încărcare din Supabase", true);
          return [];
        }
        return (data || []).map((r) => ({ ...r.data, id: r.id }));
      }

          loadTable("oferte_producatori"),

        return { offers, suppliers, orders };

      async function syncTable(table, rows) {
        const ids = rows.map((r) => r.id);
        try {
          if (rows.length)
            await sb
              .from(table)
              .upsert(rows.map((r) => ({ id: r.id, data: r })));
          if (ids.length)
            await sb
              .from(table)
              .delete()
              .not(
                "id",
                "in",
                "(" +
                  ids.map((id) => `"${id.replace(/"/g, "")}"`).join(",") +
                  ")",
              );
          else await sb.from(table).delete().neq("id", "");
        } catch (e) {
          toast("Eroare la salvare online — verifică conexiunea", true);
        }
      }

      function fileUrl(id) {

      async function fileAdd(dataUrl, name, type) {
        try {
          const path =
            uid("F") +
            "-" +
            (name || "fisier").replace(/[^a-zA-Z0-9.\-_]/g, "_");
          const blob = await (await fetch(dataUrl)).blob();
          const { error } = await sb.storage
            .from(FILES_BUCKET)
            .upload(path, blob, {
              contentType: type || blob.type || "application/octet-stream",
              upsert: true,
            });
          if (error) throw error;
          return {
            id: path,
            name: name || "fișier",
            type: type || "",
            url: fileUrl(path),
          };
        } catch (e) {
          toast("Nu am putut salva fișierul");
          return null;
        }
      }

        if (rec && rec.id) {

      /* ===== CALCUL COST REAL (miezul) ===== */
      function compute(o) {
        const cU = +o.cursUSD || 0,
          cE = +o.cursEUR || 0;
        const cFOB =
          o.valutaFOB === "USD" ? cU : o.valutaFOB === "EUR" ? cE : 1;
        const L = {
          tFobPod: (+o.log.tFobPodUSD || 0) * cU,
          asig: (+o.log.asigUSD || 0) * cU,
          tPodDoor: (+o.log.tPodDoorEUR || 0) * cE,
          prestatii: (+o.log.prestatiiEUR || 0) * cE,
          taxeDoc: (+o.log.taxeDocEUR || 0) * cE,
          t1: (+o.log.t1EUR || 0) * cE,
          careiVama: +o.log.careiVamaLEI || 0,
        };
        const logTotal =
          L.tFobPod +
          L.asig +
          L.tPodDoor +
          L.prestatii +
          L.taxeDoc +
          L.t1 +
          L.careiVama;
        const nrBuc = +o.nrBuc || 0;
        const valoareFOB = nrBuc * (+o.pretBuc || 0);
        const totalTranse =
          (+o.transe.avans || 0) +
          (+o.transe.rest || 0) +
          (+o.transe.preVapor || 0);
        // pe bucată, în LEI
        const produsLEI = (+o.pretBuc || 0) * cFOB;
        const transportBuc = nrBuc ? logTotal / nrBuc : 0;
        const bazaVama = produsLEI + transportBuc;
        const taxaVamala = (bazaVama * (+o.cotaVama || 0)) / 100;
        const bazaTVA = produsLEI + taxaVamala + transportBuc;
        const tvaVamal = (bazaTVA * (+o.cotaTVA || 0)) / 100;
        const totalCuTVA = produsLEI + transportBuc + taxaVamala + tvaVamal;
        const costNet = produsLEI + transportBuc + taxaVamala; // TVA deductibil → cost real
        const vanzareB2B = costNet * (1 + (+o.adaos || 0) / 100);
        const marjaBuc = vanzareB2B - costNet;
        return {
          cFOB,
          L,
          logTotal,
          valoareFOB,
          totalTranse,
          produsLEI,
          transportBuc,
          taxaVamala,
          tvaVamal,
          totalCuTVA,
          costNet,
          vanzareB2B,
          marjaBuc,
          costTotalNet: costNet * nrBuc,
          vanzareTotala: vanzareB2B * nrBuc,
          marjaTotala: marjaBuc * nrBuc,
          tvaTotal: tvaVamal * nrBuc,
          valoareTVA_LEI: produsLEI * nrBuc,
        };
      }

      /* ===== IMPORT SERII DIN EXCEL / CSV ===== */
      function _norm(s) {
        return (s == null ? "" : "" + s)
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .trim();
      }
      function _colIdx(ref) {
        const m = (ref || "").match(/^([A-Z]+)/);
        if (!m) return 0;
        let n = 0;
        for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
        return n - 1;
      }
      async function xlsxToRows(arrayBuffer) {
        const u8 = new Uint8Array(arrayBuffer);
        const dv = new DataView(u8.buffer);
        let eocd = -1;
        for (
          let i = u8.length - 22;
          i >= 0 && i > u8.length - 22 - 65536;
          i--
        ) {
          if (dv.getUint32(i, true) === 0x06054b50) {
            eocd = i;
            break;
          }
        }
        if (eocd < 0) throw new Error("ZIP invalid");
        const cdCount = dv.getUint16(eocd + 10, true);
        let p = dv.getUint32(eocd + 16, true);
        const files = {};
        for (let n = 0; n < cdCount; n++) {
          if (dv.getUint32(p, true) !== 0x02014b50) break;
          const method = dv.getUint16(p + 10, true),
            compSize = dv.getUint32(p + 20, true);
          const nameLen = dv.getUint16(p + 28, true),
            extraLen = dv.getUint16(p + 30, true),
            commentLen = dv.getUint16(p + 32, true);
          const localOff = dv.getUint32(p + 42, true);
          const name = new TextDecoder().decode(
            u8.subarray(p + 46, p + 46 + nameLen),
          );
          files[name] = { method, compSize, localOff };
          p += 46 + nameLen + extraLen + commentLen;
        }
        async function extract(name) {
          const f = files[name];
          if (!f) return null;
          const lh = f.localOff;
          const nameLen = dv.getUint16(lh + 26, true),
            extraLen = dv.getUint16(lh + 28, true);
          const start = lh + 30 + nameLen + extraLen;
          const comp = u8.subarray(start, start + f.compSize);
          if (f.method === 0) return new TextDecoder().decode(comp);
          const ds = new DecompressionStream("deflate-raw");
          const w = ds.writable.getWriter();
          w.write(comp);
          w.close();
          const ab = await new Response(ds.readable).arrayBuffer();
          return new TextDecoder().decode(new Uint8Array(ab));
        }
        let shared = [];
        const ssXml = await extract("xl/sharedStrings.xml");
        if (ssXml) {
          const doc = new DOMParser().parseFromString(ssXml, "application/xml");
          shared = [...doc.getElementsByTagName("si")].map((si) =>
            [...si.getElementsByTagName("t")]
              .map((t) => t.textContent)
              .join(""),
          );
        }
        // gasesc prima foaie
        let sheetName = "xl/worksheets/sheet1.xml";
        if (!files[sheetName]) {
          const k = Object.keys(files).find((f) =>
            /xl\/worksheets\/.*\.xml$/.test(f),
          );
          if (k) sheetName = k;
        }
        const shXml = await extract(sheetName);
        if (!shXml) throw new Error("Fără foaie de calcul");
        const doc = new DOMParser().parseFromString(shXml, "application/xml");
        const rows = [];
        for (const row of doc.getElementsByTagName("row")) {
          const cells = [];
          for (const c of row.getElementsByTagName("c")) {
            const col = _colIdx(c.getAttribute("r"));
            const t = c.getAttribute("t");
            const vEl = c.getElementsByTagName("v")[0];
            let val = "";
            if (t === "s" && vEl) val = shared[+vEl.textContent] || "";
            else if (t === "inlineStr" || t === "str") {
              const tEl = c.getElementsByTagName("t")[0];
              val = tEl ? tEl.textContent : vEl ? vEl.textContent : "";
            } else if (vEl) val = vEl.textContent;
            cells[col] = val;
          }
          rows.push(cells);
        }
        return rows;
      }
      function parseCSV(text) {
        const rows = [];
        const sep =
          (text.split("\n")[0].match(/;/g) || []).length >
          (text.split("\n")[0].match(/,/g) || []).length
            ? ";"
            : ",";
        text.split(/\r?\n/).forEach((line) => {
          if (!line.trim()) return;
          const cells = [];
          let cur = "",
            q = false;
          for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (q) {
              if (ch === '"') {
                if (line[i + 1] === '"') {
                  cur += '"';
                  i++;
                } else q = false;
              } else cur += ch;
            } else {
              if (ch === '"') q = true;
              else if (ch === sep) {
                cells.push(cur);
                cur = "";
              } else cur += ch;
            }
          }
          cells.push(cur);
          rows.push(cells);
        });
        return rows;
      }
      function importSeriiFromRows(rows) {
        const clean = rows.filter(
          (r) => r && r.some((x) => x != null && ("" + x).trim()),
        );
        if (clean.length < 1) return toast("Fișier gol");
        const header = clean[0].map(_norm);
        const find = (...keys) =>
          header.findIndex((h) => keys.some((k) => h.includes(k)));
        const iModel = find("model"),
          iSasiu = find("sasiu", "chassis", "vin", "caroserie"),
          iMotor = find("motor", "engine"),
          iCuloare = find("culoare", "color", "culo");
        const hasHeader =
          iModel >= 0 || iSasiu >= 0 || iMotor >= 0 || iCuloare >= 0;
        const o = cur();
        let added = 0;
        const start = hasHeader ? 1 : 0;
        const g = (row, idx, fallback) => {
          const v =
            (idx >= 0 ? row[idx] : fallback != null ? row[fallback] : "") || "";
          return ("" + v).trim();
        };
        for (let r = start; r < clean.length; r++) {
          const row = clean[r];
          o.serii.push({
            model: g(row, iModel, 0),
            sasiu: g(row, iSasiu, 1),
            motor: g(row, iMotor, 2),
            culoare: g(row, iCuloare, 3),
          });
          added++;
        }
        save();
        refreshSerii();
        toast(
          added +
            " serii importate din " +
            (hasHeader ? "fișier" : "fișier (fără antet)"),
        );
      }
      function importSerii(files) {
        if (!files.length) return;
        const f = files[0];
        const nm = f.name.toLowerCase();
        const o = cur();
        const doImport = (fn) => {
          if (o.serii.length && o.serii.some((s) => s.sasiu || s.motor)) {
            if (
              !confirm(
                "Adaug seriile importate la cele existente?\n(OK = adaugă, Anulează = renunță)",
              )
            )
              return;
          }
          fn();
        };
        if (nm.endsWith(".csv")) {
          const r = new FileReader();
          r.onload = (e) => {
            try {
              doImport(() => importSeriiFromRows(parseCSV(e.target.result)));
            } catch (err) {
              console.error(err);
              toast("Eroare la citirea CSV");
            }
          };
          r.readAsText(f);
        } else {
          const r = new FileReader();
          r.onload = async (e) => {
            try {
              const rows = await xlsxToRows(e.target.result);
              doImport(() => importSeriiFromRows(rows));
            } catch (err) {
              console.error(err);
              toast("Excel necitibil — salvează ca .csv și reîncearcă");
            }
          };
          r.readAsArrayBuffer(f);
        }
      }

      /* ===== COMPARAȚIE MULTI-FURNIZOR ===== */
      function vCompare() {
        crumb([
          { t: "Oferte producător", go: "go('offers')" },
          { t: "Comparație" },
        ]);
        const cats = [
          ...new Set(DB.offers.map((o) => o.categorie).filter(Boolean)),
        ];
        let list = DB.offers.filter(
          (o) => !state.compareCat || o.categorie === state.compareCat,
        );
        let h = `<div class="page-h"><h1>Comparație oferte</h1><div class="sp"><select class="lfilter" onchange="state.compareCat=this.value;vCompare()"><option value="">Toate categoriile</option>${cats.map((c) => `<option ${state.compareCat === c ? "selected" : ""}>${c}</option>`).join("")}</select><button class="btn btn-default" onclick="go('offers')">Înapoi</button></div></div>`;
        if (list.length < 1) {
          h += `<div class="empty" style="padding:60px"><p>Nicio ofertă de comparat</p></div>`;
          document.getElementById("wrap").innerHTML = h;
          return;
        }
        // rânduri de comparație; best evidențiat
        const rows = [];
        const bp = (o) => {
          const b = bestPrice(o);
          return b ? b.pret : null;
        };
        rows.push({
          lbl: "Preț de la",
          get: (o) => {
            const b = bestPrice(o);
            return b ? val(b.pret, b.valuta) : "—";
          },
          best: "min",
          raw: (o) => bp(o),
        });
        rows.push({
          lbl: "MOQ",
          get: (o) => o.moq || "—",
          best: "min",
          raw: (o) => +o.moq || null,
        });
        rows.push({
          lbl: "Timp producție",
          get: (o) => (o.timpProductieZile || "—") + " zile",
          best: "min",
          raw: (o) => +o.timpProductieZile || null,
        });
        rows.push({
          lbl: "Timp livrare",
          get: (o) => (o.timpLivrareZile || "—") + " zile",
          best: "min",
          raw: (o) => +o.timpLivrareZile || null,
        });
        rows.push({
          lbl: "Timp total",
          get: (o) =>
            (+o.timpProductieZile || 0) + (+o.timpLivrareZile || 0) + " zile",
          best: "min",
          raw: (o) =>
            (+o.timpProductieZile || 0) + (+o.timpLivrareZile || 0) || null,
        });
        rows.push({
          lbl: "Conformități",
          get: (o) =>
            o.conformitati.filter((c) => c.status !== "lipsa").length +
            "/" +
            o.conformitati.length,
          best: "max",
          raw: (o) => o.conformitati.filter((c) => c.status !== "lipsa").length,
        });
        rows.push({
          lbl: "CTC trecute",
          get: (o) =>
            o.ctc.filter((c) => c.rezultat === "OK").length +
            "/" +
            o.ctc.length,
          best: "max",
          raw: (o) => o.ctc.filter((c) => c.rezultat === "OK").length,
        });
        rows.push({
          lbl: "Conformitate EEC",
          get: (o) => {
            const s = eecStats(o);
            return (
              s.conf + "/" + s.tot + (s.neconf ? ` (${s.neconf} nec.)` : "")
            );
          },
          best: "max",
          raw: (o) => eecStats(o).conf,
        });
        rows.push({
          lbl: "Poze",
          get: (o) => o.poze.length,
          best: "max",
          raw: (o) => o.poze.length,
        });
        rows.push({
          lbl: "Mostră",
          get: (o) => MOSTRA_LBL[o.mostraStatus] || "—",
          best: null,
        });
        EVAL_CRITERIA.forEach((c, ci) =>
          rows.push({
            lbl: c.criteriu,
            get: (o) => {
              const e = o.evaluare?.[ci];
              return e && e.nota ? e.nota + "/5" : "—";
            },
            best: "max",
            raw: (o) => o.evaluare?.[ci]?.nota || null,
            eval: true,
          }),
        );
        rows.push({
          lbl: "SCOR COMPOZIT",
          get: (o) => computeScore(o).toFixed(1) + "/5",
          best: "max",
          raw: (o) => computeScore(o),
          strong: true,
        });

        h += `<div class="doc"><div class="lv-wrap"><table class="lv"><thead><tr><th style="min-width:150px">Criteriu</th>${list.map((o) => `<th style="min-width:150px"><span class="id-link" onclick="openOffer('${o.id}')">${o.id}</span><div class="sub" style="font-weight:600;color:var(--text)">${o.producator}</div><div class="sub">${o.produs}</div></th>`).join("")}</tr></thead><tbody>`;
        rows.forEach((r) => {
          let best = null;
          if (r.best && r.raw) {
            const vals = list.map(r.raw).filter((v) => v != null);
            if (vals.length)
              best = r.best === "min" ? Math.min(...vals) : Math.max(...vals);
          }
          h += `<tr${r.eval ? ' style="background:var(--bg)"' : ""}><td class="${r.strong ? "cell-strong" : ""}" style="font-weight:${r.strong ? 800 : 600};${r.strong ? "font-size:13px" : ""}">${r.lbl}</td>${list
            .map((o) => {
              const isBest = best != null && r.raw && r.raw(o) === best;
              return `<td class="${r.strong ? "" : "n"}" style="${isBest ? "background:var(--primary-soft);color:var(--primary-d);font-weight:800" : ""};${r.strong ? "font-family:var(--mono);font-weight:800;font-size:14px" : ""}">${r.get(o)}${isBest && !r.strong ? " ★" : ""}</td>`;
            })
            .join("")}</tr>`;
        });
        h += `<tr><td></td>${list.map((o) => `<td>${o.orderId ? `<span class="pill blue">Comandat</span>` : `<button class="btn btn-primary btn-sm" onclick="offerToOrder('${o.id}')">Alege →</button>`}</td>`).join("")}</tr>`;
        h += `</tbody></table></div></div><div class="res-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>Celulele verzi cu ★ marchează cea mai bună ofertă pe fiecare criteriu. Scorul compozit ține cont de ponderi.</span></div>`;
        document.getElementById("wrap").innerHTML = h;
      }

      /* acțiuni ofertă */
      async function newOffer() {
        const id = await nextId("OF", true);
        DB.offers.push(blankOffer(id));
        save();
        openOffer(id);
        toast("Ofertă creată");
      }
      function delOffer(id) {
        openModal(
          "Șterge oferta",
          `<p style="font-weight:500">Sigur ștergi <b>${id}</b>?</p>`,
          `<button class="btn btn-default" onclick="closeModal()">Renunță</button><button class="btn btn-primary" style="background:var(--red)" onclick="confirmDelOffer('${id}')">Șterge</button>`,
        );
      }
      function confirmDelOffer(id) {
        DB.offers = DB.offers.filter((x) => x.id !== id);
        save();
        closeModal();
        go("offers");
        toast("Ștearsă");
      }
      async function offerToOrder(id) {
        const of = DB.offers.find((x) => x.id === id);
        const b = bestPrice(of);
        if (
          !DB.suppliers.some((s) => s.nume === of.producator) &&
          of.producator
        )
          DB.suppliers.push({
            id: await nextId("FURN", false),
            nume: of.producator,
            tara: "China",
            oras: "",
            contact: "",
            email: "",
            incoterms: "FOB",
          });
        const oid = await nextId("IMP", true);
        const ord = Object.assign(blankOrder(oid), {
          supplier: of.producator,
          produs: of.produs,
          tipAsamblare: of.tipAsamblare,
          pretBuc: b ? +b.pret : 0,
          valutaFOB: b ? b.valuta : "USD",
          nrBuc: b ? +b.cantMin : 0,
        });
        DB.orders.push(ord);
        of.orderId = oid;
        of.status = "Comandat";
        save();
        toast("Comandă " + oid + " creată din ofertă");
        openDoc(oid);
      }

      /* ===== MODAL / EXPORT / TOAST ===== */
      function openModal(t, b, f) {
        document.getElementById("modal").style.maxWidth = "";
        document.getElementById("modal").innerHTML =
          `<div class="modal-h"><h3>${t}</h3><button class="icon-btn" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="modal-b">${b}</div><div class="modal-f">${f || ""}</div>`;
        document.getElementById("overlay").classList.add("open");
      }
      function closeModal() {
        document.getElementById("overlay").classList.remove("open");
      }
      document.getElementById("overlay").addEventListener("click", (e) => {
        if (e.target.id === "overlay") closeModal();
      });
      function exportBackup() {
        toast("Se pregătește backup-ul…");
        const a = document.createElement("a");
        a.download = "geeli_import_" + today() + ".json";
        a.href =
          "data:application/json;charset=utf-8," +
          encodeURIComponent(JSON.stringify(DB, null, 2));
        a.click();
        toast("Backup salvat (fișierele rămân în Supabase Storage)");
      }
      function importBackup() {
        const inp = document.createElement("input");
        inp.type = "file";
        inp.accept = ".json";
        inp.onchange = (e) => {
          const fr = new FileReader();
          fr.onload = async () => {
            try {
              const obj = JSON.parse(fr.result);
              delete obj._files;
              DB = obj;
              save();
              go("dashboard");
              toast("Backup încărcat");
            } catch (err) {
              toast("Fișier invalid");
            }
          };
          fr.readAsText(e.target.files[0]);
        };
        inp.click();
      }
      let tT;
      function toast(m, isErr) {
        const t = document.getElementById("toast");
        t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>${m}`;
        t.style.background = isErr ? "var(--red)" : "var(--text)";
        t.querySelector("svg").style.color = isErr ? "#fff" : "var(--primary)";
        t.classList.add("show");
        clearTimeout(tT);
        tT = setTimeout(() => t.classList.remove("show"), 2600);
      }

      /* ===== ADMINISTRARE UTILIZATORI (rol admin) ===== */
      function renderShellUserInfo() {
        const el = document.getElementById("sbUserInfo");
        if (!el || !currentProfile) return;
        const roleLbl =
          currentProfile.role === "admin"
            ? "Admin"
            : currentProfile.role === "user"
              ? "User"
              : "Fără rol";
        el.innerHTML = `<b>${esc(currentProfile.nume || currentUser.email)}</b><br>${esc(currentUser.email)}<br><span class="role-tag">${roleLbl}</span><br><button onclick="doLogout()" style="margin-top:8px;width:100%;padding:7px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--gray-soft);display:flex;align-items:center;justify-content:center;gap:5px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>Deconectare</button>`;
        const g = document.getElementById("sbAdminGroup");
        if (g) g.style.display = currentProfile.role === "admin" ? "" : "none";
      }
      async function vUsers() {
        const wrap = document.getElementById("wrap");
        if (!currentProfile || currentProfile.role !== "admin") {
          wrap.innerHTML = `<div class="empty" style="padding:60px"><p>Nu ai acces la această secțiune</p></div>`;
          return;
        }
        wrap.innerHTML = `<div class="page-h"><h1>Administrare utilizatori</h1></div><div class="doc"><div class="lv-wrap"><table class="lv"><thead><tr><th>Nr</th><th>Email</th><th>Rol</th><th>Nume</th><th></th></tr></thead><tbody id="userRows"><tr><td colspan="5" style="text-align:center;padding:30px;color:var(--muted)">Se încarcă…</td></tr></tbody></table></div></div>`;
        const { data: profiles, error } = await sb
          .from("profiles")
          .select("*")
          .order("created_at", { ascending: false });
        if (error) {
          document.getElementById("userRows").innerHTML =
            `<tr><td colspan="5" style="color:var(--red);padding:16px">Eroare: ${esc(error.message)}</td></tr>`;
          return;
        }
        const tbody = document.getElementById("userRows");
        tbody.innerHTML = profiles.map((p, i) => userRow(p, i + 1)).join("");
        profiles.forEach((p) => bindUserRow(p));
      }
      function userRow(p, nr) {
        return `<tr data-urow="${p.id}">
    <td class="n">${nr}</td>
    <td><div style="font-weight:600">${esc(p.email)}</div><div class="sub">${new Date(p.created_at).toLocaleDateString("ro-RO")}</div></td>
    <td><select class="urole" style="padding:6px 8px;border:1px solid var(--border-2);border-radius:6px;background:var(--card)">
      <option value="" ${!p.role ? "selected" : ""}>Fără rol</option>
      <option value="user" ${p.role === "user" ? "selected" : ""}>User</option>
      <option value="admin" ${p.role === "admin" ? "selected" : ""}>Admin</option>
    </select></td>
    <td><input class="unume" value="${esc(p.nume || "")}" placeholder="Nume" style="padding:6px 8px;border:1px solid var(--border-2);border-radius:6px;width:150px"></td>
    <td style="white-space:nowrap">
      <button class="btn btn-primary btn-sm usave">Salvează</button>
      <button class="btn btn-default btn-sm udel" ${p.id === currentUser.id ? 'disabled title="Nu îți poți șterge propriul cont"' : ""}>Șterge</button>
    </td>
  </tr>`;
      }
      function bindUserRow(p) {
        const row = document.querySelector(`tr[data-urow="${p.id}"]`);
        if (!row) return;
        row.querySelector(".usave").addEventListener("click", async (e) => {
          const btn = e.currentTarget;
          const role = row.querySelector(".urole").value || null;
          const nume = row.querySelector(".unume").value.trim() || null;
          if (p.id === currentUser.id && role !== "admin") {
            toast(
              "Nu îți poți retrage propriul rol de admin din acest panou",
              true,
            );
            return;
          }
          btn.disabled = true;
          btn.textContent = "Se salvează…";
          const { error } = await sb
            .from("profiles")
            .update({ role, nume, updated_at: new Date().toISOString() })
            .eq("id", p.id);
          btn.disabled = false;
          btn.textContent = "Salvează";
          if (error) {
            toast("Eroare: " + error.message, true);
            return;
          }
          toast("Salvat");
          if (p.id === currentUser.id) {
            currentProfile.role = role;
            currentProfile.nume = nume;
            renderShellUserInfo();
          }
        });
        const delBtn = row.querySelector(".udel");
        if (!delBtn.disabled) {
          delBtn.addEventListener("click", async () => {
            if (
              !confirm(
                `Ștergi definitiv contul ${p.email}? Acțiunea nu poate fi anulată.`,
              )
            )
              return;
            delBtn.disabled = true;
            delBtn.textContent = "Se șterge…";
            const { data, error } = await sb.functions.invoke("delete-user", {
              body: { target_id: p.id },
            });
            const errMsg = error?.message || data?.error;
            if (errMsg) {
              toast("Eroare la ștergere: " + errMsg, true);
              delBtn.disabled = false;
              delBtn.textContent = "Șterge";
              return;
            }
            toast("Cont șters");
            row.remove();
          });
        }
      }
      async function doLogout() {
        await sb.auth.signOut();
      }

      /* ===== AUTENTIFICARE ===== */
      function fieldLabel(t) {
        return `<label>${t}</label>`;
      }
      function renderAuthScreen(mode) {
        mode = mode || "login";
        document.getElementById("appRoot").style.display = "none";
        const el = document.getElementById("authScreen");
        el.innerHTML = `
  <div class="authwrap"><div style="width:100%;max-width:400px">
    <div class="authbrand"><b>Geeli Import · ERP</b><span>Cost real intrare</span></div>
    <div class="authcard">
      <div class="authtabs">
        <button class="authtab ${mode === "login" ? "active" : ""}" data-tab="login">Autentificare</button>
        <button class="authtab ${mode === "signup" ? "active" : ""}" data-tab="signup">Cont nou</button>
        <button class="authtab ${mode === "forgot" ? "active" : ""}" data-tab="forgot">Am uitat parola</button>
      </div>
      <div id="authPanel"></div>
    </div>
  </div></div>`;
        el.querySelectorAll(".authtab").forEach((b) =>
          b.addEventListener("click", () => renderAuthScreen(b.dataset.tab)),
        );
        const panel = document.getElementById("authPanel");
        if (mode === "login") {
          panel.innerHTML = loginForm();
          bindLoginForm();
        }
        if (mode === "signup") {
          panel.innerHTML = signupForm();
          bindSignupForm();
        }
        if (mode === "forgot") {
          panel.innerHTML = forgotForm();
          bindForgotForm();
        }
      }
      function loginForm() {
        return `<form id="formLogin" class="authform">
  <div class="f">${fieldLabel("Email")}<input type="email" id="loginEmail" required placeholder="nume@exemplu.ro"></div>
  <div class="f">${fieldLabel("Parolă")}<input type="password" id="loginPass" required placeholder="••••••••"></div>
  <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Autentificare</button>
  <p id="loginMsg" class="authmsg"></p>
</form>`;
      }
      function bindLoginForm() {
        document
          .getElementById("formLogin")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector("button");
            btn.disabled = true;
            const email = document.getElementById("loginEmail").value.trim();
            const pass = document.getElementById("loginPass").value;
            const { error } = await sb.auth.signInWithPassword({
              email,
              password: pass,
            });
            btn.disabled = false;
            const msg = document.getElementById("loginMsg");
            if (error) {
              msg.className = "authmsg err";
              msg.textContent = error.message.includes("Invalid login")
                ? "Email sau parolă incorectă."
                : error.message;
            }
          });
      }
      function signupForm() {
        return `<form id="formSignup" class="authform">
  <div class="f">${fieldLabel("Email")}<input type="email" id="signupEmail" required placeholder="nume@exemplu.ro"></div>
  <div class="f">${fieldLabel("Parolă")}<input type="password" id="signupPass" required minlength="6" placeholder="Minim 6 caractere"></div>
  <div class="f">${fieldLabel("Confirmă parola")}<input type="password" id="signupPass2" required minlength="6"></div>
  <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Creează cont</button>
  <p id="signupMsg" class="authmsg"></p>
  <p class="authnote">Contul nou nu are niciun rol alocat. Un administrator va activa contul și îi va atribui rolul.</p>
</form>`;
      }
      function bindSignupForm() {
        document
          .getElementById("formSignup")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("signupMsg");
            const email = document.getElementById("signupEmail").value.trim();
            const p1 = document.getElementById("signupPass").value;
            const p2 = document.getElementById("signupPass2").value;
            if (p1 !== p2) {
              msg.className = "authmsg err";
              msg.textContent = "Parolele nu coincid.";
              return;
            }
            const btn = e.target.querySelector("button");
            btn.disabled = true;
            const { error } = await sb.auth.signUp({
              email,
              password: p1,
              options: {
                emailRedirectTo:
                  window.location.origin + window.location.pathname,
              },
            });
            btn.disabled = false;
            if (error) {
              msg.className = "authmsg err";
              msg.textContent = error.message;
            } else {
              msg.className = "authmsg ok";
              msg.textContent =
                "Cont creat. Verifică emailul pentru confirmare (dacă este activată), apoi autentifică-te.";
              e.target.reset();
            }
          });
      }
      function forgotForm() {
        return `<form id="formForgot" class="authform">
  <p class="authnote">Introdu adresa de email folosită la înregistrare. Vei primi un link de resetare a parolei.</p>
  <div class="f">${fieldLabel("Email")}<input type="email" id="forgotEmail" required placeholder="nume@exemplu.ro"></div>
  <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Trimite link de resetare</button>
  <p id="forgotMsg" class="authmsg"></p>
</form>`;
      }
      function bindForgotForm() {
        document
          .getElementById("formForgot")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("forgotMsg");
            const email = document.getElementById("forgotEmail").value.trim();
            const btn = e.target.querySelector("button");
            btn.disabled = true;
            const { error } = await sb.auth.resetPasswordForEmail(email, {
              redirectTo: window.location.origin + window.location.pathname,
            });
            btn.disabled = false;
            if (error) {
              msg.className = "authmsg err";
              msg.textContent = error.message;
            } else {
              msg.className = "authmsg ok";
              msg.textContent =
                "Dacă adresa există, un email cu linkul de resetare a fost trimis.";
            }
          });
      }
      function renderResetPassword() {
        document.getElementById("appRoot").style.display = "none";
        const el = document.getElementById("authScreen");
        el.innerHTML = `<div class="authwrap"><div style="width:100%;max-width:400px"><div class="authcard">
    <h2 style="font-size:16px;font-weight:800;margin-bottom:4px">Modificare parolă</h2>
    <p class="authnote" style="margin-bottom:16px">Alege o parolă nouă pentru contul tău.</p>
    <form id="formReset" class="authform">
      <div class="f">${fieldLabel("Parolă nouă")}<input type="password" id="resetPass" required minlength="6"></div>
      <div class="f">${fieldLabel("Confirmă parola nouă")}<input type="password" id="resetPass2" required minlength="6"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Salvează parola nouă</button>
      <p id="resetMsg" class="authmsg"></p>
    </form>
  </div></div></div>`;
        document
          .getElementById("formReset")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("resetMsg");
            const p1 = document.getElementById("resetPass").value,
              p2 = document.getElementById("resetPass2").value;
            if (p1 !== p2) {
              msg.className = "authmsg err";
              msg.textContent = "Parolele nu coincid.";
              return;
            }
            const { error } = await sb.auth.updateUser({ password: p1 });
            if (error) {
              msg.className = "authmsg err";
              msg.textContent = error.message;
            } else {
              msg.className = "authmsg ok";
              msg.textContent = "Parola a fost schimbată. Redirecționare…";
              recoveryMode = false;
              setTimeout(async () => {
                const {
                  data: { session },
                } = await sb.auth.getSession();
                if (session) {
                  currentUser = session.user;
                  await loadProfileAndRender();
                } else renderAuthScreen();
              }, 1200);
            }
          });
      }
      function renderConfirmScreen(tokenHash, type) {
        const isRecovery = type === "recovery";
        document.getElementById("appRoot").style.display = "none";
        const el = document.getElementById("authScreen");
        el.innerHTML = `<div class="authwrap"><div style="width:100%;max-width:400px"><div class="authcard" style="text-align:center">
    <h2 style="font-size:16px;font-weight:800;margin-bottom:4px">${isRecovery ? "Resetare parolă" : "Confirmare cont"}</h2>
    <p class="authnote" style="margin-bottom:16px">${isRecovery ? "Apasă butonul de mai jos pentru a continua resetarea parolei." : "Apasă butonul de mai jos pentru a-ți confirma adresa de email."}</p>
    <button id="btnConfirmOtp" class="btn btn-primary" style="width:100%;justify-content:center">${isRecovery ? "Continuă" : "Confirmă contul"}</button>
    <p id="confirmMsg" class="authmsg" style="margin-top:10px"></p>
  </div></div></div>`;
        document
          .getElementById("btnConfirmOtp")
          .addEventListener("click", async () => {
            const btn = document.getElementById("btnConfirmOtp");
            const msg = document.getElementById("confirmMsg");
            btn.disabled = true;
            btn.textContent = "Se verifică…";
            const { error } = await sb.auth.verifyOtp({
              token_hash: tokenHash,
              type,
            });
            window.history.replaceState(
              {},
              document.title,
              window.location.pathname,
            );
            if (error) {
              msg.className = "authmsg err";
              msg.textContent = "Linkul nu mai este valid. Cere un link nou.";
              btn.disabled = false;
              btn.textContent = isRecovery ? "Continuă" : "Confirmă contul";
              return;
            }
            if (isRecovery) {
              recoveryMode = true;
              renderResetPassword();
            } else {
              await sb.auth.signOut();
              renderAuthScreen("login");
              toast("Cont confirmat cu succes. Te poți autentifica.");
            }
          });
      }
      function renderPending() {
        document.getElementById("appRoot").style.display = "none";
        const el = document.getElementById("authScreen");
        el.innerHTML = `<div class="pendingwrap"><div class="pendingcard">
    <h2 style="font-size:17px;font-weight:800;margin-bottom:8px">Cont în așteptare</h2>
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:18px">Contul tău a fost creat cu succes, dar încă nu are un rol alocat. Contactează un administrator pentru activare.</p>
    <button id="btnLogoutPending" class="btn btn-default">Deconectare</button>
  </div></div>`;
        document
          .getElementById("btnLogoutPending")
          .addEventListener("click", () => sb.auth.signOut());
      }
      async function loadProfileAndRender() {
        const { data, error } = await sb
          .from("profiles")
          .select("*")
          .eq("id", currentUser.id)
          .maybeSingle();
        if (error)
          toast("Eroare la încărcarea profilului: " + error.message, true);
        currentProfile = data || null;
        if (!currentProfile || !currentProfile.role) {
          renderPending();
          return;
        }
        document.getElementById("authScreen").innerHTML = "";
        document.getElementById("appRoot").style.display = "";
        renderShellUserInfo();
        DB = await load();
        migrate();
        render();
      }
      sb.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") {
          recoveryMode = true;
          renderResetPassword();
          return;
        }
        if (event === "SIGNED_OUT") {
          currentUser = null;
          currentProfile = null;
          renderAuthScreen();
          return;
        }
        if (session && !recoveryMode) {
          const sameUser = currentUser && currentUser.id === session.user.id;
          currentUser = session.user;
          if (sameUser && currentProfile) return;
          loadProfileAndRender();
        }
      });
      (async function initAuth() {
        const tokenHash = new URLSearchParams(window.location.search).get(
          "token_hash",
        );
        const otpType = new URLSearchParams(window.location.search).get("type");
        if (tokenHash && otpType) {
          renderConfirmScreen(tokenHash, otpType);
          return;
        }
        const {
          data: { session },
        } = await sb.auth.getSession();
        if (session) {
          currentUser = session.user;
          await loadProfileAndRender();
        } else renderAuthScreen();
      })();
    </script>
  </body>
</html>
